<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" role="img" aria-labelledby="cf-V-02-t cf-V-02-d">
<title id="cf-V-02-t">What the label carries and what only the SDS carries</title>
<desc id="cf-V-02-d">The container label sits inside the Safety Data Sheet: both carry hazard essentials, while only the SDS adds emergency, exposure-limit and PPE detail.</desc>
<style>
.cf-V-02-outer{fill:var(--cf-accent-soft,#e6f4f6);stroke:var(--cf-viz-2,#2f6db5);stroke-width:1.5}
.cf-V-02-inner{fill:var(--cf-surface,#fff);stroke:var(--cf-viz-1,#0b7285);stroke-width:2}
.cf-V-02-h{fill:var(--cf-fg,#1b2530);font-weight:700;font-size:17px}
.cf-V-02-t{fill:var(--cf-fg,#1b2530);font-size:14.5px}
.cf-V-02-m{fill:var(--cf-fg-muted,#56616b);font-size:14.5px}
.cf-V-02-dot1{fill:var(--cf-viz-1,#0b7285)}
.cf-V-02-dot2{fill:var(--cf-viz-2,#2f6db5)}
</style>
<rect class="cf-V-02-outer" x="4" y="4" width="512" height="272" rx="16"/>
<text class="cf-V-02-h" x="24" y="34">Safety Data Sheet</text>
<text class="cf-V-02-m" x="186" y="34">— the full reference</text>
<rect class="cf-V-02-inner" x="20" y="52" width="232" height="206" rx="12"/>
<text class="cf-V-02-h" x="38" y="82">Container label</text>
<circle class="cf-V-02-dot1" cx="42" cy="110" r="4"/><text class="cf-V-02-t" x="54" y="115">Product identifier</text>
<circle class="cf-V-02-dot1" cx="42" cy="138" r="4"/><text class="cf-V-02-t" x="54" y="143">Signal word, pictograms</text>
<circle class="cf-V-02-dot1" cx="42" cy="166" r="4"/><text class="cf-V-02-t" x="54" y="171">Hazard statements</text>
<circle class="cf-V-02-dot1" cx="42" cy="194" r="4"/><text class="cf-V-02-t" x="54" y="199">Precautionary statements</text>
<circle class="cf-V-02-dot1" cx="42" cy="222" r="4"/><text class="cf-V-02-t" x="54" y="227">Supplier details</text>
<text class="cf-V-02-m" x="274" y="82">Only on the SDS</text>
<circle class="cf-V-02-dot2" cx="280" cy="110" r="4"/><text class="cf-V-02-t" x="292" y="115">Composition (Section 3)</text>
<circle class="cf-V-02-dot2" cx="280" cy="138" r="4"/><text class="cf-V-02-t" x="292" y="143">First aid (Section 4)</text>
<circle class="cf-V-02-dot2" cx="280" cy="166" r="4"/><text class="cf-V-02-t" x="292" y="171">Fire and spill (5–6)</text>
<circle class="cf-V-02-dot2" cx="280" cy="194" r="4"/><text class="cf-V-02-t" x="292" y="199">Exposure limits, PPE (8)</text>
<circle class="cf-V-02-dot2" cx="280" cy="222" r="4"/><text class="cf-V-02-t" x="292" y="227">Properties, toxicology</text>
</svg>
