<script>
const COURSE = {"id": "chemical-risk-capa-2026", "version": "1.0.0", "title": "Laboratory Chemical Risk, Incident Investigation, and CAPA", "subtitle": "Interactive portfolio course · Canada / Alberta context", "estimatedMinutes": 120, "metadata": {"Course title": "Laboratory Chemical Risk, Incident Investigation, and CAPA", "Course level": "Awareness and applied decision support for educated, nontechnical professionals", "Intended audience": "Laboratory operations, biotechnology, healthcare or clinical laboratory staff, research support, quality, safety, compliance, administration, project/program coordination, and related operational roles.", "Assumed prior knowledge": "General workplace literacy and ability to follow workplace procedures. No chemistry, toxicology, occupational-hygiene, incident-investigation, WHMIS-law, or CAPA specialization is assumed.", "Recommended prerequisites / optional preparation": "No formal prerequisite. Optional preparation: the learner may review their organization’s local chemical-safety, emergency, incident-reporting, and hazardous-waste procedures because this course does not replace them.", "Estimated seat time": "Approximately 120 minutes for the required path, including formative practice and graded assessment. Optional technical-depth blocks and references are outside the core seat-time estimate.", "Course description": "A practical course on turning chemical hazard information into task-specific risk decisions, selecting controls, recognizing change and escalation boundaries, supporting incident investigation, and building corrective actions that can be checked for effectiveness. Canadian WHMIS and Alberta occupational-health-and-safety requirements provide the primary regulatory context.", "Learning objectives": "LO1 Distinguish hazard, exposure, risk, consequence, and likelihood, and explain the federal-supplier / Alberta-workplace WHMIS context. LO2 Identify the chemical, SDS, label, inventory, and task information needed for a task-specific risk assessment. LO3 Compare control options and select higher-priority controls using the hierarchy of controls, while recognizing specialist boundaries. LO4 Identify when change, an emergency, a serious/high-potential event, investigation, or scene/evidence preservation requires escalation. LO5 Organize evidence and identify plausible contributing/system factors without stopping at “worker error” or presenting hypotheses as proven causes. LO6 Distinguish correction, containment, corrective action, and preventive action; evaluate action-to-cause alignment; and identify a meaningful effectiveness check.", "Scope and qualification boundaries": "Completion supports informed participation, recognition, interpretation, documentation, comparison, and escalation. It does not qualify learners to select respirators, cartridges, gloves, exposure limits, or disposal routes; conduct professional industrial-hygiene sampling; perform hazardous neutralization or specialist spill response; handle highly reactive materials without competent supervision; provide medical or legal advice; certify ventilation; perform reactive-chemistry scale-up; or independently determine regulatory reportability in ambiguous cases."}, "screens": [{"id": "S1-01", "kind": "content", "type": "section title", "subtype": "title block", "title": "Laboratory Chemical Risk, Incident Investigation, and CAPA", "contentHtml": "<p>Recognizing a hazard symbol is only the starting point in laboratory chemical safety. What matters is what the material can do in the specific task, how exposure or another failure could occur, whether the controls actually work, and what the organization does with problems it finds. The course follows that cycle: <strong>identify → assess → control → respond → investigate → correct → check effectiveness → learn.<\/strong><\/p>", "contentText": "Recognizing a hazard symbol is only the starting point in laboratory chemical safety. What matters is what the material can do in the specific task, how exposure or another failure could occur, whether the controls actually work, and what the organization does with problems it finds. The course follows that cycle: identify → assess → control → respond → investigate → correct → check effectiveness → learn.", "treatment": "Opening statement only. Establishes the course’s closed-loop mental model without testing the learner yet.", "visualDirection": "Original diagram: a closed-loop process with eight labelled steps. Do not reproduce a protected external figure.", "accessibility": "Text equivalent is the eight-step sequence written in the content itself. Diagram labels must be readable without colour.", "objectives": ["LO1–LO6"], "sources": ["AB-OHS-2", "CCOHS-SDS", "CCOHS-INVEST", "HC-CAPA"], "module": "S1", "moduleTitle": "Course introduction", "visual": "V-01", "optional": false}, {"id": "S1-02", "kind": "content", "type": "content", "subtype": "relevance", "title": "Why this matters in laboratory work", "contentHtml": "<p>A hazardous product can be correctly labelled and still be used in a poorly controlled task. An incident can leave no one injured yet expose a serious weakness. A corrective action can be finished on time without fixing the underlying problem. This course focuses on using information in the context of the <strong>actual work<\/strong>, knowing when a decision is outside your role, and bringing in the right technical or organizational support.<\/p>", "contentText": "A hazardous product can be correctly labelled and still be used in a poorly controlled task. An incident can leave no one injured yet expose a serious weakness. A corrective action can be finished on time without fixing the underlying problem. This course focuses on using information in the context of the actual work, knowing when a decision is outside your role, and bringing in the right technical or organizational support.", "treatment": "Connects the course to operational roles rather than specialist chemistry.", "visualDirection": "No image required. A simple three-column original graphic may show “information → decision → learning” if desired.", "accessibility": "All meaning is present in text; graphic is optional.", "objectives": ["LO1–LO6"], "sources": ["AB-OHS-2", "AB-OHS-ACT-33", "HC-CAPA"], "module": "S1", "moduleTitle": "Course introduction", "visual": null, "optional": false}, {"id": "S1-03", "kind": "content", "type": "content", "subtype": "scope", "title": "What the course covers", "contentHtml": "<p>You will work with six connected ideas: <strong>(1)<\/strong> hazard, exposure, and task-specific risk; <strong>(2)<\/strong> Workplace Hazardous Materials Information System (WHMIS) labels, Safety Data Sheets (SDSs), and chemical inventory information; <strong>(3)<\/strong> the hierarchy of controls, storage, ventilation, and change review; <strong>(4)<\/strong> emergency response and incident escalation; <strong>(5)<\/strong> evidence-based investigation and system causes; and <strong>(6)<\/strong> corrective and preventive action (CAPA), effectiveness checks, and safety indicators.<\/p>", "contentText": "You will work with six connected ideas: (1) hazard, exposure, and task-specific risk; (2) Workplace Hazardous Materials Information System (WHMIS) labels, Safety Data Sheets (SDSs), and chemical inventory information; (3) the hierarchy of controls, storage, ventilation, and change review; (4) emergency response and incident escalation; (5) evidence-based investigation and system causes; and (6) corrective and preventive action (CAPA), effectiveness checks, and safety indicators.", "treatment": "Provides a concise conceptual map. Acronyms are defined on first use.", "visualDirection": "Original six-part pathway diagram, not decorative imagery.", "accessibility": "Text list is the complete alternative.", "objectives": ["LO1–LO6"], "sources": ["HC-WHMIS-RR", "AB-OHS-2", "AB-OHS-7", "CCOHS-INVEST", "HC-CAPA", "CCOHS-INDICATORS"], "module": "S1", "moduleTitle": "Course introduction", "visual": null, "optional": false}, {"id": "S1-04", "kind": "content", "type": "comparison", "subtype": "scope boundary", "title": "What this course prepares you to do", "contentHtml": "<p><strong>After the course, you should be able to:<\/strong> recognize what information a chemical-risk decision needs; compare controls; spot change and escalation triggers; support evidence collection; recognize why “worker error” is an incomplete explanation; and judge whether a proposed CAPA addresses a supported cause and includes a useful effectiveness check.<br><br><strong>The course does not authorize you to:<\/strong> select specialist chemical personal protective equipment (PPE), set exposure limits, perform industrial-hygiene sampling, conduct hazardous spill neutralization, approve reactive-chemistry scale-up, provide legal or medical advice, or replace local emergency and reporting procedures.<\/p>", "contentText": "After the course, you should be able to: recognize what information a chemical-risk decision needs; compare controls; spot change and escalation triggers; support evidence collection; recognize why “worker error” is an incomplete explanation; and judge whether a proposed CAPA addresses a supported cause and includes a useful effectiveness check. The course does not authorize you to: select specialist chemical personal protective equipment (PPE), set exposure limits, perform industrial-hygiene sampling, conduct hazardous spill neutralization, approve reactive-chemistry scale-up, provide legal or medical advice, or replace local emergency and reporting procedures.", "treatment": "Side-by-side comparison. The second column is treated as a safety boundary, not a disclaimer hidden at the end.", "visualDirection": "Original two-column “Can support / Requires qualified local or specialist authority” layout.", "accessibility": "Render as headings and lists in reading order; no reliance on colour or icons.", "objectives": ["LO1–LO6"], "sources": ["AB-OHS-4 ss.16–24", "AB-OHS-ACT-33", "source dossier §26"], "module": "S1", "moduleTitle": "Course introduction", "visual": null, "optional": false}, {"id": "S1-05", "kind": "content", "type": "content", "subtype": "objectives", "title": "Learning objectives", "contentHtml": "<p>By the end of the course, you will be able to:<br><br>1. <strong>Distinguish<\/strong> hazard, exposure, risk, consequence, and likelihood, and explain how federal supplier requirements and Alberta workplace duties fit together.<br>2. <strong>Identify<\/strong> the label, SDS, inventory, and task information needed for task-specific risk assessment.<br>3. <strong>Compare and select<\/strong> control priorities using the hierarchy of controls, while recognizing when specialist review is needed.<br>4. <strong>Identify and escalate<\/strong> changes, emergencies, and serious or high-potential events appropriately.<br>5. <strong>Analyze<\/strong> incident evidence without stopping at worker error or treating an unproven theory as fact.<br>6. <strong>Evaluate<\/strong> corrective actions and effectiveness checks for alignment with the identified problem and causes.<\/p>", "contentText": "By the end of the course, you will be able to: 1. Distinguish hazard, exposure, risk, consequence, and likelihood, and explain how federal supplier requirements and Alberta workplace duties fit together. 2. Identify the label, SDS, inventory, and task information needed for task-specific risk assessment. 3. Compare and select control priorities using the hierarchy of controls, while recognizing when specialist review is needed. 4. Identify and escalate changes, emergencies, and serious or high-potential events appropriately. 5. Analyze incident evidence without stopping at worker error or treating an unproven theory as fact. 6. Evaluate corrective actions and effectiveness checks for alignment with the identified problem and causes.", "treatment": "Objectives are shown as performance statements. No interaction.", "visualDirection": "No visual needed beyond numbered typography.", "accessibility": "Numbered list is fully accessible.", "objectives": ["LO1–LO6"], "sources": ["HC-WHMIS-RR", "AB-OHS-2", "AB-OHS-7", "AB-OHS-ACT-33", "CCOHS-SDS", "CCOHS-INVEST", "HC-CAPA"], "module": "S1", "moduleTitle": "Course introduction", "visual": null, "optional": false}, {"id": "S1-06", "kind": "content", "type": "scenario", "subtype": "continuing case introduction", "title": "Continuing case: the shared waste station", "contentHtml": "<p>Throughout the course, you will return to a fictional laboratory that uses several liquid waste streams. A shared waste area has containers labelled with project shorthand. One process has recently changed, but the waste station and its labels have not been reviewed. Later, a worker notices unexpected heat while beginning a disposal step and stops before a larger addition occurs.<br><br>The case is fictional. Its purpose is to practise how information, controls, investigation, and CAPA connect. It is <strong>not<\/strong> a chemical-handling procedure.<\/p>", "contentText": "Throughout the course, you will return to a fictional laboratory that uses several liquid waste streams. A shared waste area has containers labelled with project shorthand. One process has recently changed, but the waste station and its labels have not been reviewed. Later, a worker notices unexpected heat while beginning a disposal step and stops before a larger addition occurs. The case is fictional. Its purpose is to practise how information, controls, investigation, and CAPA connect. It is not a chemical-handling procedure.", "treatment": "Introduces the recurring case without revealing all later evidence. No hazardous operational detail is included.", "visualDirection": "Original schematic of a generic waste station with non-chemical labels such as “Stream A / Project B”; do not show reaction details.", "accessibility": "Provide the full scenario in text. Any schematic must have labels and a descriptive alternative.", "objectives": ["LO1–LO6"], "sources": ["AB-OHS-29 s.396", "AB-OHS-ACT-33(5)", "CCOHS-INVEST", "HC-CAPA"], "module": "S1", "moduleTitle": "Course introduction", "visual": null, "optional": false}, {"id": "S2-01", "kind": "content", "type": "topic title", "subtype": "foundation", "title": "The mental model: from hazard information to workplace risk", "contentHtml": "<p>Before using a label, SDS, risk matrix, or control list, keep one distinction clear: <strong>the chemical hazard is not the same thing as the risk of the task.<\/strong> Risk changes with the way the material is used, the opportunity for exposure or an uncontrolled event, the controls in place, and abnormal conditions that can occur.<\/p>", "contentText": "Before using a label, SDS, risk matrix, or control list, keep one distinction clear: the chemical hazard is not the same thing as the risk of the task. Risk changes with the way the material is used, the opportunity for exposure or an uncontrolled event, the controls in place, and abnormal conditions that can occur.", "treatment": "Foundation statement. It is intentionally repeated later through retrieval practice.", "visualDirection": "Original “hazard information + task conditions + exposure opportunity + controls + abnormal conditions → task risk” diagram.", "accessibility": "The complete equation-like sentence is provided in text.", "objectives": ["LO1"], "sources": ["AB-OHS-2", "AB-OHS-4", "CCOHS-SDS"], "module": "S2", "moduleTitle": "Background and foundations", "visual": null, "optional": false}, {"id": "S2-02", "kind": "content", "type": "comparison", "subtype": "evidence hierarchy", "title": "Not every source has the same authority", "contentHtml": "<p>The source matters. Throughout the course, each claim is treated according to the authority behind it. <strong>Legislation and regulation<\/strong> set enforceable requirements in their jurisdiction. <strong>Government guidance<\/strong> explains or supports requirements but is not automatically legislation. <strong>Standards and international frameworks<\/strong> can be influential without being law unless adopted through another mechanism. <strong>Peer-reviewed evidence<\/strong> can inform practice. <strong>Good-practice synthesis<\/strong> combines sources into practical recommendations and must not be presented as a legal requirement.<\/p>", "contentText": "The source matters. Throughout the course, each claim is treated according to the authority behind it. Legislation and regulation set enforceable requirements in their jurisdiction. Government guidance explains or supports requirements but is not automatically legislation. Standards and international frameworks can be influential without being law unless adopted through another mechanism. Peer-reviewed evidence can inform practice. Good-practice synthesis combines sources into practical recommendations and must not be presented as a legal requirement.", "treatment": "Five-category comparison. Learner is told that course citations preserve these distinctions.", "visualDirection": "Original five-level evidence ladder with text labels only.", "accessibility": "Provide the five categories in a numbered list; no meaning conveyed only by position or colour.", "objectives": ["LO1"], "sources": ["HPA-13", "HPA-14", "HPR", "AB-OHS-2", "ISO-45001", "WHO-LQMS"], "module": "S2", "moduleTitle": "Background and foundations", "visual": "V-02", "optional": false}, {"id": "S2-03", "kind": "content", "type": "content", "subtype": "terminology", "title": "Hazard, exposure, and risk", "contentHtml": "<p><strong>Hazard:<\/strong> something with the potential to cause harm.<br><br><strong>Exposure:<\/strong> contact with a harmful agent through a relevant route, such as inhalation, skin or eye contact, ingestion, or injection.<br><br><strong>Risk:<\/strong> a judgment about the likelihood and consequence of harm under the actual conditions of work.<br><br>A sealed container and an open heated transfer may involve the same chemical hazard, but the risk is different because the exposure opportunity and process conditions are different.<\/p>", "contentText": "Hazard: something with the potential to cause harm. Exposure: contact with a harmful agent through a relevant route, such as inhalation, skin or eye contact, ingestion, or injection. Risk: a judgment about the likelihood and consequence of harm under the actual conditions of work. A sealed container and an open heated transfer may involve the same chemical hazard, but the risk is different because the exposure opportunity and process conditions are different.", "treatment": "Plain-language definitions followed by one bounded example.", "visualDirection": "Original three-box diagram with arrows from hazard to exposure opportunity to risk decision.", "accessibility": "Definitions and example are fully present in text.", "objectives": ["LO1"], "sources": ["AB-OHS-2", "AB-OHS-4", "CCOHS-SDS"], "module": "S2", "moduleTitle": "Background and foundations", "visual": "V-03", "optional": false}, {"id": "S2-04", "kind": "content", "type": "content", "subtype": "terminology", "title": "Consequence and likelihood", "contentHtml": "<p><strong>Consequence<\/strong> asks: “How serious could a credible outcome be?” It may range from minor reversible effects to severe injury, illness, fire, explosion, environmental release, or fatality.<br><br><strong>Likelihood<\/strong> asks: “How likely is the exposure or event under these conditions?” Consider task frequency, control reliability, abnormal conditions, prior near misses, and uncertainty.<br><br>Do not rate likelihood only from memory of past injuries. A rare event can still deserve strong controls when the credible consequence is severe.<\/p>", "contentText": "Consequence asks: “How serious could a credible outcome be?” It may range from minor reversible effects to severe injury, illness, fire, explosion, environmental release, or fatality. Likelihood asks: “How likely is the exposure or event under these conditions?” Consider task frequency, control reliability, abnormal conditions, prior near misses, and uncertainty. Do not rate likelihood only from memory of past injuries. A rare event can still deserve strong controls when the credible consequence is severe.", "treatment": "Adds two terms needed for later control and escalation decisions.", "visualDirection": "No decorative image. Optional two-axis conceptual graphic without numeric scoring.", "accessibility": "Text contains the full meaning. Do not use colour alone to signal severity or likelihood.", "objectives": ["LO1"], "sources": ["AB-OHS-2", "CCOHS-INVEST"], "module": "S2", "moduleTitle": "Background and foundations", "visual": null, "optional": false}, {"id": "S2-05", "kind": "content", "type": "process", "subtype": "mental model", "title": "The course decision loop", "contentHtml": "<p>Use this process throughout the course:<br><br>1. <strong>Identify<\/strong> the material, task, and credible hazards.<br>2. <strong>Assess<\/strong> how exposure or an uncontrolled event could occur.<br>3. <strong>Control<\/strong> the risk using higher-order controls where reasonably practicable.<br>4. <strong>Verify<\/strong> that controls and information are current.<br>5. <strong>Respond and escalate<\/strong> when abnormal conditions or incidents occur.<br>6. <strong>Investigate<\/strong> by starting with evidence and testing explanations.<br>7. <strong>Correct<\/strong> the causes supported by that evidence.<br>8. <strong>Check effectiveness<\/strong> and feed learning back into the risk assessment.<\/p>", "contentText": "Use this process throughout the course: 1. Identify the material, task, and credible hazards. 2. Assess how exposure or an uncontrolled event could occur. 3. Control the risk using higher-order controls where reasonably practicable. 4. Verify that controls and information are current. 5. Respond and escalate when abnormal conditions or incidents occur. 6. Investigate by starting with evidence and testing explanations. 7. Correct the causes supported by that evidence. 8. Check effectiveness and feed learning back into the risk assessment.", "treatment": "This becomes the repeated retrieval structure in the review and capstone.", "visualDirection": "Original closed-loop diagram with eight steps and a return arrow from effectiveness to identify/assess.", "accessibility": "Provide ordered list exactly as shown. Diagram has logical reading order.", "objectives": ["LO1–LO6"], "sources": ["AB-OHS-2", "AB-OHS-7", "CCOHS-INVEST", "HC-CAPA"], "module": "S2", "moduleTitle": "Background and foundations", "visual": null, "optional": false}, {"id": "S2-06", "kind": "content", "type": "comparison", "subtype": "regulatory context", "title": "WHMIS and GHS: related, not identical", "contentHtml": "<p>The <strong>Globally Harmonized System of Classification and Labelling of Chemicals (GHS)<\/strong> is an international model for classifying and communicating chemical hazards. <strong>WHMIS<\/strong> is Canada’s workplace hazard-communication system and uses GHS-based concepts through Canadian law. A new GHS edition does not automatically change Canadian legal requirements. The current international edition identified in the research dossier is GHS Revision 11 (2025); Canadian obligations remain those enacted in Canadian law.<\/p>", "contentText": "The Globally Harmonized System of Classification and Labelling of Chemicals (GHS) is an international model for classifying and communicating chemical hazards. WHMIS is Canada’s workplace hazard-communication system and uses GHS-based concepts through Canadian law. A new GHS edition does not automatically change Canadian legal requirements. The current international edition identified in the research dossier is GHS Revision 11 (2025); Canadian obligations remain those enacted in Canadian law.", "treatment": "Clarifies international framework versus domestic legal implementation.", "visualDirection": "Original “international model → Canadian implementation” diagram.", "accessibility": "Text fully states the relationship; visual is supplemental.", "objectives": ["LO1"], "sources": ["UNECE-GHS11", "HC-WHMIS-GUIDE", "HPR"], "module": "S2", "moduleTitle": "Background and foundations", "visual": null, "optional": false}, {"id": "S2-07", "kind": "content", "type": "comparison", "subtype": "regulatory context", "title": "Who is responsible for what?", "contentHtml": "<p><strong>Federal supplier side:<\/strong> the Hazardous Products Act (HPA) and Hazardous Products Regulations (HPR) govern supplier classification and hazard communication for hazardous products intended for workplace use, including supplier labels and SDSs, subject to statutory exceptions.<br><br><strong>Alberta workplace side:<\/strong> employers manage workplace hazard assessment and controls, worker training, workplace labels where required, and SDS acquisition/access under Alberta occupational-health-and-safety law. Workers participate in training and follow required procedures. [HC-WHMIS-RR; HPA-13; HPA-14; AB-OHS-2; AB-OHS-29]<\/p>", "contentText": "Federal supplier side: the Hazardous Products Act (HPA) and Hazardous Products Regulations (HPR) govern supplier classification and hazard communication for hazardous products intended for workplace use, including supplier labels and SDSs, subject to statutory exceptions. Alberta workplace side: employers manage workplace hazard assessment and controls, worker training, workplace labels where required, and SDS acquisition/access under Alberta occupational-health-and-safety law. Workers participate in training and follow required procedures. [HC-WHMIS-RR; HPA-13; HPA-14; AB-OHS-2; AB-OHS-29]", "treatment": "Two-column responsibility comparison. Avoids implying that employers create supplier classifications.", "visualDirection": "Original supplier-to-workplace flow diagram.", "accessibility": "Table/text alternative with columns “Supplier” and “Alberta workplace.”", "objectives": ["LO1"], "sources": ["HC-WHMIS-RR", "HPA-13", "HPA-14", "HPR", "AB-OHS-2", "AB-OHS-29"], "module": "S2", "moduleTitle": "Background and foundations", "visual": "V-04", "optional": false}, {"id": "S2-08", "kind": "content", "type": "comparison", "subtype": "misconception check", "title": "Four common mistakes", "contentHtml": "<ol>\n<li><strong>“The SDS tells me whether the task is safe.”<\/strong> No. It provides product information; the workplace still has to assess the task. [CCOHS-SDS; AB-OHS-4 s.21]<br><br>2. <strong>“PPE is the main control.”<\/strong> No. Alberta’s hierarchy places elimination and engineering ahead of administrative controls and PPE where reasonably practicable. [AB-OHS-2 s.9]<br><br>3. <strong>“No injury means no serious incident.”<\/strong> No. Some high-potential events require investigation. [AB-OHS-ACT-33(5)]<br><br>4. <strong>“Retraining is automatically the corrective action.”<\/strong> No. Actions should address supported causes. [CCOHS-INVEST; HC-CAPA]<\/li>\n<\/ol>", "contentText": "1. “The SDS tells me whether the task is safe.” No. It provides product information; the workplace still has to assess the task. [CCOHS-SDS; AB-OHS-4 s.21] 2. “PPE is the main control.” No. Alberta’s hierarchy places elimination and engineering ahead of administrative controls and PPE where reasonably practicable. [AB-OHS-2 s.9] 3. “No injury means no serious incident.” No. Some high-potential events require investigation. [AB-OHS-ACT-33(5)] 4. “Retraining is automatically the corrective action.” No. Actions should address supported causes. [CCOHS-INVEST; HC-CAPA]", "treatment": "Retrieval-oriented misconception screen; each misconception is revisited later.", "visualDirection": "No image required. Optional four-card layout with all text visible.", "accessibility": "Cards must be keyboard-readable in sequence and not rely on flip/hover.", "objectives": ["LO1", "LO3", "LO4", "LO6"], "sources": ["CCOHS-SDS", "AB-OHS-4 s.21", "AB-OHS-2 s.9", "AB-OHS-ACT-33(5)", "CCOHS-INVEST", "HC-CAPA"], "module": "S2", "moduleTitle": "Background and foundations", "visual": null, "optional": false}, {"id": "S2-09", "kind": "content", "type": "content", "subtype": "optional deeper reading", "title": "Optional context: management systems and laboratory quality", "contentHtml": "<p>The research dossier also reviewed ISO 45001 and the World Health Organization laboratory quality-management handbook as contextual frameworks. They can help explain management-system thinking, but they are <strong>not substitutes for Canadian or Alberta law<\/strong>. ISO 45001:2018 remained current in 2026 while a revision was under development, and the WHO laboratory quality handbook used here was published in 2011. These resources are optional background, not required course content.<\/p>", "contentText": "The research dossier also reviewed ISO 45001 and the World Health Organization laboratory quality-management handbook as contextual frameworks. They can help explain management-system thinking, but they are not substitutes for Canadian or Alberta law. ISO 45001:2018 remained current in 2026 while a revision was under development, and the WHO laboratory quality handbook used here was published in 2011. These resources are optional background, not required course content.", "treatment": "Optional expandable depth. Does not contribute to assessment.", "visualDirection": "No visual required.", "accessibility": "Plain text only.", "objectives": ["Reference only"], "sources": ["ISO-45001", "ISO-DIS", "WHO-LQMS"], "module": "S2", "moduleTitle": "Background and foundations", "visual": null, "optional": true}, {"id": "T1-01", "kind": "content", "type": "topic title", "subtype": "relevance", "title": "Why the task matters as much as the product", "contentHtml": "<p>A product’s hazard classification tells you what the product can do. The <strong>task<\/strong> tells you how that hazard could reach a person or turn into an uncontrolled event. Start by describing the work clearly: receiving, transferring, mixing, heating, cleaning, transporting, maintaining equipment, or disposing of waste. A description such as “use chemical X” is too vague for a useful assessment.<\/p>", "contentText": "A product’s hazard classification tells you what the product can do. The task tells you how that hazard could reach a person or turn into an uncontrolled event. Start by describing the work clearly: receiving, transferring, mixing, heating, cleaning, transporting, maintaining equipment, or disposing of waste. A description such as “use chemical X” is too vague for a useful assessment.", "treatment": "Introduces task definition as the first performance step.", "visualDirection": "Original task-lifecycle strip: receive → store → transfer/use → clean → waste. It illustrates that one product can appear in multiple risk contexts.", "accessibility": "Text lists every lifecycle stage shown.", "objectives": ["LO1", "LO2"], "sources": ["AB-OHS-2 s.7", "AB-OHS-4 s.21", "source dossier §8.1"], "module": "T1", "moduleTitle": "Why the task matters as much as the product", "visual": null, "optional": false}, {"id": "T1-02", "kind": "content", "type": "content", "subtype": "exposure model", "title": "How exposure can happen", "contentHtml": "<p>For chemical work, common exposure routes include <strong>inhalation, skin contact, eye contact, ingestion, and injection or puncture<\/strong>. The amount of exposure also matters: consider concentration or dose, duration, frequency, and the route into the body. A task that generates vapour, aerosol, mist, or dust can create a very different exposure opportunity from the same material in a closed container.<\/p>", "contentText": "For chemical work, common exposure routes include inhalation, skin contact, eye contact, ingestion, and injection or puncture. The amount of exposure also matters: consider concentration or dose, duration, frequency, and the route into the body. A task that generates vapour, aerosol, mist, or dust can create a very different exposure opportunity from the same material in a closed container.", "treatment": "Uses plain-language exposure routes. Does not introduce dose calculations.", "visualDirection": "Original body-outline diagram showing route labels, with no medical illustration detail.", "accessibility": "Alternative is a five-item route list followed by the duration/frequency statement.", "objectives": ["LO1", "LO2"], "sources": ["AB-OHS-4", "CCOHS-SDS", "source dossier §8.3"], "module": "T1", "moduleTitle": "Why the task matters as much as the product", "visual": null, "optional": false}, {"id": "T1-03", "kind": "content", "type": "content", "subtype": "risk factors", "title": "What changes the risk of a laboratory task?", "contentHtml": "<p>Ask about the variables that change exposure or consequence:<br><br>- <strong>amount and concentration<\/strong>;<br>- <strong>physical form<\/strong>, such as gas, volatile liquid, powder, aerosol, or cryogenic liquid;<br>- <strong>duration and frequency<\/strong>;<br>- <strong>worker proximity<\/strong>;<br>- <strong>heat, pressure, vacuum, agitation, centrifugation, sonication, or other process energy<\/strong>;<br>- <strong>incompatible materials<\/strong>;<br>- <strong>equipment and ventilation<\/strong>;<br>- <strong>abnormal conditions<\/strong>, such as power loss, blocked lines, dropped containers, wrong reagent, or ventilation failure.<br><br>Use the list as a prompt for one question: what could make the real task behave differently from normal conditions?<\/p>", "contentText": "Ask about the variables that change exposure or consequence: - amount and concentration; - physical form, such as gas, volatile liquid, powder, aerosol, or cryogenic liquid; - duration and frequency; - worker proximity; - heat, pressure, vacuum, agitation, centrifugation, sonication, or other process energy; - incompatible materials; - equipment and ventilation; - abnormal conditions, such as power loss, blocked lines, dropped containers, wrong reagent, or ventilation failure. Use the list as a prompt for one question: what could make the real task behave differently from normal conditions?", "treatment": "Chunked checklist used later in scenarios. Process-energy examples are conceptual only.", "visualDirection": "Original risk-factor wheel with eight labelled spokes.", "accessibility": "Provide the full bullet list. No information should be conveyed only by icons.", "objectives": ["LO1", "LO2"], "sources": ["AB-OHS-2", "AB-OHS-4 s.21", "CCOHS-SDS", "source dossier §§8.3–8.7"], "module": "T1", "moduleTitle": "Why the task matters as much as the product", "visual": "V-05", "optional": false}, {"id": "T1-04", "kind": "content", "type": "example", "subtype": "worked comparison", "title": "Same hazard, different task risk", "contentHtml": "<p>Consider one corrosive product in three situations:<br><br><strong>A.<\/strong> A closed, intact container in compatible storage.<br><strong>B.<\/strong> A small controlled transfer using the laboratory’s assessed procedure and appropriate controls.<br><strong>C.<\/strong> A larger heated open process.<br><br>The intrinsic corrosive hazard has not disappeared in A or B, but exposure opportunity and credible consequences change across the three tasks. You would not copy the same risk judgment from one situation to the next without reviewing the actual conditions and controls.<\/p>", "contentText": "Consider one corrosive product in three situations: A. A closed, intact container in compatible storage. B. A small controlled transfer using the laboratory’s assessed procedure and appropriate controls. C. A larger heated open process. The intrinsic corrosive hazard has not disappeared in A or B, but exposure opportunity and credible consequences change across the three tasks. You would not copy the same risk judgment from one situation to the next without reviewing the actual conditions and controls.", "treatment": "Comparison deliberately avoids naming a chemical or prescribing equipment.", "visualDirection": "Original three-panel schematic with labels Closed storage / Controlled transfer / Larger heated process.", "accessibility": "Three situations are fully described in text.", "objectives": ["LO1", "LO2"], "sources": ["AB-OHS-2", "CCOHS-SDS", "source dossier §3.3 and §8"], "module": "T1", "moduleTitle": "Why the task matters as much as the product", "visual": null, "optional": false}, {"id": "T1-05", "kind": "content", "type": "content", "subtype": "legal awareness", "title": "Alberta: assess harmful-substance exposure", "contentHtml": "<p>Alberta Occupational Health and Safety (OHS) Code Part 4 requires employers to identify health hazards, assess worker exposure, establish procedures to minimize exposure, inform workers about relevant hazards and measurement results, and train workers in those procedures when workers may be exposed to harmful substances. For listed harmful substances, exposure must be kept as low as reasonably achievable and within applicable occupational exposure limits. Applying specific limits or conducting compliance monitoring can require competent specialist expertise.<\/p>", "contentText": "Alberta Occupational Health and Safety (OHS) Code Part 4 requires employers to identify health hazards, assess worker exposure, establish procedures to minimize exposure, inform workers about relevant hazards and measurement results, and train workers in those procedures when workers may be exposed to harmful substances. For listed harmful substances, exposure must be kept as low as reasonably achievable and within applicable occupational exposure limits. Applying specific limits or conducting compliance monitoring can require competent specialist expertise.", "treatment": "Plain-language legal summary. Keeps specialist boundary explicit.", "visualDirection": "No visual required. Optional callout: “Awareness: recognize when specialist exposure assessment is needed.”", "accessibility": "Text carries full meaning. No acronym without definition.", "objectives": ["LO1", "LO2"], "sources": ["AB-OHS-4 ss.16, 20–22"], "module": "T1", "moduleTitle": "Why the task matters as much as the product", "visual": null, "optional": false}, {"id": "T1-06", "kind": "content", "type": "comparison", "subtype": "specialist boundary", "title": "What an exposure limit can and cannot tell you", "contentHtml": "<p>An <strong>occupational exposure limit (OEL)<\/strong> is a regulated benchmark used in controlling airborne occupational exposure. It is not a universal statement that “anything below this number is harmless.” Alberta also requires exposure to listed harmful substances to be kept as low as reasonably achievable. Combined exposures, longer shifts, measurement methods, and substance-specific details can affect how limits are applied. These are areas for competent occupational-hygiene review, not guesswork by an unqualified worker.<\/p>", "contentText": "An occupational exposure limit (OEL) is a regulated benchmark used in controlling airborne occupational exposure. It is not a universal statement that “anything below this number is harmless.” Alberta also requires exposure to listed harmful substances to be kept as low as reasonably achievable. Combined exposures, longer shifts, measurement methods, and substance-specific details can affect how limits are applied. These are areas for competent occupational-hygiene review, not guesswork by an unqualified worker.", "treatment": "Clarifies OEL boundary without teaching calculations.", "visualDirection": "Original “benchmark, not permission line” graphic with text labels.", "accessibility": "All concepts stated in text; graphic optional.", "objectives": ["LO1", "LO2"], "sources": ["AB-OHS-4 ss.16–20"], "module": "T1", "moduleTitle": "Why the task matters as much as the product", "visual": null, "optional": false}, {"id": "T1-07", "kind": "content", "type": "process", "subtype": "risk decision", "title": "Questions to ask before work starts", "contentHtml": "<p>Before deciding that a chemical task is adequately controlled, ask:<br><br>1. <strong>What is the task?<\/strong><br>2. <strong>What can cause harm?<\/strong><br>3. <strong>How could exposure or an uncontrolled event occur?<\/strong><br>4. <strong>What quantity, concentration, form, duration, and process energy are involved?<\/strong><br>5. <strong>What controls exist, and how reliable are they?<\/strong><br>6. <strong>What abnormal condition could defeat those controls?<\/strong><br>7. <strong>What risk remains, and does the decision require a qualified specialist or local authority?<\/strong><\/p>", "contentText": "Before deciding that a chemical task is adequately controlled, ask: 1. What is the task? 2. What can cause harm? 3. How could exposure or an uncontrolled event occur? 4. What quantity, concentration, form, duration, and process energy are involved? 5. What controls exist, and how reliable are they? 6. What abnormal condition could defeat those controls? 7. What risk remains, and does the decision require a qualified specialist or local authority?", "treatment": "Becomes a reusable job-aid structure. “Residual risk” is intentionally expressed in plain language.", "visualDirection": "Original seven-step vertical decision tree.", "accessibility": "Ordered text list is the accessible alternative.", "objectives": ["LO1", "LO2", "LO3"], "sources": ["AB-OHS-2", "AB-OHS-4 s.21", "source dossier §8"], "module": "T1", "moduleTitle": "Why the task matters as much as the product", "visual": "V-06", "optional": false}, {"id": "T1-08", "kind": "content", "type": "scenario", "subtype": "continuing case", "title": "Shared waste station: what is missing?", "contentHtml": "<p>Return to the shared waste station. You know that several liquid waste streams exist, project shorthand is used on containers, and one process recently changed. You do <strong>not<\/strong> yet know the full chemical identities, concentrations, compatibility, quantities, or what changed in the new process.<br><br>A responsible risk decision cannot be made from the label shorthand alone. Before deciding whether the waste arrangement is adequate, the laboratory needs enough information to identify the materials, determine compatibility, understand the new waste characteristics, and review the controls.<\/p>", "contentText": "Return to the shared waste station. You know that several liquid waste streams exist, project shorthand is used on containers, and one process recently changed. You do not yet know the full chemical identities, concentrations, compatibility, quantities, or what changed in the new process. A responsible risk decision cannot be made from the label shorthand alone. Before deciding whether the waste arrangement is adequate, the laboratory needs enough information to identify the materials, determine compatibility, understand the new waste characteristics, and review the controls.", "treatment": "Learner is shown that “not enough information” can be the correct conclusion.", "visualDirection": "Original schematic of generic labelled containers, no chemical structures or recipes.", "accessibility": "All known/unknown information listed in text.", "objectives": ["LO1", "LO2"], "sources": ["AB-OHS-2 s.7", "AB-OHS-29 s.396", "CCOHS-SDS", "CCOHS-CABINETS"], "module": "T1", "moduleTitle": "Why the task matters as much as the product", "visual": null, "optional": false}, {"id": "T1-09", "kind": "content", "type": "content", "subtype": "synthesis", "title": "Topic 1 synthesis", "contentHtml": "<p><strong>Keep the sequence straight:<\/strong> a chemical has hazards; a task creates exposure and failure opportunities; controls change those opportunities; abnormal conditions can defeat controls; and the risk decision belongs to the actual situation. If information is missing or the task involves specialist exposure, engineering, medical, or high-hazard judgment, the correct action is to stop short of guessing and escalate.<\/p>", "contentText": "Keep the sequence straight: a chemical has hazards; a task creates exposure and failure opportunities; controls change those opportunities; abnormal conditions can defeat controls; and the risk decision belongs to the actual situation. If information is missing or the task involves specialist exposure, engineering, medical, or high-hazard judgment, the correct action is to stop short of guessing and escalate.", "treatment": "Short synthesis immediately before retrieval practice.", "visualDirection": "No visual needed.", "accessibility": "Plain text.", "objectives": ["LO1", "LO2"], "sources": ["AB-OHS-2", "AB-OHS-4", "source dossier §26"], "module": "T1", "moduleTitle": "Why the task matters as much as the product", "visual": null, "optional": false}, {"id": "F1-01", "kind": "formative", "type": "formative self-assessment", "subtype": "multiple choice", "title": "Knowledge check", "question": {"id": "F1-01", "itemType": "multiple choice", "objectives": ["LO1"], "questionHtml": "<p>A sealed bottle of a corrosive product is moved from compatible storage to a larger heated open process. Which statement best describes what changed?<\/p>", "questionText": "A sealed bottle of a corrosive product is moved from compatible storage to a larger heated open process. Which statement best describes what changed?", "optionsRaw": "A. The product stopped being corrosive.<br>B. The intrinsic hazard stayed, but exposure opportunity and credible consequences changed.<br>C. Risk cannot change unless the SDS changes.<br>D. The task is automatically unsafe because heat is present.", "correctRaw": "B", "feedbackCorrectHtml": "<p>The corrosive hazard remains, but the task conditions can change exposure opportunity, likelihood, and consequence. Risk belongs to the actual task, the product classification alone.<\/p>", "feedbackIncorrectHtml": "<p>A: Hazard does not disappear when the task changes.<br>C: The SDS may be unchanged while workplace risk changes.<br>D: Heat is a relevant risk factor, but the scenario does not justify an automatic overall conclusion without assessment.<\/p>", "sources": ["AB-OHS-2", "CCOHS-SDS", "source dossier §8"], "graded": false, "difficulty": null, "accessibility": "Present as radio-button choices or a keyboard-operable single-select list.", "mode": "single", "options": [{"key": "A", "text": "The product stopped being corrosive."}, {"key": "B", "text": "The intrinsic hazard stayed, but exposure opportunity and credible consequences changed."}, {"key": "C", "text": "Risk cannot change unless the SDS changes."}, {"key": "D", "text": "The task is automatically unsafe because heat is present."}], "correctKey": "B"}, "objectives": ["LO1"], "sources": ["AB-OHS-2", "CCOHS-SDS", "source dossier §8"], "module": "T1", "moduleTitle": "Why the task matters as much as the product", "visual": null, "optional": false}, {"id": "F1-02", "kind": "formative", "type": "formative self-assessment", "subtype": "multiple response", "title": "Knowledge check", "question": {"id": "F1-02", "itemType": "multiple response", "objectives": ["LO2"], "questionHtml": "<p>You are asked whether a new chemical-transfer task is adequately controlled. Which information would materially help the task-specific assessment? Select all that apply.<\/p>", "questionText": "You are asked whether a new chemical-transfer task is adequately controlled. Which information would materially help the task-specific assessment? Select all that apply.", "optionsRaw": "A. Quantity and concentration.<br>B. Physical form and potential exposure route.<br>C. Process temperature/pressure and equipment.<br>D. Ventilation and other existing controls.<br>E. Whether abnormal conditions such as power or ventilation failure are credible.", "correctRaw": "A, B, C, D, and E", "feedbackCorrectHtml": "<p>All five can change exposure opportunity or consequence and therefore belong in task-specific risk thinking.<\/p>", "feedbackIncorrectHtml": "<p>Any omitted option leaves out a variable identified in the research dossier as relevant to task risk. The exercise is not asking you to calculate risk; it is asking what information matters.<\/p>", "sources": ["AB-OHS-2", "AB-OHS-4 s.21", "CCOHS-SDS", "source dossier §8"], "graded": false, "difficulty": null, "accessibility": "Use checkboxes or a keyboard-operable multi-select list; do not require drag-and-drop.", "mode": "multi", "options": [{"key": "A", "text": "Quantity and concentration."}, {"key": "B", "text": "Physical form and potential exposure route."}, {"key": "C", "text": "Process temperature/pressure and equipment."}, {"key": "D", "text": "Ventilation and other existing controls."}, {"key": "E", "text": "Whether abnormal conditions such as power or ventilation failure are credible."}], "correctKeys": ["A", "B", "C", "D", "E"]}, "objectives": ["LO2"], "sources": ["AB-OHS-2", "AB-OHS-4 s.21", "CCOHS-SDS", "source dossier §8"], "module": "T1", "moduleTitle": "Why the task matters as much as the product", "visual": null, "optional": false}, {"id": "F1-03", "kind": "formative", "type": "formative self-assessment", "subtype": "scenario judgment", "title": "Knowledge check", "question": {"id": "F1-03", "itemType": "scenario judgment", "objectives": ["LO1", "LO2"], "questionHtml": "<p>A supervisor says, “The SDS lists an exposure limit, so the task is safe as long as we are under it.” What is the best response at this course level?<\/p>", "questionText": "A supervisor says, “The SDS lists an exposure limit, so the task is safe as long as we are under it.” What is the best response at this course level?", "optionsRaw": "A. Agree; the exposure limit is a universal safe/unsafe line.<br>B. Disagree; Alberta also requires exposure to be kept as low as reasonably achievable, and applying limits or measurement results can require competent specialist review.<br>C. Disagree because exposure limits never matter.<br>D. Agree if the worker is wearing any respirator.", "correctRaw": "B", "feedbackCorrectHtml": "<p>Exposure limits matter, but Alberta Part 4 also requires exposure to be kept as low as reasonably achievable (ALARA), and combined exposures, extended shifts, measurement methods, and other details may require competent review.<\/p>", "feedbackIncorrectHtml": "<p>A: Overstates what an OEL means and ignores ALARA.<br>C: OELs are part of the regulatory framework.<br>D: Respiratory protection selection is specialist and program-dependent; “any respirator” is not a valid control conclusion.<\/p>", "sources": ["AB-OHS-4 ss.16–20"], "graded": false, "difficulty": null, "accessibility": "Single-select list with full text visible.", "mode": "single", "options": [{"key": "A", "text": "Agree; the exposure limit is a universal safe/unsafe line."}, {"key": "B", "text": "Disagree; Alberta also requires exposure to be kept as low as reasonably achievable, and applying limits or measurement results can require competent specialist review."}, {"key": "C", "text": "Disagree because exposure limits never matter."}, {"key": "D", "text": "Agree if the worker is wearing any respirator."}], "correctKey": "B"}, "objectives": ["LO1", "LO2"], "sources": ["AB-OHS-4 ss.16–20"], "module": "T1", "moduleTitle": "Why the task matters as much as the product", "visual": null, "optional": false}, {"id": "T2-01", "kind": "content", "type": "topic title", "subtype": "relevance", "title": "Hazard information has to stay connected to the work", "contentHtml": "<p>WHMIS provides a common system for classifying and communicating workplace hazardous-product information. In practice, the information has to survive the full workplace lifecycle: receiving the product, keeping its identity, providing a current SDS, training workers, transferring material, storing it, using it, and managing waste. A gap at any point can weaken the task-specific risk decision.<\/p>", "contentText": "WHMIS provides a common system for classifying and communicating workplace hazardous-product information. In practice, the information has to survive the full workplace lifecycle: receiving the product, keeping its identity, providing a current SDS, training workers, transferring material, storing it, using it, and managing waste. A gap at any point can weaken the task-specific risk decision.", "treatment": "Introduces WHMIS as a flow of information, not a pictogram lesson.", "visualDirection": "Original information-flow diagram from supplier to workplace use/waste.", "accessibility": "Text lists each lifecycle step.", "objectives": ["LO1", "LO2"], "sources": ["HC-WHMIS-RR", "AB-OHS-29"], "module": "T2", "moduleTitle": "Hazard information has to stay connected to the work", "visual": null, "optional": false}, {"id": "T2-02", "kind": "content", "type": "comparison", "subtype": "roles", "title": "Supplier information and workplace control are connected but different", "contentHtml": "<p>Under federal supplier law, suppliers of hazardous products intended for workplace use have classification, SDS, and label duties, subject to the legislation’s exceptions. In Alberta workplaces, employers have duties related to workplace hazard assessment and control, WHMIS training, work-site labels where required, and SDS acquisition and availability. Workers participate by using the information, training, and procedures provided for the work.<\/p>", "contentText": "Under federal supplier law, suppliers of hazardous products intended for workplace use have classification, SDS, and label duties, subject to the legislation’s exceptions. In Alberta workplaces, employers have duties related to workplace hazard assessment and control, WHMIS training, work-site labels where required, and SDS acquisition and availability. Workers participate by using the information, training, and procedures provided for the work.", "treatment": "Two-side model reinforces Section 2.", "visualDirection": "Original split diagram: Federal supplier side / Alberta workplace side.", "accessibility": "Text is complete alternative.", "objectives": ["LO1"], "sources": ["HC-WHMIS-RR", "HPA-13", "HPA-14", "HPR", "AB-OHS-2", "AB-OHS-29"], "module": "T2", "moduleTitle": "Hazard information has to stay connected to the work", "visual": "V-04", "optional": false}, {"id": "T2-03", "kind": "content", "type": "content", "subtype": "labels", "title": "Supplier labels and work-site labels", "contentHtml": "<p>A supplier label communicates the product identity and required supplier hazard information. Alberta requires hazardous products at the work site to have the appropriate supplier or work-site label unless a specific provision applies. If a supplier label becomes illegible or detached while the product remains in its original container, Alberta requires it to be replaced by another supplier label or a work-site label. A work-site label keeps product identity and safe-handling information connected to the material in workplace circumstances where it is required.<\/p>", "contentText": "A supplier label communicates the product identity and required supplier hazard information. Alberta requires hazardous products at the work site to have the appropriate supplier or work-site label unless a specific provision applies. If a supplier label becomes illegible or detached while the product remains in its original container, Alberta requires it to be replaced by another supplier label or a work-site label. A work-site label keeps product identity and safe-handling information connected to the material in workplace circumstances where it is required.", "treatment": "Awareness-level label purpose; avoids reproducing every label element.", "visualDirection": "Original comparison layout with generic label placeholders, not copied commercial labels.", "accessibility": "Text states all instructional content.", "objectives": ["LO2"], "sources": ["AB-OHS-29 s.398"], "module": "T2", "moduleTitle": "Hazard information has to stay connected to the work", "visual": null, "optional": false}, {"id": "T2-04", "kind": "content", "type": "content", "subtype": "lab variation", "title": "Decanted products: “temporary” is not the legal test", "contentHtml": "<p>In Alberta, transferring a hazardous product into another container generally triggers a work-site-label requirement unless a specific exception applies. For the portable-container immediate-use exception, all of the product must be required for immediate use; it must remain under the control of and be used exclusively by the worker who filled it; it must be used only during that shift; and its contents must be clearly identified. “It is only temporary” is not enough by itself.<\/p>", "contentText": "In Alberta, transferring a hazardous product into another container generally triggers a work-site-label requirement unless a specific exception applies. For the portable-container immediate-use exception, all of the product must be required for immediate use; it must remain under the control of and be used exclusively by the worker who filled it; it must be used only during that shift; and its contents must be clearly identified. “It is only temporary” is not enough by itself.", "treatment": "Exact conditions are stated because this is a high-value laboratory misconception.", "visualDirection": "Original four-condition checklist.", "accessibility": "Checklist is presented as text and may be keyboard-navigated.", "objectives": ["LO2"], "sources": ["AB-OHS-29 s.400"], "module": "T2", "moduleTitle": "Hazard information has to stay connected to the work", "visual": null, "optional": false}, {"id": "T2-05", "kind": "content", "type": "content", "subtype": "lab variation", "title": "Laboratory samples: a narrow category, not a blanket exemption", "contentHtml": "<p>Under the federal HPR definition used in the research dossier, a “laboratory sample” is a sample in a container holding less than 10 kg, intended solely to be tested in a laboratory, with exclusions including material used by the laboratory to test other products and material used for education or demonstration. Alberta also has specific workplace labelling provisions for qualifying laboratory samples and certain laboratory-only products. A container does not become exempt simply because it is physically inside a laboratory.<\/p>", "contentText": "Under the federal HPR definition used in the research dossier, a “laboratory sample” is a sample in a container holding less than 10 kg, intended solely to be tested in a laboratory, with exclusions including material used by the laboratory to test other products and material used for education or demonstration. Alberta also has specific workplace labelling provisions for qualifying laboratory samples and certain laboratory-only products. A container does not become exempt simply because it is physically inside a laboratory.", "treatment": "Keeps definition precise without teaching every supplier exception.", "visualDirection": "Original “qualifies / does not automatically qualify” comparison.", "accessibility": "Text carries all conditions stated.", "objectives": ["LO2"], "sources": ["HPR-5", "AB-OHS-29 s.403", "CCOHS-LABS"], "module": "T2", "moduleTitle": "Hazard information has to stay connected to the work", "visual": null, "optional": false}, {"id": "T2-06", "kind": "content", "type": "content", "subtype": "optional technical detail", "title": "Small containers and research samples", "contentHtml": "<p>Optional detail: CCOHS summarizes supplier-label variations for small containers. Containers of 100 mL or less may omit hazard and precautionary statements from the supplier label while the SDS retains the complete statements. Containers of 3 mL or less can use certain removable-label arrangements where a fixed label would interfere with normal use, subject to the HPR conditions. Some research-and-development samples may qualify for laboratory-sample provisions if the statutory criteria are met. These are narrow variations, not “small container” or “research” exemptions from safe work.<\/p>", "contentText": "Optional detail: CCOHS summarizes supplier-label variations for small containers. Containers of 100 mL or less may omit hazard and precautionary statements from the supplier label while the SDS retains the complete statements. Containers of 3 mL or less can use certain removable-label arrangements where a fixed label would interfere with normal use, subject to the HPR conditions. Some research-and-development samples may qualify for laboratory-sample provisions if the statutory criteria are met. These are narrow variations, not “small container” or “research” exemptions from safe work.", "treatment": "Optional progressive disclosure; not assessed for exact volume recall unless retained in local course requirement.", "visualDirection": "No image needed. Small comparison table if desired.", "accessibility": "Plain text.", "objectives": ["Enrichment"], "sources": ["CCOHS-LABS", "HC-WHMIS-GUIDE", "HPR-5"], "module": "T2", "moduleTitle": "Hazard information has to stay connected to the work", "visual": null, "optional": true}, {"id": "T2-07", "kind": "content", "type": "process", "subtype": "SDS navigation", "title": "How to read an SDS strategically", "contentHtml": "<p>The SDS uses a 16-section structure. You do not need to memorize every section number, but you should know where to look:<br><br>- <strong>Section 1:<\/strong> confirm the product.<br>- <strong>Section 2:<\/strong> classified hazards and precautions.<br>- <strong>Section 3:<\/strong> relevant composition information.<br>- <strong>Sections 7 and 10:<\/strong> handling, storage, stability, reactivity, and incompatibilities.<br>- <strong>Section 8:<\/strong> exposure-control and PPE information that must still be interpreted for the task.<br>- <strong>Section 9:<\/strong> physical and chemical properties.<br>- <strong>Section 11:<\/strong> toxicological information.<br>- <strong>Sections 4–6:<\/strong> first aid, fire, and accidental-release information to know before an emergency.<\/p>", "contentText": "The SDS uses a 16-section structure. You do not need to memorize every section number, but you should know where to look: - Section 1: confirm the product. - Section 2: classified hazards and precautions. - Section 3: relevant composition information. - Sections 7 and 10: handling, storage, stability, reactivity, and incompatibilities. - Section 8: exposure-control and PPE information that must still be interpreted for the task. - Section 9: physical and chemical properties. - Section 11: toxicological information. - Sections 4–6: first aid, fire, and accidental-release information to know before an emergency.", "treatment": "Performance is navigation, not rote recall.", "visualDirection": "Original SDS map showing sections grouped by Identify / Hazards / Prevent / Respond.", "accessibility": "Full section list is in text. Provide headings in logical reading order.", "objectives": ["LO2"], "sources": ["CCOHS-SDS"], "module": "T2", "moduleTitle": "Hazard information has to stay connected to the work", "visual": "V-07", "optional": false}, {"id": "T2-08", "kind": "content", "type": "content", "subtype": "limitation", "title": "The SDS is a starting point, not the task assessment", "contentHtml": "<p>An SDS generally does not know your exact quantity, altered concentration, room size, ventilation performance, open-versus-closed handling, temperature, pressure, waste setup, neighbouring incompatibles, task frequency, worker proximity, maintenance condition, or process deviations. It may also be too general to answer specialist PPE or respirator questions. Use it as an authoritative product-information source, then connect it to the actual task and competent workplace assessment.<\/p>", "contentText": "An SDS generally does not know your exact quantity, altered concentration, room size, ventilation performance, open-versus-closed handling, temperature, pressure, waste setup, neighbouring incompatibles, task frequency, worker proximity, maintenance condition, or process deviations. It may also be too general to answer specialist PPE or respirator questions. Use it as an authoritative product-information source, then connect it to the actual task and competent workplace assessment.", "treatment": "Explicitly corrects “SDS = safe-work procedure.”", "visualDirection": "Original graphic: SDS document feeding into a larger “task assessment” box alongside task/equipment/workplace inputs.", "accessibility": "All inputs are listed in text.", "objectives": ["LO2"], "sources": ["CCOHS-SDS", "AB-OHS-4 s.21"], "module": "T2", "moduleTitle": "Hazard information has to stay connected to the work", "visual": "V-08", "optional": false}, {"id": "T2-09", "kind": "content", "type": "content", "subtype": "SDS governance", "title": "SDS availability and currency in Alberta", "contentHtml": "<p>Alberta Part 29 generally requires employers acquiring a hazardous product to obtain the supplier SDS unless an exception applies, and required SDSs must be readily available to workers who may be exposed. The employer must ensure that the SDS received at purchase is the most current version, and Part 29 contains updating requirements when significant new data are provided. The practical lesson is simple: an SDS link that is broken, mismatched, or stale can undermine the information system.<\/p>", "contentText": "Alberta Part 29 generally requires employers acquiring a hazardous product to obtain the supplier SDS unless an exception applies, and required SDSs must be readily available to workers who may be exposed. The employer must ensure that the SDS received at purchase is the most current version, and Part 29 contains updating requirements when significant new data are provided. The practical lesson is simple: an SDS link that is broken, mismatched, or stale can undermine the information system.", "treatment": "Learner-facing content focuses on operational implication; exact update timing can be optional depth.", "visualDirection": "No visual required.", "accessibility": "Plain text.", "objectives": ["LO2"], "sources": ["AB-OHS-29 ss.404–407"], "module": "T2", "moduleTitle": "Hazard information has to stay connected to the work", "visual": null, "optional": false}, {"id": "T2-10", "kind": "content", "type": "content", "subtype": "inventory", "title": "A chemical inventory is part of the safety system", "contentHtml": "<p>A useful chemical inventory needs to do more than list what is on site. It should identify the product, responsible group or owner, approximate quantity, relevant concentration or form, location, compatibility or storage information, SDS link and revision, lifecycle dates where stability matters, access restrictions, and status such as active, quarantined, waste, or disposed. CCOHS describes maintaining an up-to-date laboratory inventory as good practice; the detailed field set here is good-practice synthesis, not a prescribed Alberta form.<\/p>", "contentText": "A useful chemical inventory needs to do more than list what is on site. It should identify the product, responsible group or owner, approximate quantity, relevant concentration or form, location, compatibility or storage information, SDS link and revision, lifecycle dates where stability matters, access restrictions, and status such as active, quarantined, waste, or disposed. CCOHS describes maintaining an up-to-date laboratory inventory as good practice; the detailed field set here is good-practice synthesis, not a prescribed Alberta form.", "treatment": "Explicitly labels detailed schema as synthesis rather than law.", "visualDirection": "Original lifecycle record schematic: receive → own → locate → use → review → waste → close record.", "accessibility": "Text includes field categories and source-status qualification.", "objectives": ["LO2"], "sources": ["CCOHS-LABS", "source dossier §6"], "module": "T2", "moduleTitle": "Hazard information has to stay connected to the work", "visual": "V-09", "optional": false}, {"id": "T2-11", "kind": "content", "type": "example", "subtype": "worked case", "title": "Why inventory quality matters", "contentHtml": "<p>Imagine an emergency responder is told that “several chemicals” are stored in Room 210, but the inventory still assigns them to a former employee and two SDS links no longer open. That weakens the organization’s ability to identify the materials, retrieve current hazard information, review compatibility, and manage the chemical lifecycle. If the same inventory problem keeps returning, fixing one record at a time is unlikely to be enough; the workflow itself may need corrective action.<\/p>", "contentText": "Imagine an emergency responder is told that “several chemicals” are stored in Room 210, but the inventory still assigns them to a former employee and two SDS links no longer open. That weakens the organization’s ability to identify the materials, retrieve current hazard information, review compatibility, and manage the chemical lifecycle. If the same inventory problem keeps returning, fixing one record at a time is unlikely to be enough; the workflow itself may need corrective action.", "treatment": "Bridges inventory to later CAPA topic.", "visualDirection": "No visual required.", "accessibility": "Plain text.", "objectives": ["LO2", "LO6"], "sources": ["CCOHS-LABS", "HC-CAPA"], "module": "T2", "moduleTitle": "Hazard information has to stay connected to the work", "visual": null, "optional": false}, {"id": "T2-12", "kind": "content", "type": "content", "subtype": "synthesis", "title": "Topic 2 synthesis", "contentHtml": "<p>WHMIS hazard communication works only when the right information stays connected to the right product and task. <strong>Labels identify and warn. SDSs explain product hazards and precautions. Inventory tells the organization what it has and where it is. The task assessment decides what those facts mean for the work.<\/strong> When any link is missing, do not fill the gap with assumptions.<\/p>", "contentText": "WHMIS hazard communication works only when the right information stays connected to the right product and task. Labels identify and warn. SDSs explain product hazards and precautions. Inventory tells the organization what it has and where it is. The task assessment decides what those facts mean for the work. When any link is missing, do not fill the gap with assumptions.", "treatment": "Retrieval-ready summary.", "visualDirection": "Original four-link chain: Label → SDS → Inventory → Task assessment.", "accessibility": "Text is complete alternative.", "objectives": ["LO1", "LO2"], "sources": ["HC-WHMIS-RR", "AB-OHS-29", "CCOHS-LABS", "CCOHS-SDS"], "module": "T2", "moduleTitle": "Hazard information has to stay connected to the work", "visual": null, "optional": false}, {"id": "F2-01", "kind": "formative", "type": "formative self-assessment", "subtype": "matching", "title": "Knowledge check", "question": {"id": "F2-01", "itemType": "matching", "objectives": ["LO1"], "questionHtml": "<p>Match each responsibility to the side that primarily carries it in this course context.<\/p>", "questionText": "Match each responsibility to the side that primarily carries it in this course context.", "optionsRaw": "1. Supplier classification and supplier hazard communication.<br>2. Workplace hazard assessment and controls in Alberta.<br>3. Workplace WHMIS training and SDS access in Alberta.<br>4. Following required workplace procedures and training.", "correctRaw": "1 → Federal supplier side; 2 → Alberta employer/workplace side; 3 → Alberta employer/workplace side; 4 → Worker participation/workplace duty context.", "feedbackCorrectHtml": "<p>WHMIS is a shared system: federal supplier law governs supplier classification/communication, while Alberta workplace law governs workplace hazard management, training, labels, and SDS access.<\/p>", "feedbackIncorrectHtml": "<p>If supplier and employer roles are swapped, the error is treating product classification and workplace risk management as the same responsibility. Worker participation does not replace employer duties.<\/p>", "sources": ["HC-WHMIS-RR", "HPA-13", "HPA-14", "AB-OHS-2", "AB-OHS-29"], "graded": false, "difficulty": null, "accessibility": "Provide a two-column keyboard-operable matching list or four drop-downs; never require drag-and-drop.", "mode": "matching", "prompts": [{"key": "1", "text": "Supplier classification and supplier hazard communication."}, {"key": "2", "text": "Workplace hazard assessment and controls in Alberta."}, {"key": "3", "text": "Workplace WHMIS training and SDS access in Alberta."}, {"key": "4", "text": "Following required workplace procedures and training."}], "answerMap": {"1": "Federal supplier side", "2": "Alberta employer/workplace side", "3": "Alberta employer/workplace side", "4": "Worker participation/workplace duty context"}, "targets": ["Federal supplier side", "Alberta employer/workplace side", "Worker participation/workplace duty context"]}, "objectives": ["LO1"], "sources": ["HC-WHMIS-RR", "HPA-13", "HPA-14", "AB-OHS-2", "AB-OHS-29"], "module": "T2", "moduleTitle": "Hazard information has to stay connected to the work", "visual": null, "optional": false}, {"id": "F2-02", "kind": "formative", "type": "formative self-assessment", "subtype": "scenario multiple choice", "title": "Knowledge check", "question": {"id": "F2-02", "itemType": "scenario multiple choice", "objectives": ["LO2"], "questionHtml": "<p>A worker pours a hazardous product into a portable container, plans to use only part of it, leaves the remainder for the next shift, and marks the container with a shorthand name. Which statement is best?<\/p>", "questionText": "A worker pours a hazardous product into a portable container, plans to use only part of it, leaves the remainder for the next shift, and marks the container with a shorthand name. Which statement is best?", "optionsRaw": "A. It clearly meets Alberta’s immediate-use exception because the transfer was temporary.<br>B. It does not meet all four immediate-use conditions described in Alberta s.400; a work-site-label requirement should be addressed.<br>C. No label is needed because the worker knows what is inside.<br>D. Any portable container is automatically a laboratory sample.", "correctRaw": "B", "feedbackCorrectHtml": "<p>The exception requires all product to be for immediate use, exclusive control by the worker who filled it, use during that shift, and clear identification. The scenario fails those conditions.<\/p>", "feedbackIncorrectHtml": "<p>A: “Temporary” is not the legal test.<br>C: Personal knowledge does not replace the stated conditions.<br>D: Laboratory-sample status is a separate defined category.<\/p>", "sources": ["AB-OHS-29 s.400", "HPR-5"], "graded": false, "difficulty": null, "accessibility": "Single-select response with full scenario and choices.", "mode": "single", "options": [{"key": "A", "text": "It clearly meets Alberta’s immediate-use exception because the transfer was temporary."}, {"key": "B", "text": "It does not meet all four immediate-use conditions described in Alberta s.400; a work-site-label requirement should be addressed."}, {"key": "C", "text": "No label is needed because the worker knows what is inside."}, {"key": "D", "text": "Any portable container is automatically a laboratory sample."}], "correctKey": "B"}, "objectives": ["LO2"], "sources": ["AB-OHS-29 s.400", "HPR-5"], "module": "T2", "moduleTitle": "Hazard information has to stay connected to the work", "visual": null, "optional": false}, {"id": "F2-03", "kind": "formative", "type": "formative self-assessment", "subtype": "matching", "title": "Knowledge check", "question": {"id": "F2-03", "itemType": "matching", "objectives": ["LO2"], "questionHtml": "<p>Match each question to the SDS section group most likely to help first.<\/p>", "questionText": "Match each question to the SDS section group most likely to help first.", "optionsRaw": "1. “Is this the correct product?”<br>2. “What are the classified hazards?”<br>3. “What incompatible materials or hazardous reactions are identified?”<br>4. “What health effects are described?”<br>5. “What does the supplier say about accidental release?”", "correctRaw": "1 → Section 1; 2 → Section 2; 3 → Sections 7 and 10; 4 → Section 11; 5 → Section 6.", "feedbackCorrectHtml": "<p>Strategic SDS use is about knowing where to look, then connecting the information to the task.<\/p>", "feedbackIncorrectHtml": "<p>Incorrect matches should redirect the learner to the purpose of the relevant section instead of only saying “wrong.”<\/p>", "sources": ["CCOHS-SDS"], "graded": false, "difficulty": null, "accessibility": "Use numbered prompts with selectable section choices; no drag requirement.", "mode": "matching", "prompts": [{"key": "1", "text": "“Is this the correct product?”"}, {"key": "2", "text": "“What are the classified hazards?”"}, {"key": "3", "text": "“What incompatible materials or hazardous reactions are identified?”"}, {"key": "4", "text": "“What health effects are described?”"}, {"key": "5", "text": "“What does the supplier say about accidental release?”"}], "answerMap": {"1": "Section 1", "2": "Section 2", "3": "Sections 7 and 10", "4": "Section 11", "5": "Section 6"}, "targets": ["Section 1", "Section 2", "Sections 7 and 10", "Section 11", "Section 6"]}, "objectives": ["LO2"], "sources": ["CCOHS-SDS"], "module": "T2", "moduleTitle": "Hazard information has to stay connected to the work", "visual": null, "optional": false}, {"id": "F2-04", "kind": "formative", "type": "formative self-assessment", "subtype": "scenario judgment", "title": "Knowledge check", "question": {"id": "F2-04", "itemType": "scenario judgment", "objectives": ["LO2"], "questionHtml": "<p>The SDS is current and the supplier label is intact. Which statement is most accurate?<\/p>", "questionText": "The SDS is current and the supplier label is intact. Which statement is most accurate?", "optionsRaw": "A. The task is there
