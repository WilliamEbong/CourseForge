used the problem.<\/p>", "contentText": "Retraining makes sense when the evidence shows a knowledge or competence gap. It will not fix a confusing interface, missing engineering control, incompatible storage arrangement, unrealistic workload, degraded equipment, or a procedure that does not match the work. In those cases, training can support the change, but the action also needs to address the condition that caused the problem.", "treatment": "Links CAPA to hierarchy of controls.", "visualDirection": "Original table: Supported training cause / Non-training cause / Better control direction.", "accessibility": "Text fully explains distinction.", "objectives": ["LO3", "LO6"], "sources": ["CCOHS-INVEST", "HC-CAPA", "AB-OHS-2 s.9"], "module": "T6", "moduleTitle": "Fixing the visible problem is not the same as preventing recurrence", "visual": null, "optional": false}, {"id": "T6-06", "kind": "content", "type": "comparison", "subtype": "verification vs effectiveness", "title": "Completed is not the same as effective", "contentHtml": "<p><strong>Verification asks:<\/strong> Did we implement what we said we would do? Examples: the guard was installed, the procedure was approved, the database field was added, or training was completed.<br><br><strong>Effectiveness asks:<\/strong> Did the action reduce the problem or risk as intended? Examples: the new engineering control meets its performance criterion, ambiguous waste labels are no longer found across repeated audits, or the same failure no longer recurs over enough relevant opportunities.<br><br>A CAPA can be verified and still be ineffective.<\/p>", "contentText": "Verification asks: Did we implement what we said we would do? Examples: the guard was installed, the procedure was approved, the database field was added, or training was completed. Effectiveness asks: Did the action reduce the problem or risk as intended? Examples: the new engineering control meets its performance criterion, ambiguous waste labels are no longer found across repeated audits, or the same failure no longer recurs over enough relevant opportunities. A CAPA can be verified and still be ineffective.", "treatment": "Uses examples to separate implementation from outcome.", "visualDirection": "Original split graphic Verification / Effectiveness with checkmark versus outcome graph, but no colour dependence.", "accessibility": "Examples all appear in text.", "objectives": ["LO6"], "sources": ["HC-CAPA", "source dossier §21"], "module": "T6", "moduleTitle": "Fixing the visible problem is not the same as preventing recurrence", "visual": "V-18", "optional": false}, {"id": "T6-07", "kind": "content", "type": "process", "subtype": "effectiveness design", "title": "Plan the effectiveness check before closure", "contentHtml": "<p>A useful effectiveness plan identifies:<br><br>- the outcome expected to change;<br>- how it will be measured;<br>- when or after how many relevant opportunities it will be reviewed;<br>- what result is acceptable;<br>- who will review it;<br>- what happens if it is ineffective.<br><br>If the action fails, reopen or escalate the issue, reassess the cause and risk, and strengthen interim or permanent controls instead of forcing closure.<\/p>", "contentText": "A useful effectiveness plan identifies: - the outcome expected to change; - how it will be measured; - when or after how many relevant opportunities it will be reviewed; - what result is acceptable; - who will review it; - what happens if it is ineffective. If the action fails, reopen or escalate the issue, reassess the cause and risk, and strengthen interim or permanent controls instead of forcing closure.", "treatment": "Outcome-focused effectiveness design.", "visualDirection": "Original six-question checklist.", "accessibility": "Full checklist in text.", "objectives": ["LO6"], "sources": ["HC-CAPA", "source dossier §21"], "module": "T6", "moduleTitle": "Fixing the visible problem is not the same as preventing recurrence", "visual": null, "optional": false}, {"id": "T6-08", "kind": "content", "type": "scenario", "subtype": "continuing case", "title": "Waste near miss: build the action-to-cause chain", "contentHtml": "<p>Suppose the investigation supports three system factors: ambiguous waste identifiers, incompatible streams stored side by side, and a process change that was not carried into the waste review.<br><br>Possible actions include standardizing waste identification, physically separating incompatible streams, and adding waste-interface review to the process-change workflow. Task-specific training may support the new system. A weak action would be to retrain the individual worker while leaving the same ambiguous setup in place.<\/p>", "contentText": "Suppose the investigation supports three system factors: ambiguous waste identifiers, incompatible streams stored side by side, and a process change that was not carried into the waste review. Possible actions include standardizing waste identification, physically separating incompatible streams, and adding waste-interface review to the process-change workflow. Task-specific training may support the new system. A weak action would be to retrain the individual worker while leaving the same ambiguous setup in place.", "treatment": "Learner sees one action mapped to each supported factor.", "visualDirection": "Original cause-to-action map with three arrows.", "accessibility": "All causes/actions stated in text.", "objectives": ["LO3", "LO6"], "sources": ["AB-OHS-2 s.9", "AB-OHS-29 s.396", "CCOHS-INVEST", "HC-CAPA"], "module": "T6", "moduleTitle": "Fixing the visible problem is not the same as preventing recurrence", "visual": null, "optional": false}, {"id": "T6-09", "kind": "content", "type": "example", "subtype": "effectiveness", "title": "What would effectiveness look like?", "contentHtml": "<p>For the waste case, “training completed” verifies one activity. It does not show whether the risk-control system improved. An effectiveness review could sample waste stations and disposal events over a defined period to check that streams are uniquely identified, incompatible streams remain separated, and the revised change-review step is actually being used. The organization decides the sampling plan; the important point is to measure the <strong>intended outcome<\/strong>.<\/p>", "contentText": "For the waste case, “training completed” verifies one activity. It does not show whether the risk-control system improved. An effectiveness review could sample waste stations and disposal events over a defined period to check that streams are uniquely identified, incompatible streams remain separated, and the revised change-review step is actually being used. The organization decides the sampling plan; the important point is to measure the intended outcome.", "treatment": "Shows outcome-based effectiveness without inventing a mandated sample size.", "visualDirection": "No visual required.", "accessibility": "Plain text.", "objectives": ["LO6"], "sources": ["HC-CAPA", "source dossier §23"], "module": "T6", "moduleTitle": "Fixing the visible problem is not the same as preventing recurrence", "visual": null, "optional": false}, {"id": "T6-10", "kind": "content", "type": "content", "subtype": "synthesis", "title": "Topic 6 synthesis", "contentHtml": "<p>A CAPA should follow a clear logic: <strong>define the problem → contain immediate risk → collect evidence → identify supported causes → choose actions that address those causes → verify implementation → test effectiveness → close or escalate.<\/strong> Before closure, the organization should be able to explain what each action is meant to change and how it will know whether that change worked.<\/p>", "contentText": "A CAPA should follow a clear logic: define the problem → contain immediate risk → collect evidence → identify supported causes → choose actions that address those causes → verify implementation → test effectiveness → close or escalate. Before closure, the organization should be able to explain what each action is meant to change and how it will know whether that change worked.", "treatment": "Short retrieval summary.", "visualDirection": "No visual required.", "accessibility": "Plain text.", "objectives": ["LO6"], "sources": ["HC-CAPA", "CCOHS-INVEST", "AB-OHS-2 s.9"], "module": "T6", "moduleTitle": "Fixing the visible problem is not the same as preventing recurrence", "visual": null, "optional": false}, {"id": "F6-01", "kind": "formative", "type": "formative self-assessment", "subtype": "categorization", "title": "Knowledge check", "question": {"id": "F6-01", "itemType": "categorization", "objectives": ["LO6"], "questionHtml": "<p>Classify each action in the waste case.<\/p>", "questionText": "Classify each action in the waste case.", "optionsRaw": "1. Replace one illegible waste label now.<br>2. Temporarily restrict use of the affected station while the issue is investigated.<br>3. Redesign the waste-identification and segregation system after evidence shows ambiguity is causal.<br>4. Review other laboratories for the same design weakness and correct it before an event occurs there.", "correctRaw": "1 Correction; 2 Containment; 3 Corrective action; 4 Preventive action.", "feedbackCorrectHtml": "<p>The categories differ by purpose and timing: immediate fix, interim risk limitation, action on a detected cause, and proactive prevention elsewhere.<\/p>", "feedbackIncorrectHtml": "<p>Incorrect classifications should restate the definition and ask what problem the action is intended to solve now versus later.<\/p>", "sources": ["HC-CAPA"], "graded": false, "difficulty": null, "accessibility": "Four labelled drop-downs; no drag-only categorization.", "mode": "category", "prompts": [{"key": "1", "text": "Replace one illegible waste label now."}, {"key": "2", "text": "Temporarily restrict use of the affected station while the issue is investigated."}, {"key": "3", "text": "Redesign the waste-identification and segregation system after evidence shows ambiguity is causal."}, {"key": "4", "text": "Review other laboratories for the same design weakness and correct it before an event occurs there."}], "answerMap": {"1": "Correction", "2": "Containment", "3": "Corrective action", "4": "Preventive action"}, "categories": ["Correction", "Containment", "Corrective action", "Preventive action"]}, "objectives": ["LO6"], "sources": ["HC-CAPA"], "module": "T6", "moduleTitle": "Fixing the visible problem is not the same as preventing recurrence", "visual": null, "optional": false}, {"id": "F6-02", "kind": "formative", "type": "formative self-assessment", "subtype": "scenario multiple choice", "title": "Knowledge check", "question": {"id": "F6-02", "itemType": "scenario multiple choice", "objectives": ["LO6"], "questionHtml": "<p>An investigation finds that a recurring error is caused mainly by two nearly identical controls placed side by side. Which CAPA is best aligned to the supported cause?<\/p>", "questionText": "An investigation finds that a recurring error is caused mainly by two nearly identical controls placed side by side. Which CAPA is best aligned to the supported cause?", "optionsRaw": "A. Send a reminder to pay attention.<br>B. Redesign or differentiate the interface to reduce the confusion, then update procedure/training as needed.<br>C. Require the same training again and make no design change.<br>D. Close the issue because the worker now understands the error.", "correctRaw": "B", "feedbackCorrectHtml": "<p>The supported cause is an interface/design issue, so the primary action should address the design rather than depend only on attention or retraining.<\/p>", "feedbackIncorrectHtml": "<p>A/C are behaviour-focused and leave the causal design condition unchanged. D confuses individual awareness with system correction.<\/p>", "sources": ["CCOHS-INVEST", "HC-CAPA", "AB-OHS-2 s.9"], "graded": false, "difficulty": null, "accessibility": "Single-select list.", "mode": "single", "options": [{"key": "A", "text": "Send a reminder to pay attention."}, {"key": "B", "text": "Redesign or differentiate the interface to reduce the confusion, then update procedure/training as needed."}, {"key": "C", "text": "Require the same training again and make no design change."}, {"key": "D", "text": "Close the issue because the worker now understands the error."}], "correctKey": "B"}, "objectives": ["LO6"], "sources": ["CCOHS-INVEST", "HC-CAPA", "AB-OHS-2 s.9"], "module": "T6", "moduleTitle": "Fixing the visible problem is not the same as preventing recurrence", "visual": null, "optional": false}, {"id": "F6-03", "kind": "formative", "type": "formative self-assessment", "subtype": "multiple choice", "title": "Knowledge check", "question": {"id": "F6-03", "itemType": "multiple choice", "objectives": ["LO6"], "questionHtml": "<p>Which statement best distinguishes verification from effectiveness?<\/p>", "questionText": "Which statement best distinguishes verification from effectiveness?", "optionsRaw": "A. Verification checks whether the action was completed; effectiveness checks whether it produced the intended improvement.<br>B. Verification and effectiveness mean the same thing.<br>C. Effectiveness is proven as soon as training attendance is recorded.<br>D. Verification matters only for engineering actions.", "correctRaw": "A", "feedbackCorrectHtml": "<p>Implementation and outcome are different questions, and both matter for credible closure.<\/p>", "feedbackIncorrectHtml": "<p>B collapses two distinct checks. C measures completion, not outcome. D is false; verification applies to many action types.<\/p>", "sources": ["HC-CAPA", "source dossier §21"], "graded": false, "difficulty": null, "accessibility": "Single-select list.", "mode": "single", "options": [{"key": "A", "text": "Verification checks whether the action was completed; effectiveness checks whether it produced the intended improvement."}, {"key": "B", "text": "Verification and effectiveness mean the same thing."}, {"key": "C", "text": "Effectiveness is proven as soon as training attendance is recorded."}, {"key": "D", "text": "Verification matters only for engineering actions."}], "correctKey": "A"}, "objectives": ["LO6"], "sources": ["HC-CAPA", "source dossier §21"], "module": "T6", "moduleTitle": "Fixing the visible problem is not the same as preventing recurrence", "visual": null, "optional": false}, {"id": "F6-04", "kind": "formative", "type": "formative self-assessment", "subtype": "scenario judgment", "title": "Knowledge check", "question": {"id": "F6-04", "itemType": "scenario judgment", "objectives": ["LO6"], "questionHtml": "<p>A CAPA owner proposes the effectiveness criterion: “Procedure revised and all staff trained.” What is missing?<\/p>", "questionText": "A CAPA owner proposes the effectiveness criterion: “Procedure revised and all staff trained.” What is missing?", "optionsRaw": "A. Nothing; those facts prove the problem is solved.<br>B. A measure of whether the intended risk or recurrence actually changed after implementation.<br>C. A second procedure revision before the first is used.<br>D. A legal citation proving all CAPAs require training.", "correctRaw": "B", "feedbackCorrectHtml": "<p>Procedure revision and training can verify implementation. An effectiveness check should evaluate whether the action changed the outcome or control performance it was intended to change.<\/p>", "feedbackIncorrectHtml": "<p>A confuses verification with effectiveness. C is unsupported. D invents a universal requirement the course explicitly rejects.<\/p>", "sources": ["HC-CAPA"], "graded": false, "difficulty": null, "accessibility": "Single-select list.", "mode": "single", "options": [{"key": "A", "text": "Nothing; those facts prove the problem is solved."}, {"key": "B", "text": "A measure of whether the intended risk or recurrence actually changed after implementation."}, {"key": "C", "text": "A second procedure revision before the first is used."}, {"key": "D", "text": "A legal citation proving all CAPAs require training."}], "correctKey": "B"}, "objectives": ["LO6"], "sources": ["HC-CAPA"], "module": "T6", "moduleTitle": "Fixing the visible problem is not the same as preventing recurrence", "visual": null, "optional": false}, {"id": "T7-01", "kind": "content", "type": "topic title", "subtype": "relevance", "title": "Measure prevention as well as outcomes", "contentHtml": "<p>Incident and injury counts matter, but they are <strong>lagging<\/strong> measures: they describe outcomes after something has happened. A safety program should also track <strong>leading<\/strong> information about conditions and preventive work, such as risk-review completion, engineering-control verification, overdue corrective actions, high-risk inspection findings, near-miss investigations, and effectiveness checks.<\/p>", "contentText": "Incident and injury counts matter, but they are lagging measures: they describe outcomes after something has happened. A safety program should also track leading information about conditions and preventive work, such as risk-review completion, engineering-control verification, overdue corrective actions, high-risk inspection findings, near-miss investigations, and effectiveness checks.", "treatment": "Introduces leading/lagging distinction.", "visualDirection": "Original two-column leading/lagging examples.", "accessibility": "Text lists the examples.", "objectives": ["LO6"], "sources": ["CCOHS-INDICATORS"], "module": "T7", "moduleTitle": "Measure prevention as well as outcomes", "visual": null, "optional": false}, {"id": "T7-02", "kind": "content", "type": "comparison", "subtype": "indicators", "title": "Leading and lagging indicators answer different questions", "contentHtml": "<p><strong>Leading indicators ask:<\/strong> Are we doing the work that should reduce risk, and are important controls functioning?<br><br><strong>Lagging indicators ask:<\/strong> What adverse outcomes have already occurred?<br><br>Neither is sufficient by itself. A laboratory can have few injuries simply because serious events are rare, because exposure opportunities are low, or because problems are not reported. A laboratory can also generate many reports while improving if workers are becoming more willing to surface hazards and near misses.<\/p>", "contentText": "Leading indicators ask: Are we doing the work that should reduce risk, and are important controls functioning? Lagging indicators ask: What adverse outcomes have already occurred? Neither is sufficient by itself. A laboratory can have few injuries simply because serious events are rare, because exposure opportunities are low, or because problems are not reported. A laboratory can also generate many reports while improving if workers are becoming more willing to surface hazards and near misses.", "treatment": "Prevents simplistic metric interpretation.", "visualDirection": "Original balanced scale with Leading / Lagging; no “green/red” coding.", "accessibility": "Text carries all meaning.", "objectives": ["LO6"], "sources": ["CCOHS-INDICATORS"], "module": "T7", "moduleTitle": "Measure prevention as well as outcomes", "visual": "V-19", "optional": false}, {"id": "T7-03", "kind": "content", "type": "content", "subtype": "reporting culture", "title": "Low reporting is not automatically good news", "contentHtml": "<p>A 2023 systematic review found substantial occupational injury/illness underreporting and identified factors such as fear, cumbersome processes, poor reporting knowledge, normalization of injury, poor psychosocial conditions, and distrust of consequences. Other studies cited in the research dossier found associations between poor safety climate, disciplinary or incentive pressures, and underreporting. These studies are <strong>not laboratory-specific prevalence estimates<\/strong>; they support the broader lesson that reporting behaviour can distort safety numbers.<\/p>", "contentText": "A 2023 systematic review found substantial occupational injury/illness underreporting and identified factors such as fear, cumbersome processes, poor reporting knowledge, normalization of injury, poor psychosocial conditions, and distrust of consequences. Other studies cited in the research dossier found associations between poor safety climate, disciplinary or incentive pressures, and underreporting. These studies are not laboratory-specific prevalence estimates; they support the broader lesson that reporting behaviour can distort safety numbers.", "treatment": "Preserves empirical evidence limitations.", "visualDirection": "No chart unless data are reproduced accurately from sources; recommended treatment is text-only.", "accessibility": "Plain text.", "objectives": ["LO6"], "sources": ["KYUNG-2023", "PROBST-2008", "LIPSCOMB-2013"], "module": "T7", "moduleTitle": "Measure prevention as well as outcomes", "visual": null, "optional": false}, {"id": "T7-04", "kind": "content", "type": "content", "subtype": "metric design", "title": "A low report count can be misleading", "contentHtml": "<p>A “zero reports” target can reward silence as easily as safety. Look instead at whether hazards and near misses are being reported, high-risk findings are controlled promptly, corrective actions are overdue, engineering controls are verified, and effectiveness checks are completed. Workers also need to see that reporting leads to a useful response.<\/p>", "contentText": "A “zero reports” target can reward silence as easily as safety. Look instead at whether hazards and near misses are being reported, high-risk findings are controlled promptly, corrective actions are overdue, engineering controls are verified, and effectiveness checks are completed. Workers also need to see that reporting leads to a useful response.", "treatment": "Practical metric design without inventing thresholds.", "visualDirection": "Original “Report → Respond → Learn” loop.", "accessibility": "Text provides the complete loop.", "objectives": ["LO6"], "sources": ["CCOHS-INDICATORS", "KYUNG-2023"], "module": "T7", "moduleTitle": "Measure prevention as well as outcomes", "visual": null, "optional": false}, {"id": "T7-05", "kind": "content", "type": "scenario", "subtype": "interpretation", "title": "Two laboratories, incomplete evidence", "contentHtml": "<p>Laboratory A reports almost no near misses but has many overdue inspections and corrective actions. Laboratory B reports more near misses and closes high-risk findings promptly. You <strong>cannot<\/strong> conclude from those facts alone that one laboratory is safer overall. You can conclude that incident count by itself is not enough. You would want information about exposure, control performance, reporting behaviour, severity, trends, and action quality before judging system health.<\/p>", "contentText": "Laboratory A reports almost no near misses but has many overdue inspections and corrective actions. Laboratory B reports more near misses and closes high-risk findings promptly. You cannot conclude from those facts alone that one laboratory is safer overall. You can conclude that incident count by itself is not enough. You would want information about exposure, control performance, reporting behaviour, severity, trends, and action quality before judging system health.", "treatment": "Forces “need more evidence” rather than simplistic ranking.", "visualDirection": "Original side-by-side data cards using text labels, not colour ranking.", "accessibility": "All data points stated in text.", "objectives": ["LO6"], "sources": ["CCOHS-INDICATORS", "KYUNG-2023"], "module": "T7", "moduleTitle": "Measure prevention as well as outcomes", "visual": null, "optional": false}, {"id": "T7-06", "kind": "content", "type": "process", "subtype": "continual improvement", "title": "Close the loop", "contentHtml": "<p>The course began with task risk, and that is where the learning loop returns. Information from inspections, near misses, incidents, CAPAs, and effectiveness checks should update risk assessments, procedures, inventory controls, training, engineering controls, and change management. Good paperwork is useful only if the system notices problems, improves controls, and checks that the improvement holds up in practice.<\/p>", "contentText": "The course began with task risk, and that is where the learning loop returns. Information from inspections, near misses, incidents, CAPAs, and effectiveness checks should update risk assessments, procedures, inventory controls, training, engineering controls, and change management. Good paperwork is useful only if the system notices problems, improves controls, and checks that the improvement holds up in practice.", "treatment": "Closes the prevention-learning loop.", "visualDirection": "Original full-course closed loop, same visual language as S1-01.", "accessibility": "Provide eight-step text sequence plus feedback arrow.", "objectives": ["LO1–LO6"], "sources": ["AB-OHS-2", "CCOHS-INDICATORS", "HC-CAPA"], "module": "T7", "moduleTitle": "Measure prevention as well as outcomes", "visual": "V-01", "optional": false}, {"id": "F7-01", "kind": "formative", "type": "formative self-assessment", "subtype": "categorization", "title": "Knowledge check", "question": {"id": "F7-01", "itemType": "categorization", "objectives": ["LO6"], "questionHtml": "<p>Classify each indicator as primarily leading or lagging for this course.<\/p>", "questionText": "Classify each indicator as primarily leading or lagging for this course.", "optionsRaw": "1. Percentage of high-risk assessments reviewed on time.<br>2. Chemical exposure incidents.<br>3. Overdue corrective actions by risk level.<br>4. Fires or uncontrolled reactions.<br>5. Engineering-control verification current.", "correctRaw": "Leading: 1, 3, 5. Lagging: 2, 4.", "feedbackCorrectHtml": "<p>Leading indicators track preventive/control activity or condition; lagging indicators record adverse outcomes after events occur.<\/p>", "feedbackIncorrectHtml": "<p>Incorrect feedback should explain whether the measure is about prevention/control before harm or an outcome after harm.<\/p>", "sources": ["CCOHS-INDICATORS"], "graded": false, "difficulty": null, "accessibility": "Five drop-downs labelled Leading/Lagging.", "mode": "category", "prompts": [{"key": "1", "text": "Percentage of high-risk assessments reviewed on time."}, {"key": "2", "text": "Chemical exposure incidents."}, {"key": "3", "text": "Overdue corrective actions by risk level."}, {"key": "4", "text": "Fires or uncontrolled reactions."}, {"key": "5", "text": "Engineering-control verification current."}], "answerMap": {"1": "Leading", "3": "Leading", "5": "Leading", "2": "Lagging", "4": "Lagging"}, "categories": ["Leading", "Lagging"]}, "objectives": ["LO6"], "sources": ["CCOHS-INDICATORS"], "module": "T7", "moduleTitle": "Measure prevention as well as outcomes", "visual": null, "optional": false}, {"id": "F7-02", "kind": "formative", "type": "formative self-assessment", "subtype": "scenario multiple choice", "title": "Knowledge check", "question": {"id": "F7-02", "itemType": "scenario multiple choice", "objectives": ["LO6"], "questionHtml": "<p>A manager celebrates a 50% drop in near-miss reports and concludes the laboratory is safer. What is the best response?<\/p>", "questionText": "A manager celebrates a 50% drop in near-miss reports and concludes the laboratory is safer. What is the best response?", "optionsRaw": "A. Agree; fewer reports always proves fewer hazards.<br>B. Ask whether actual risk and control performance improved and whether reporting became harder or less trusted before drawing a conclusion.<br>C. Conclude that risk doubled.<br>D. Ignore reports and use training completion only.", "correctRaw": "B", "feedbackCorrectHtml": "<p>Reporting behaviour can change independently of underlying risk. A balanced view uses both leading and lagging information and considers reporting culture.<\/p>", "feedbackIncorrectHtml": "<p>A overinterprets one metric. C makes the opposite unsupported inference. D substitutes another incomplete metric.<\/p>", "sources": ["CCOHS-INDICATORS", "KYUNG-2023", "PROBST-2008", "LIPSCOMB-2013"], "graded": false, "difficulty": null, "accessibility": "Single-select list.", "mode": "single", "options": [{"key": "A", "text": "Agree; fewer reports always proves fewer hazards."}, {"key": "B", "text": "Ask whether actual risk and control performance improved and whether reporting became harder or less trusted before drawing a conclusion."}, {"key": "C", "text": "Conclude that risk doubled."}, {"key": "D", "text": "Ignore reports and use training completion only."}], "correctKey": "B"}, "objectives": ["LO6"], "sources": ["CCOHS-INDICATORS", "KYUNG-2023", "PROBST-2008", "LIPSCOMB-2013"], "module": "T7", "moduleTitle": "Measure prevention as well as outcomes", "visual": null, "optional": false}, {"id": "R-01", "kind": "content", "type": "course review", "subtype": "mental model", "title": "The full decision loop", "contentHtml": "<p>Use one mental model across the whole course: <strong>identify → assess → control → verify → respond/escalate → investigate → correct → check effectiveness → learn and reassess.<\/strong> Hazard information enters the system through labels, SDSs, inventory, and technical knowledge. The task assessment turns that information into a risk decision. Controls reduce exposure or consequence. Incidents and weak signals feed evidence back into corrective action and future risk assessment.<\/p>", "contentText": "Use one mental model across the whole course: identify → assess → control → verify → respond/escalate → investigate → correct → check effectiveness → learn and reassess. Hazard information enters the system through labels, SDSs, inventory, and technical knowledge. The task assessment turns that information into a risk decision. Controls reduce exposure or consequence. Incidents and weak signals feed evidence back into corrective action and future risk assessment.", "treatment": "Course-wide retrieval block; repeats the opening loop with greater meaning after the full course.", "visualDirection": "Original closed-loop diagram used consistently with S1-01 and T7-06.", "accessibility": "Full loop is written in text.", "objectives": ["LO1–LO6"], "sources": ["AB-OHS-2", "CCOHS-SDS", "CCOHS-INVEST", "HC-CAPA", "CCOHS-INDICATORS"], "module": "R", "moduleTitle": "Course review", "visual": "V-01", "optional": false}, {"id": "R-02", "kind": "content", "type": "course review", "subtype": "objective review", "title": "LO1 review: Explain the risk model and regulatory context", "contentHtml": "<p>At this point, you can <strong>distinguish hazard, exposure, risk, consequence, and likelihood<\/strong> and explain the basic responsibility split: federal HPA/HPR requirements govern supplier hazard communication, while Alberta workplace law governs hazard assessment and controls, WHMIS training, workplace labels where required, and SDS access. GHS is the international model; WHMIS is Canada’s legal system using GHS-based concepts.<\/p>", "contentText": "At this point, you can distinguish hazard, exposure, risk, consequence, and likelihood and explain the basic responsibility split: federal HPA/HPR requirements govern supplier hazard communication, while Alberta workplace law governs hazard assessment and controls, WHMIS training, workplace labels where required, and SDS access. GHS is the international model; WHMIS is Canada’s legal system using GHS-based concepts.", "treatment": "Review tied directly to LO1.", "visualDirection": "No new visual required; reuse supplier/workplace and hazard-risk diagrams.", "accessibility": "Text stands alone.", "objectives": ["LO1"], "sources": ["HC-WHMIS-RR", "HPA-13", "HPA-14", "HPR", "AB-OHS-2", "AB-OHS-29", "UNECE-GHS11"], "module": "R", "moduleTitle": "Course review", "visual": null, "optional": false}, {"id": "R-03", "kind": "content", "type": "course review", "subtype": "objective review", "title": "LO2 review: Interpret chemical information for the task", "contentHtml": "<p>For a task-specific risk review, you can now identify what the label, SDS, and inventory tell you, along with the information they leave unanswered. For a task-specific decision, look beyond the product name to quantity, concentration, physical form, exposure routes, duration/frequency, equipment, ventilation, process energy, compatibility, and abnormal conditions. A current SDS is essential product information, but it is <strong>not proof that the workplace task has been assessed.<\/strong><\/p>", "contentText": "For a task-specific risk review, you can now identify what the label, SDS, and inventory tell you, along with the information they leave unanswered. For a task-specific decision, look beyond the product name to quantity, concentration, physical form, exposure routes, duration/frequency, equipment, ventilation, process energy, compatibility, and abnormal conditions. A current SDS is essential product information, but it is not proof that the workplace task has been assessed.", "treatment": "Review tied to LO2.", "visualDirection": "Reuse SDS-to-task-assessment visual.", "accessibility": "Text stands alone.", "objectives": ["LO2"], "sources": ["CCOHS-SDS", "CCOHS-LABS", "AB-OHS-4 s.21"], "module": "R", "moduleTitle": "Course review", "visual": null, "optional": false}, {"id": "R-04", "kind": "content", "type": "course review", "subtype": "objective review", "title": "LO3 review: Start with higher-order controls", "contentHtml": "<p>When comparing controls, use the hierarchy: <strong>elimination → substitution → engineering → administrative controls → PPE.<\/strong> Alberta’s legal wording prioritizes elimination/control and engineering where reasonably practicable before administrative controls and PPE. Storage must account for compatibility, and engineering controls such as fume hoods must be suitable and functioning for the actual task. When specialist expertise is needed, escalation is part of good control.<\/p>", "contentText": "When comparing controls, use the hierarchy: elimination → substitution → engineering → administrative controls → PPE. Alberta’s legal wording prioritizes elimination/control and engineering where reasonably practicable before administrative controls and PPE. Storage must account for compatibility, and engineering controls such as fume hoods must be suitable and functioning for the actual task. When specialist expertise is needed, escalation is part of good control.", "treatment": "Review tied to LO3.", "visualDirection": "Reuse hierarchy diagram.", "accessibility": "Text stands alone.", "objectives": ["LO3"], "sources": ["AB-OHS-2 s.9", "CCOHS-CABINETS", "CCOHS-VENT", "CCOHS-HOODS"], "module": "R", "moduleTitle": "Course review", "visual": "V-10", "optional": false}, {"id": "R-05", "kind": "content", "type": "course review", "subtype": "objective review", "title": "LO4 review: Recognize change and escalation boundaries", "contentHtml": "<p>You can now recognize when changed work calls for a new hazard assessment and when an event needs immediate emergency escalation or investigation. Alberta explicitly requires reassessment for new processes, changed operations, and significant work-site alterations, among other periodic review duties. Serious events and some high-potential incidents trigger statutory reporting or investigation duties. In an emergency, protect people first; preserve the scene when safe and required.<\/p>", "contentText": "You can now recognize when changed work calls for a new hazard assessment and when an event needs immediate emergency escalation or investigation. Alberta explicitly requires reassessment for new processes, changed operations, and significant work-site alterations, among other periodic review duties. Serious events and some high-potential incidents trigger statutory reporting or investigation duties. In an emergency, protect people first; preserve the scene when safe and required.", "treatment": "Review tied to LO4.", "visualDirection": "Reuse change-trigger and emergency/investigation timeline.", "accessibility": "Text stands alone.", "objectives": ["LO4"], "sources": ["AB-OHS-2 s.7(4)", "AB-OHS-7", "AB-OHS-ACT-33"], "module": "R", "moduleTitle": "Course review", "visual": null, "optional": false}, {"id": "R-06", "kind": "content", "type": "course review", "subtype": "objective review", "title": "LO5 review: Investigate with evidence", "contentHtml": "<p>You can now organize physical, documentary, system, and witness evidence, separate observation from interpretation, and use tools such as timelines, barrier analysis, change analysis, or 5 Whys without treating the tool itself as proof. If the explanation ends at “worker error,” examine task design, equipment, materials, environment, workload, training, supervision, procurement, maintenance, and management-system conditions.<\/p>", "contentText": "You can now organize physical, documentary, system, and witness evidence, separate observation from interpretation, and use tools such as timelines, barrier analysis, change analysis, or 5 Whys without treating the tool itself as proof. If the explanation ends at “worker error,” examine task design, equipment, materials, environment, workload, training, supervision, procurement, maintenance, and management-system conditions.", "treatment": "Review tied to LO5.", "visualDirection": "Reuse evidence categories and system-factor wheel.", "accessibility": "Text stands alone.", "objectives": ["LO5"], "sources": ["CCOHS-INVEST"], "module": "R", "moduleTitle": "Course review", "visual": null, "optional": false}, {"id": "R-07", "kind": "content", "type": "course review", "subtype": "objective review", "title": "LO6 review: Link cause, action, and effectiveness", "contentHtml": "<p>For CAPA, you can now distinguish <strong>correction, containment, corrective action, and preventive action<\/strong>, test whether a proposed action addresses a supported cause, and separate verification from effectiveness. A useful CAPA record links the problem, scope and risk, evidence, causes, actions, owners, interim controls, verification, and effectiveness. Low incident counts alone do not prove a healthy system; leading indicators and reporting culture also matter.<\/p>", "contentText": "For CAPA, you can now distinguish correction, containment, corrective action, and preventive action, test whether a proposed action addresses a supported cause, and separate verification from effectiveness. A useful CAPA record links the problem, scope and risk, evidence, causes, actions, owners, interim controls, verification, and effectiveness. Low incident counts alone do not prove a healthy system; leading indicators and reporting culture also matter.", "treatment": "Review tied to LO6.", "visualDirection": "Reuse CAPA logic chain and leading/lagging comparison.", "accessibility": "Text stands alone.", "objectives": ["LO6"], "sources": ["HC-CAPA", "HC-GMP-V4", "CCOHS-INDICATORS", "KYUNG-2023"], "module": "R", "moduleTitle": "Course review", "visual": "V-17", "optional": false}, {"id": "R-08", "kind": "content", "type": "course review", "subtype": "integrated scenario", "title": "Putting the pieces together", "contentHtml": "<p><strong>Before the event:<\/strong> a process changed, but the shared waste system was not reassessed. Containers used ambiguous shorthand and incompatible streams were not clearly separated.<br><br><strong>During the event:<\/strong> a worker noticed unexpected heat and stopped. The priority was to stabilize the situation and escalate it through the local process.<br><br><strong>During investigation:<\/strong> evidence showed ambiguous identification, inadequate segregation, an unreviewed process change, and a prior inspection signal.<br><br><strong>During CAPA:<\/strong> the actions redesigned identification and segregation and connected waste review to process change. The team then needed to check whether those changes worked in practice instead of treating training completion as proof.<\/p>", "contentText": "Before the event: a process changed, but the shared waste system was not reassessed. Containers used ambiguous shorthand and incompatible streams were not clearly separated. During the event: a worker noticed unexpected heat and stopped. The priority was to stabilize the situation and escalate it through the local process. During investigation: evidence showed ambiguous identification, inadequate segregation, an unreviewed process change, and a prior inspection signal. During CAPA: the actions redesigned identification and segregation and connected waste review to process change. The team then needed to check whether those changes worked in practice instead of treating training completion as proof.", "treatment": "Integrated recall; no new facts beyond recurring fictional case.", "visualDirection": "Original four-stage case timeline.", "accessibility": "Full four-stage narrative in text.", "objectives": ["LO1–LO6"], "sources": ["AB-OHS-2", "AB-OHS-29 s.396", "AB-OHS-ACT-33(5)", "CCOHS-INVEST", "HC-CAPA"], "module": "R", "moduleTitle": "Course review", "visual": "V-20", "optional": false}, {"id": "R-09", "kind": "content", "type": "course review", "subtype": "decision summary", "title": "Seven questions to take back to work", "contentHtml": "<ol>\n<li><strong>What is the hazard?<\/strong><br>2. <strong>How could exposure or an uncontrolled event occur in this task?<\/strong><br>3. <strong>What information is present, and what is missing?<\/strong><br>4. <strong>Can the risk be reduced through elimination, substitution, or engineering before relying on administrative controls or PPE?<\/strong><br>5. <strong>Has anything changed that requires reassessment?<\/strong><br>6. <strong>If something goes wrong, what must be controlled and escalated before investigation begins?<\/strong><br>7. <strong>Does the corrective action address a supported cause, and how will effectiveness be checked?<\/strong><\/li>\n<\/ol>", "contentText": "1. What is the hazard? 2. How could exposure or an uncontrolled event occur in this task? 3. What information is present, and what is missing? 4. Can the risk be reduced through elimination, substitution, or engineering before relying on administrative controls or PPE? 5. Has anything changed that requires reassessment? 6. If something goes wrong, what must be controlled and escalated before investigation begins? 7. Does the corrective action address a supported cause, and how will effectiveness be checked?", "treatment": "Final job-aid checklist.", "visualDirection": "Original single-page decision card, suitable for accessible PDF/text export if desired.", "accessibility": "Numbered list is the text alternative.", "objectives": ["LO1–LO6"], "sources": ["AB-OHS-2", "AB-OHS-7", "CCOHS-INVEST", "HC-CAPA"], "module": "R", "moduleTitle": "Course review", "visual": null, "optional": false}, {"id": "R-10", "kind": "content", "type": "course review", "subtype": "terms and references", "title": "Terms and references", "contentHtml": "<p>The glossary covers <strong>hazard, exposure, risk, consequence, likelihood, incident, near miss, correction, containment, corrective action, preventive action, root cause, contributing factor, and effectiveness check<\/strong>. The main acronyms are <strong>WHMIS, SDS, OHS, OEL, PPE, CAPA, GHS, HPA, and HPR<\/strong>. The appendices also include the full reference register used to support the course content.<\/p>", "contentText": "The glossary covers hazard, exposure, risk, consequence, likelihood, incident, near miss, correction, containment, corrective action, preventive action, root cause, contributing factor, and effectiveness check. The main acronyms are WHMIS, SDS, OHS, OEL, PPE, CAPA, GHS, HPA, and HPR. The appendices also include the full reference register used to support the course content.", "treatment": "Reference transition; no assessment.", "visualDirection": "No visual required.", "accessibility": "Plain text.", "objectives": ["LO1–LO6"], "sources": ["HC-WHMIS-RR", "CCOHS-SDS", "CCOHS-INVEST", "HC-CAPA"], "module": "R", "moduleTitle": "Course review", "visual": null, "optional": false}, {"id": "GA-01", "kind": "graded", "type": "graded assessment", "subtype": "multiple choice", "title": "Assessment item 01", "question": {"id": "GA-01", "itemType": "multiple choice", "objectives": ["LO1"], "questionHtml": "<p>A hazardous product is unchanged, but a laboratory moves from closed room-temperature handling to an open heated process. Which statement is most accurate?<\/p>", "questionText": "A hazardous product is unchanged, but a laboratory moves from closed room-temperature handling to an open heated process. Which statement is most accurate?", "optionsRaw": "A. The hazard classification must have disappeared.<br>B. The intrinsic hazard can remain the same while task risk changes because exposure opportunity and consequences change.<br>C. Risk cannot change until the supplier issues a new SDS.<br>D. Heating automatically proves the task is prohibited.", "correctRaw": "B", "feedbackCorrectHtml": "<p>Task risk depends on the actual conditions, exposure opportunity, controls, and credible consequence, the product classification alone.<\/p>", "feedbackIncorrectHtml": "<p>A confuses task condition with intrinsic hazard. C confuses supplier information with workplace assessment. D makes a conclusion not supported by the facts.<\/p>", "sources": ["AB-OHS-2", "CCOHS-SDS", "source dossier §8"], "graded": true, "difficulty": "Foundational", "accessibility": null, "mode": "single", "options": [{"key": "A", "text": "The hazard classification must have disappeared."}, {"key": "B", "text": "The intrinsic hazard can remain the same while task risk changes because exposure opportunity and consequences change."}, {"key": "C", "text": "Risk cannot change until the supplier issues a new SDS."}, {"key": "D", "text": "Heating automatically proves the task is prohibited."}], "correctKey": "B"}, "objectives": ["LO1"], "sources": ["AB-OHS-2", "CCOHS-SDS", "source dossier §8"], "module": "GA", "moduleTitle": "Graded assessment", "visual": null, "optional": false}, {"id": "GA-02", "kind": "graded", "type": "graded assessment", "subtype": "multiple choice", "title": "Assessment item 02", "question": {"id": "GA-02", "itemType": "multiple choice", "objectives": ["LO1"], "questionHtml": "<p>Which description best captures the relationship between the Globally Harmonized System of Classification and Labelling of Chemicals (GHS) and the Workplace Hazardous Materials Information System (WHMIS)?<\/p>", "questionText": "Which description best captures the relationship between the Globally Harmonized System of Classification and Labelling of Chemicals (GHS) and the Workplace Hazardous Materials Information System (WHMIS)?", "optionsRaw": "A. GHS is Alberta’s workplace law.<br>B. WHMIS is an international treaty that replaces Canadian law.<br>C. GHS is an international hazard-communication model; WHMIS is Canada’s legal workplace system using GHS-based concepts, so GHS revisions do not automatically amend Canadian law.<br>D. They are unrelated systems.", "correctRaw": "C", "feedbackCorrectHtml": "<p>UNECE maintains the international GHS model, while Canadian HPA/HPR and provincial workplace law determine Canadian requirements.<\/p>", "feedbackIncorrectHtml": "<p>A misstates jurisdiction. B reverses the relationship. D ignores WHMIS’s GHS-based structure.<\/p>", "sources": ["UNECE-GHS11", "HC-WHMIS-GUIDE", "HPR"], "graded": true, "difficulty": "Foundational", "accessibility": null, "mode": "single", "options": [{"key": "A", "text": "GHS is Alberta’s workplace law."}, {"key": "B", "text": "WHMIS is an international treaty that replaces Canadian law."}, {"key": "C", "text": "GHS is an international hazard-communication model; WHMIS is Canada’s legal workplace system using GHS-based concepts, so GHS revisions do not automatically amend Canadian law."}, {"key": "D", "text": "They are unrelated systems."}], "correctKey": "C"}, "objectives": ["LO1"], "sources": ["UNECE-GHS11", "HC-WHMIS-GUIDE", "HPR"], "module": "GA", "moduleTitle": "Graded assessment", "visual": null, "optional": false}, {"id": "GA-03", "kind": "graded", "type": "graded assessment", "subtype": "scenario multiple response", "title": "Assessment item 03", "question": {"id": "GA-03", "itemType": "scenario multiple response", "objectives": ["LO2"], "questionHtml": "<p>You receive a current Safety Data Sheet (SDS) for a new solvent-based laboratory task. Which additional information is needed before treating the task as assessed? Select all that apply.<\/p>", "questionText": "You receive a current Safety Data Sheet (SDS) for a new solvent-based laboratory task. Which additional information is needed before treating the task as assessed? Select all that apply.", "optionsRaw": "A. Quantity and concentration used.<br>B. Whether handling is open or closed and what ventilation is used.<br>C. Process temperature, pressure, or other energy.<br>D. Frequency/duration and worker proximity.<br>E. Credible abnormal conditions and incompatible materials.", "correctRaw": "A, B, C, D, E", "feedbackCorrectHtml": "<p>All five are task-specific variables the supplier SDS generally cannot fully determine for the local workplace.<\/p>", "feedbackIncorrectHtml": "<p>Omitting any option leaves out a material part of task-specific risk reasoning. The question does not ask the learner to calculate risk, only to identify necessary context.<\/p>", "sources": ["CCOHS-SDS", "AB-OHS-4 s.21", "source dossier §8"], "graded": true, "difficulty": "Applied", "accessibility": null, "mode": "multi", "options": [{"key": "A", "text": "Quantity and concentration used."}, {"key": "B", "text": "Whether handling is open or closed and what ventilation is used."}, {"key": "C", "text": "Process temperature, pressure, or other energy."}, {"key": "D", "text": "Frequency/duration and worker proximity."}, {"key": "E", "text": "Credible abnormal conditions and incompatible materials."}], "correctKeys": ["A", "B", "C", "D", "E"]}, "objectives": ["LO2"], "sources": ["CCOHS-SDS", "AB-OHS-4 s.21", "source dossier §8"], "module": "GA", "moduleTitle": "Graded assessment", "visual": null, "optional": false}, {"id": "GA-04", "kind": "graded", "type": "graded assessment", "subtype": "scenario multiple choice", "title": "Assessment item 04", "question": {"id": "GA-04", "itemType": "scenario multiple choice", "objectives": ["LO2"], "questionHtml": "<p>A worker transfers a hazardous product into a portable bottle, uses some of it, and stores the rest for another worker on the next shift. Which statement best fits Alberta’s decanting rule described in the course?<\/p>", "questionText": "A worker transfers a hazardous product into a portable bottle, uses some of it, and stores the rest for another worker on the next shift. Which statement best fits Alberta’s decanting rule described in the course?", "optionsRaw": "A. It clearly meets the immediate-use exception because the bottle is portable.<br>B. It does not meet all immediate-use conditions; the work-site-labelling requirement must be addressed.<br>C. It is automatically a laboratory sample.<br>D. No label issue exists if both workers know the product informally.", "correctRaw": "B", "feedbackCorrectHtml": "<p>Alberta s.400’s immediate-use exception requires all product to be for immediate use, exclusive control by the worker who filled it, use during that shift, and clear identification.<\/p>", "feedbackIncorrectHtml": "<p>A omits the specific conditions. C confuses a separate HPR category. D substitutes informal knowledge for the legal conditions.<\/p>", "sources": ["AB-OHS-29 s.400", "HPR-5"], "graded": true, "difficulty": "Applied", "accessibility": null, "mode": "single", "options": [{"key": "A", "text": "It clearly meets the immediate-use exception because the bottle is portable."}, {"key": "B", "text": "It does not meet all immediate-use conditions; the work-site-labelling requirement must be addressed."}, {"key": "C", "text": "It is automatically a laboratory sample."}, {"key": "D", "text": "No label issue exists if both workers know the product informally."}], "correctKey": "B"}, "objectives": ["LO2"], "sources": ["AB-OHS-29 s.400", "HPR-5"], "module": "GA", "moduleTitle": "Graded assessment", "visual": null, "optional": false}, {"id": "GA-05", "kind": "graded", "type": "graded assessment", "subtype": "interpretation", "title": "Assessment item 05", "question": {"id": "GA-05", "itemType": "interpretation", "objectives": ["LO2"], "questionHtml": "<p>A Safety Data Sheet (SDS) lists handling precautions and personal protective equipment (PPE) information. A colleague says, “That means the SDS has already decided exactly which gloves and respirator are correct for our task.” What is the best response?<\/p>", "questionText": "A Safety Data Sheet (SDS) lists handling precautions and personal protective equipment (PPE) information. A colleague says, “That means the SDS has already decided exactly which gloves and respirator are correct for our task.” What is the best response?", "optionsRaw": "A. Correct; supplier SDS advice always replaces local assessment.<br>B. Not necessarily. SDS advice can be general, while task-specific PPE or respirator selection depends on the substance, task, exposure conditions, and qualified local program.<br>C. Correct if the SDS is less than three years old.<br>D. Incorrect because SDSs never contain PPE information.", "correctRaw": "B", "feedbackCorrectHtml": "<p>CCOHS notes that SDS guidance may not be sufficiently workplace-specific for PPE/respirator decisions. The dossier explicitly reserves those selections for substance- and task-specific qualified review.<\/p>", "feedbackIncorrectHtml": "<p>A overstates the document. C relies on an outdated simplification and is not the current rule taught. D is false because Section 8 can contain PPE/control information.<\/p>", "sources": ["CCOHS-SDS", "source dossier §26"], "graded": true, "difficulty": "Applied", "accessibility": null, "mode": "single", "options": [{"key": "A", "text": "Correct; supplier SDS advice always replaces local assessment."}, {"key": "B", "text": "Not necessarily. SDS advice can be general, while task-specific PPE or respirator selection depends on the substance, task, exposure conditions, and qualified local program."}, {"key": "C", "text": "Correct if the SDS is less than three years old."}, {"key": "D", "text": "Incorrect because SDSs never contain PPE information."}], "correctKey": "B"}, "objectives": ["LO2"], "sources": ["CCOHS-SDS", "source dossier §26"], "module": "GA", "moduleTitle": "Graded assessment", "visual": null, "optional": false}, {"id": "GA-06", "kind": "graded", "type": "graded assessment", "subtype": "scenario multiple choice", "title": "Assessment item 06", "question": {"id": "GA-06", "itemType": "scenario multiple choice", "objectives": ["LO3"], "questionHtml": "<p>A recurring exposure opportunity exists because workers manually open a process that could feasibly be enclosed. Which control should receive first consideration?<\/p>", "questionText": "A recurring exposure opportunity exists because workers manually open a process that could feasibly be enclosed. Which control should receive first consideration?", "optionsRaw": "A. A reminder sign.<br>B. Enclosing or redesigning the process to reduce open exposure.<br>C. Repeating the same training monthly without changing the process.<br>D. Adding personal protective equipment (PPE) as the only change.", "correctRaw": "B", "feedbackCorrectHtml": "<p>An enclosure/redesign is an engineering approach and should be considered before relying mainly on administrative controls or PPE where reasonably practicable.<\/p>", "feedbackIncorrectHtml": "<p>A/C are administrative. D is PPE-only and does not address the open source.<\/p>", "sources": ["AB-OHS-2 s.9"], "graded": true, "difficulty": "Applied", "accessibility": null, "mode": "single", "options": [{"key": "A", "text": "A reminder sign."}, {"key": "B", "text": "Enclosing or redesigning the process to reduce open exposure."}, {"key": "C", "text": "Repeating the same training monthly without changing the process."}, {"key": "D", "text": "Adding personal protective equipment (PPE) as the only change."}], "correctKey": "B"}, "objectives": ["LO3"], "sources": ["AB-OHS-2 s.9"], "module": "GA", "moduleTitle": "Graded assessment", "visual": null, "optional": false}, {"id": "GA-07", "kind": "graded", "type": "graded assessment", "subtype": "scenario multiple choice", "title": "Assessment item 07", "question": {"id": "GA-07", "itemType": "scenario multiple choice", "objectives": ["LO3"], "questionHtml": "<p>A laboratory stores chemicals alphabetically. Two nearby products are incompatible according to their SDS reactivity information. What is the best course-level conclusion?<\/p>", "questionText": "A laboratory stores chemicals alphabetically. Two nearby products are incompatible according to their SDS reactivity information. What is the best course-level conclusion?", "optionsRaw": "A. Alphabetical storage is sufficient because names are easy to find.<br>B. Storage should be reviewed for chemical compatibility; alphabetical order alone is not an adequate compatibility system.<br>C. Put every hazardous chemical in the same secondary tray.<br>D. Compatibility matters only for waste.", "correctRaw": "B", "feedbackCorrectHtml": "<p>Compatibility, not alphabetic convenience or one hazard category alone, should drive the storage decision. Secondary containment must also avoid mixing incompatible leaks.<\/p>", "feedbackIncorrectHtml": "<p>A ignores reactivity. C can create a mixing pathway. D is false; incompatibility matters in storage and use as well as waste.<\/p>", "sources": ["CCOHS-CABINETS", "CCOHS-SDS", "AB-OHS-4 s.27"], "graded": true, "difficulty": "Applied", "accessibility": null, "mode": "single", "options": [{"key": "A", "text": "Alphabetical storage is sufficient because names are easy to find."}, {"key": "B", "text": "Storage should be reviewed for chemical compatibility; alphabetical order alone is not an adequate compatibility system."}, {"key": "C", "text": "Put every hazardous chemical in the same secondary tray."}, {"key": "D", "text": "Compatibility matters only for waste."}], "correctKey": "B"}, "objectives": ["LO3"], "sources": ["CCOHS-CABINETS", "CCOHS-SDS", "AB-OHS-4 s.27"], "module": "GA", "moduleTitle": "Graded assessment", "visual": null, "optional": false}, {"id": "GA-08", "kind": "graded", "type": "graded assessment", "subtype": "scenario multiple choice", "title": "Assessment item 08", "question": {"id": "GA-08", "itemType": "scenario multiple choice", "objectives": ["LO4"], "questionHtml": "<p>A process is moved to a different room and modified to use a larger quantity with new equipment. What is the best response before relying on the old hazard assessment?<\/p>", "questionText": "A process is moved to a different room and modified to use a larger quantity with new equipment. What is the best response before relying on the old hazard assessment?", "optionsRaw": "A. Use the old assessment because the product name is unchanged.<br>B. Reassess because the process/operation and work-site conditions have changed.<br>C. Wait for an incident to see whether the change matters.<br>D. Only update the inventory owner name.", "correctRaw": "B", "feedbackCorrectHtml": "<p>Alberta s.7 requires reassessment when new processes are introduced, operations change, or significant work-site alterations occur. Quantity/equipment/location changes can also materially affect task risk.<\/p>", "feedbackIncorrectHtml": "<p>A focuses only on product identity. C is reactive and inconsistent with hazard-assessment duties. D is insufficient.<\/p>", "sources": ["AB-OHS-2 s.7(4)", "source dossier §13"], "graded": true, "difficulty": "Applied", "accessibility": null, "mode": "single", "options": [{"key": "A", "text": "Use the old assessment because the product name is unchanged."}, {"key": "B", "text": "Reassess because the process/operation and work-site conditions have changed."}, {"key": "C", "text": "Wait for an incident to see whether the change matters."}, {"key": "D", "text": "Only update the inventory owner name."}], "correctKey": "B"}, "objectives": ["LO4"], "sources": ["AB-OHS-2 s.7(4)", "source dossier §13"], "module": "GA", "moduleTitle": "Graded assessment", "visual": null, "optional": false}, {"id": "GA-09", "kind": "graded", "type": "graded assessment", "subtype": "scenario multiple choice", "title": "Assessment item 09", "question": {"id": "GA-09", "itemType": "scenario multiple choice", "objectives": ["LO4"], "questionHtml": "<p>An uncontrolled laboratory event has occurred and a worker is injured. Which action comes first?<\/p>", "questionText": "An uncontrolled laboratory event has occurred and a worker is injured. Which action comes first?", "optionsRaw": "A. Complete the root-cause diagram.<br>B. Protect the worker and activate the local emergency response; preserve evidence when it is safe to do so.<br>C. Interview every witness before memories change.<br>D. Return the area to normal before anyone sees it.", "correctRaw": "B", "feedbackCorrectHtml": "<p>Emergency response and care precede investigation. Alberta’s scene-preservation rule also contains explicit exceptions for attending to people and preventing further harm.<\/p>", "feedbackIncorrectHtml": "<p>A/C place investigation ahead of immediate safety. D can destroy evidence and may conflict with scene-preservation duties.<\/p>", "sources": ["AB-OHS-7", "AB-OHS-ACT-33(9)"], "graded": true, "difficulty": "Foundational", "accessibility": null, "mode": "single", "options": [{"key": "A", "text": "Complete the root-cause diagram."}, {"key": "B", "text": "Protect the worker and activate the local emergency response; preserve evidence when it is safe to do so."}, {"key": "C", "text": "Interview every witness before memories change."}, {"key": "D", "text": "Return the area to normal before anyone sees it."}], "correctKey": "B"}, "objectives": ["LO4"], "sources": ["AB-OHS-7", "AB-OHS-ACT-33(9)"], "module": "GA", "moduleTitle": "Graded assessment", "visual": null, "optional": false}, {"id": "GA-10", "kind": "graded", "type": "graded assessment", "subtype": "scenario multiple choice", "title": "Assessment item 10", "question": {"id": "GA-10", "itemType": "scenario multiple choice", "objectives": ["LO4"], "questionHtml": "<p>A near miss causes no injury, but the event had a credible likelihood of causing serious illness and the organization may need corrective action to prevent recurrence. What should the learner recognize?<\/p>", "questionText": "A near miss causes no injury, but the event had a credible likelihood of causing serious illness and the organization may need corrective action to prevent recurrence. What should the learner recognize?", "optionsRaw": "A. No investigation can be required because nobody was hurt.<br>B. Alberta s.33(5) can require investigation of such a high-potential incident; the event should be escalated through the responsible organizational process.<br>C. The worker should make a final legal ruling alone.<br>D. The event only matters if equipment was damaged.", "correctRaw": "B", "feedbackCorrectHtml": "<p>Alberta’s high-potential provision is based on likelihood of serious injury/illness and possible need for corrective action, not on actual injury alone.<\/p>", "feedbackIncorrectHtml": "<p>A and D use the wrong test. C exceeds the learner’s role and the course boundary.<\/p>", "sources": ["AB-OHS-ACT-33(5)"], "graded": true, "difficulty": "Applied", "accessibility": null, "mode": "single", "options": [{"key": "A", "text": "No investigation can be required because nobody was hurt."}, {"key": "B", "text": "Alberta s.33(5) can require investigation of such a high-potential incident; the event should be escalated through the responsible organizational process."}, {"key": "C", "text": "The worker should make a final legal ruling alone."}, {"key": "D", "text": "The event only matters if equipment was damaged."}], "correctKey": "B"}, "objectives": ["LO4"], "sources": ["AB-OHS-ACT-33(5)"], "module": "GA", "moduleTitle": "Graded assessment", "visual": null, "optional": false}, {"id": "GA-11", "kind": "graded", "type": "graded assessment", "subtype": "scenario analysis", "title": "Assessment item 11", "question": {"id": "GA-11", "itemType": "scenario analysis", "objectives": ["LO5"], "questionHtml": "<p>An investigation file contains: an alarm log, a photo of a damaged fitting, a witness saying “maintenance caused this,” and a maintenance record showing the last service date. Which item is most clearly an interpretation rather than direct evidence?<\/p>", "questionText": "An investigation file contains: an alarm log, a photo of a damaged fitting, a witness saying “maintenance caused this,” and a maintenance record showing the last service date. Which item is most clearly an interpretation rather than direct evidence?", "optionsRaw": "A. The alarm log.<br>B. The photo.<br>C. The statement “maintenance caused this.”<br>D. The maintenance record.", "correctRaw": "C", "feedbackCorrectHtml": "<p>The statement asserts causation. The other items are direct records or observations that can inform but do not themselves prove cause.<\/p>", "feedbackIncorrectHtml": "<p>A/B/D are evidence sources. They still require interpretation, but their existence/content is directly verifiable.<\/p>", "sources": ["CCOHS-INVEST", "source dossier §16"], "graded": true, "difficulty": "Applied", "accessibility": null, "mode": "single", "options": [{"key": "A", "text": "The alarm log."}, {"key": "B", "text": "The photo."}, {"key": "C", "text": "The statement “maintenance caused this.”"}, {"key": "D", "text": "The maintenance record."}], "correctKey": "C"}, "objectives": ["LO5"], "sources": ["CCOHS-INVEST", "source dossier §16"], "module": "GA", "moduleTitle": "Graded assessment", "visual": null, "optional": false}, {"id": "GA-12", "kind": "graded", "type": "graded assessment", "subtype": "scenario analysis", "title": "Assessment item 12", "question": {"id": "GA-12", "itemType": "scenario analysis", "objectives": ["LO5"], "questionHtml": "<p>An investigator writes, “Root cause: worker did not follow the procedure.” What is the best next step?<\/p>", "questionText": "An investigator writes, “Root cause: worker did not follow the procedure.” What is the best next step?", "optionsRaw": "A. Stop; the root cause is complete.<br>B. Examine why the procedure was not followed, including task design, equipment, materials, workload, training/competence, supervision, and whether the procedure matched real work.<br>C. Delete the worker interview.<br>D. Retrain everyone before reviewing evidence.", "correctRaw": "B", "feedbackCorrectHtml": "<p>CCOHS recommends examining task, material, environment, personnel, and management factors instead of stopping at carelessness or worker error.<\/p>", "feedbackIncorrectHtml": "<p>A stops too early. C removes potentially useful evidence. D selects an action before causal analysis.<\/p>", "sources": ["CCOHS-INVEST"], "graded": true, "difficulty": "Integrative", "accessibility": null, "mode": "single", "options": [{"key": "A", "text": "Stop; the root cause is complete."}, {"key": "B", "text": "Examine why the procedure was not followed, including task design, equipment, materials, workload, training/competence, supervision, and whether the procedure matched real work."}, {"key": "C", "text": "Delete the worker interview."}, {"key": "D", "text": "Retrain everyone before reviewing evidence."}], "correctKey": "B"}, "objectives": ["LO5"], "sources": ["CCOHS-INVEST"], "module": "GA", "moduleTitle": "Graded assessment", "visual": null, "optional": false}, {"id": "GA-13", "kind": "graded", "type": "graded assessment", "subtype": "categorization", "title": "Assessment item 13", "question": {"id": "GA-13", "itemType": "categorization", "objectives": ["LO6"], "questionHtml": "<p>After a recurring inventory problem is found, the laboratory (1) corrects several wrong records, (2) temporarily restricts use of uncertain containers, (3) redesigns the purchase-to-disposal lifecycle so records close automatically when disposal is confirmed, and (4) reviews other laboratories for the same failure mode. Which classification is best?<\/p>", "questionText": "After a recurring inventory problem is found, the laboratory (1) corrects several wrong records, (2) temporarily restricts use of uncertain containers, (3) redesigns the purchase-to-disposal lifecycle so records close automatically when disposal is confirmed, and (4) reviews other laboratories for the same failure mode. Which classification is best?", "optionsRaw": "A. 1 corrective, 2 preventive, 3 containment, 4 correction.<br>B. 1 correction, 2 containment, 3 corrective action, 4 preventive action.<br>C. All four are corrections.<br>D. All four are preventive actions.", "correctRaw": "B", "feedbackCorrectHtml": "<p>The sequence separates immediate fix, interim containment, cause-focused redesign, and proactive broader prevention.<\/p>", "feedbackIncorrectHtml": "<p>A reverses the purposes. C/D erase meaningful distinctions required for CAPA logic.<\/p>", "sources": ["HC-CAPA", "CCOHS-LABS"], "graded": true, "difficulty": "Applied", "accessibility": null, "mode": "single", "options": [{"key": "A", "text": "1 corrective, 2 preventive, 3 containment, 4 correction."}, {"key": "B", "text": "1 correction, 2 containment, 3 corrective action, 4 preventive action."}, {"key": "C", "text": "All four are corrections."}, {"key": "D", "text": "All four are preventive actions."}], "correctKey": "B"}, "objectives": ["LO6"], "sources": ["HC-CAPA", "CCOHS-LABS"], "module": "GA", "moduleTitle": "Graded assessment", "visual": null, "optional": false}, {"id": "GA-14", "kind": "graded", "type": "graded assessment", "subtype": "scenario evaluation", "title": "Assessment item 14", "question": {"id": "GA-14", "itemType": "scenario evaluation", "objectives": ["LO6"], "questionHtml": "<p>An investigation supports a causal factor: two waste streams have nearly identical shorthand labels and are stored together. Which action package best matches the evidence?<\/p>", "questionText": "An investigation supports a causal factor: two waste streams have nearly identical shorthand labels and are stored together. Which action package best matches the evidence?", "optionsRaw": "A. Retrain one worker and leave the setup unchanged.<br>B. Standardize identification and separate incompatible streams, update the workflow/procedure, train affected staff on the changed system, and plan an effectiveness check.<br>C. Close the issue because no injury occurred.<br>D. Add a general safety poster.", "correctRaw": "B", "feedbackCorrectHtml": "<p>The package addresses the supported identification/segregation causes using stronger controls, supports the changed system administratively, and includes effectiveness review.<\/p>", "feedbackIncorrectHtml": "<p>A/D leave the main system conditions unchanged. C ignores the high-potential and recurrence logic.<\/p>", "sources": ["AB-OHS-2 s.9", "AB-OHS-29 s.396", "CCOHS-INVEST", "HC-CAPA"], "graded": true, "difficulty": "Integrative", "accessibility": null, "mode": "single", "options": [{"key": "A", "text": "Retrain one worker and leave the setup unchanged."}, {"key": "B", "text": "Standardize identification and separate incompatible streams, update the workflow/procedure, train affected staff on the changed system, and plan an effectiveness check."}, {"key": "C", "text": "Close the issue because no injury occurred."}, {"key": "D", "text": "Add a general safety poster."}], "correctKey": "B"}, "objectives": ["LO6"], "sources": ["AB-OHS-2 s.9", "AB-OHS-29 s.396", "CCOHS-INVEST", "HC-CAPA"], "module": "GA", "moduleTitle": "Graded assessment", "visual": null, "optional": false}, {"id": "GA-15", "kind": "graded", "type": "graded assessment", "subtype": "scenario evaluation", "title": "Assessment item 15", "question": {"id": "GA-15", "itemType": "scenario evaluation", "objectives": ["LO6"], "questionHtml": "<p>A corrective and preventive action (CAPA) record shows: engineering modification installed, procedure approved, and training complete. Which additional evidence is most important before claiming effectiveness?<\/p>", "questionText": "A corrective and preventive action (CAPA) record shows: engineering modification installed, procedure approved, and training complete. Which additional evidence is most important before claiming effectiveness?", "optionsRaw": "A. Confirmation that all tasks were checked off.<br>B. Evidence that the modified control or process actually reduced the targeted risk or recurrence over an appropriate review period or set of opportunities.<br>C. A statement that the team worked hard.<br>D. A lower number of reports by itself.", "correctRaw": "B", "feedbackCorrectHtml": "<p>Verification confirms implementation. Effectiveness requires evidence that the intended outcome improved. Report counts alone can also be affected by reporting behaviour.<\/p>", "feedbackIncorrectHtml": "<p>A is still implementation evidence. C is not an effectiveness measure. D is an ambiguous metric without context.<\/p>", "sources": ["HC-CAPA", "CCOHS-INDICATORS", "KYUNG-2023"], "graded": true, "difficulty": "Integrative", "accessibility": null, "mode": "single", "options": [{"key": "A", "text": "Confirmation that all tasks were checked off."}, {"key": "B", "text": "Evidence that the modified control or process actually reduced the targeted risk or recurrence over an appropriate review period or set of opportunities."}, {"key": "C", "text": "A statement that the team worked hard."}, {"key": "D", "text": "A lower number of reports by itself."}], "correctKey": "B"}, "objectives": ["LO6"], "sources": ["HC-CAPA", "CCOHS-INDICATORS", "KYUNG-2023"], "module": "GA", "moduleTitle": "Graded assessment", "visual": null, "optional": false}], "modules": {"S1": "Course introduction", "S2": "Background and foundations", "T1": "Why the task matters as much as the product", "T2": "Hazard information has to stay connected to the work", "T3": "Start with controls that act closest to the hazard", "T4": "Deal with the emergency first", "T5": "What happened, and what conditions made it possible?", "T6": "Fixing the visible problem is not the same as preventing recurrence", "T7": "Measure prevention as well as outcomes", "R": "Course review", "GA": "Graded assessment"}, "glossary": [{"term": "Administrative control", "definitionHtml": "<p>A rule, procedure, schedule, training requirement, access restriction, inspection, or other work-practice control. Administrative controls are lower in the hierarchy than elimination and engineering controls where higher-order controls are reasonably practicable.<\/p>", "sources": ["AB-OHS-2 s.9"]}, {"term": "As low as reasonably achievable (ALARA)", "definitionHtml": "<p>The Alberta Part 4 principle that exposure to harmful substances is to be kept as low as reasonably achievable, in addition to applicable exposure-limit requirements.<\/p>", "sources": ["AB-OHS-4 s.16"]}, {"term": "CAPA", "definitionHtml": "<p>Corrective and preventive action. A formal quality-system concept in some regulated sectors and a useful management framework more broadly; it is not automatically a universal legal requirement for every laboratory.<\/p>", "sources": ["HC-CAPA", "HC-GMP-V4"]}, {"term": "Containment", "definitionHtml": "<p>Immediate or interim action used to limit spread, exposure, or impact while a problem is being investigated.<\/p>", "sources": ["HC-CAPA"]}, {"term": "Consequence / severity", "definitionHtml": "<p>The credible magnitude of harm if an exposure or event occurs.<\/p>", "sources": ["AB-OHS-2", "source dossier §3.4"]}, {"term": "Contributing factor", "definitionHtml": "<p>A condition or action that increased the likelihood or severity of an event but may not explain the event by itself.<\/p>", "sources": ["CCOHS-INVEST"]}, {"term": "Correction", "definitionHtml": "<p>Action that fixes the immediate detected problem.<\/p>", "sources": ["HC-CAPA"]}, {"term": "Corrective action", "definitionHtml": "<p>Action intended to address a cause of a detected problem so recurrence is less likely.<\/p>", "sources": ["HC-CAPA"]}, {"term": "Deviation", "definitionHtml": "<p>A departure from an approved or expected process, procedure, method, condition, or requirement. Exact definitions vary by quality system.<\/p>", "sources": ["HC-CAPA"]}, {"term": "Effectiveness check", "definitionHtml": "<p>A planned review that asks whether an implemented action actually produced the intended improvement.<\/p>", "sources": ["HC-CAPA"]}, {"term": "Engineering control", "definitionHtml": "<p>A physical or designed control that removes, isolates, or reduces exposure to a hazard.<\/p>", "sources": ["AB-OHS-2 s.9"]}, {"term": "Exposure", "definitionHtml": "<p>Contact between a person and a harmful agent through a relevant route such as inhalation, skin, eye, ingestion, or injection.<\/p>", "sources": ["AB-OHS-4", "CCOHS-SDS"]}, {"term": "Globally Harmonized System (GHS)", "definitionHtml": "<p>The United Nations international model for chemical hazard classification and communication. Canadian WHMIS uses GHS-based concepts through Canadian law.<\/p>", "sources": ["UNECE-GHS11", "HC-WHMIS-GUIDE"]}, {"term": "Hazard", "definitionHtml": "<p>A source, material, situation, or condition with the potential to cause harm.<\/p>", "sources": ["AB-OHS-2"]}, {"term": "Hierarchy of controls", "definitionHtml": "<p>A structured approach to hazard control that prioritizes removal and higher-order controls before relying mainly on administrative controls and PPE. Alberta’s legal control sequence is set out in OHS Code s.9.<\/p>", "sources": ["AB-OHS-2 s.9"]}, {"term": "Incident", "definitionHtml": "<p>An undesired event that caused or could have caused harm or loss. Internal organizational definitions can vary.<\/p>", "sources": ["CCOHS-INVEST"]}, {"term": "Likelihood", "definitionHtml": "<p>The chance that an exposure or event will occur under the defined conditions.<\/p>", "sources": ["AB-OHS-2", "source dossier §3.5"]}, {"term": "Near miss", "definitionHtml": "<p>An event in which serious harm did not occur but could credibly have occurred. Internal terminology does not replace Alberta’s statutory tests for reporting or investigation.<\/p>", "sources": ["AB-OHS-ACT-33"]}, {"term": "Nonconformity", "definitionHtml": "<p>Failure to meet a requirement, such as a law, procedure, specification, standard, or quality-system requirement.<\/p>", "sources": ["HC-CAPA", "WHO-LQMS"]}, {"term": "Occupational exposure limit (OEL)", "definitionHtml": "<p>A regulated benchmark used in controlling occupational airborne exposure. Applying substance-specific limits can require competent occupational-hygiene expertise.<\/p>", "sources": ["AB-OHS-4 ss.16–20"]}, {"term": "Personal protective equipment (PPE)", "definitionHtml": "<p>Equipment worn by a worker to reduce exposure or injury. PPE is a lower-order control than elimination and engineering where higher-order controls are reasonably practicable.<\/p>", "sources": ["AB-OHS-2 s.9"]}, {"term": "Preventive action", "definitionHtml": "<p>Action intended to prevent a potential or related problem before occurrence or recurrence elsewhere. Terminology varies by management system.<\/p>", "sources": ["HC-CAPA"]}, {"term": "Residual risk", "definitionHtml": "<p>A plain-language course term for risk remaining after existing controls are considered. It is not presented as a statutory Alberta definition.<\/p>", "sources": ["source dossier §8.8"]}, {"term": "Risk", "definitionHtml": "<p>A judgment about the likelihood and consequence of harm under the actual task and control conditions.<\/p>"
