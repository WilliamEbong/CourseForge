fore fully risk-assessed.<br>B. The product information is in place, but the workplace still needs task-specific information such as quantity, exposure route, equipment, ventilation, process conditions, and abnormal scenarios.<br>C. The inventory no longer matters.<br>D. Only the chemical name matters once the SDS is current.", "correctRaw": "B", "feedbackCorrectHtml": "<p>Labels and SDSs are essential inputs, but task-specific risk depends on workplace conditions that the supplier document usually cannot know.<\/p>", "feedbackIncorrectHtml": "<p>A: Confuses product information with task assessment.<br>C: Inventory supports identity, location, lifecycle, and SDS linkage.<br>D: Product identity alone does not establish risk.<\/p>", "sources": ["CCOHS-SDS", "CCOHS-LABS", "AB-OHS-4 s.21"], "graded": false, "difficulty": null, "accessibility": "Single-select list.", "mode": "single", "options": [{"key": "A", "text": "The task is therefore fully risk-assessed."}, {"key": "B", "text": "The product information is in place, but the workplace still needs task-specific information such as quantity, exposure route, equipment, ventilation, process conditions, and abnormal scenarios."}, {"key": "C", "text": "The inventory no longer matters."}, {"key": "D", "text": "Only the chemical name matters once the SDS is current."}], "correctKey": "B"}, "objectives": ["LO2"], "sources": ["CCOHS-SDS", "CCOHS-LABS", "AB-OHS-4 s.21"], "module": "T2", "moduleTitle": "Hazard information has to stay connected to the work", "visual": null, "optional": false}, {"id": "T3-01", "kind": "content", "type": "topic title", "subtype": "relevance", "title": "Start with controls that act closest to the hazard", "contentHtml": "<p>Once the task risk is understood, first consider whether the hazard can be removed, replaced, isolated, or redesigned. Personal protective equipment (PPE) comes later in the hierarchy because it leaves the hazard in place and depends on correct use. Alberta’s control hierarchy requires elimination or control of identified hazards and gives priority to engineering controls where reasonably practicable before administrative controls and PPE.<\/p>", "contentText": "Once the task risk is understood, first consider whether the hazard can be removed, replaced, isolated, or redesigned. Personal protective equipment (PPE) comes later in the hierarchy because it leaves the hazard in place and depends on correct use. Alberta’s control hierarchy requires elimination or control of identified hazards and gives priority to engineering controls where reasonably practicable before administrative controls and PPE.", "treatment": "Frames hierarchy as a decision principle.", "visualDirection": "Original hierarchy diagram with text labels and no colour-dependent meaning.", "accessibility": "Ordered text hierarchy is provided in the next block.", "objectives": ["LO3"], "sources": ["AB-OHS-2 s.9"], "module": "T3", "moduleTitle": "Start with controls that act closest to the hazard", "visual": null, "optional": false}, {"id": "T3-02", "kind": "content", "type": "process", "subtype": "hierarchy", "title": "The hierarchy of controls", "contentHtml": "<p>Use the hierarchy in this order:<br><br>1. <strong>Elimination:<\/strong> remove the hazard or unnecessary hazardous task.<br>2. <strong>Substitution:<\/strong> replace it with a less hazardous material or process, then reassess the new risk.<br>3. <strong>Engineering controls:<\/strong> isolate people from the hazard through equipment or physical design.<br>4. <strong>Administrative controls:<\/strong> procedures, scheduling, access rules, training, signage, permits, inspections, and supervision.<br>5. <strong>Personal protective equipment (PPE):<\/strong> equipment worn by the worker.<br><br>Controls can be combined. Start with higher-order options where they are reasonably practicable, then add lower-level controls as needed.<\/p>", "contentText": "Use the hierarchy in this order: 1. Elimination: remove the hazard or unnecessary hazardous task. 2. Substitution: replace it with a less hazardous material or process, then reassess the new risk. 3. Engineering controls: isolate people from the hazard through equipment or physical design. 4. Administrative controls: procedures, scheduling, access rules, training, signage, permits, inspections, and supervision. 5. Personal protective equipment (PPE): equipment worn by the worker. Controls can be combined. Start with higher-order options where they are reasonably practicable, then add lower-level controls as needed.", "treatment": "Core hierarchy teaching block.", "visualDirection": "Original vertical hierarchy or stacked ladder. Avoid implying exact universal effectiveness ratios.", "accessibility": "Provide numbered list exactly as shown.", "objectives": ["LO3"], "sources": ["AB-OHS-2 s.9"], "module": "T3", "moduleTitle": "Start with controls that act closest to the hazard", "visual": "V-10", "optional": false}, {"id": "T3-03", "kind": "content", "type": "comparison", "subtype": "control limitations", "title": "Why PPE and training have limits", "contentHtml": "<p>PPE can be essential, but it does not remove the hazard and depends on correct selection, fit, use, maintenance, and replacement. Training is also important, but it is an administrative control. If the problem is an open manual transfer, an absent guard, poor ventilation, confusing equipment design, or incompatible storage, retraining leaves that condition in place. The control should address the condition that is creating the risk.<\/p>", "contentText": "PPE can be essential, but it does not remove the hazard and depends on correct selection, fit, use, maintenance, and replacement. Training is also important, but it is an administrative control. If the problem is an open manual transfer, an absent guard, poor ventilation, confusing equipment design, or incompatible storage, retraining leaves that condition in place. The control should address the condition that is creating the risk.", "treatment": "Connects control hierarchy to later CAPA.", "visualDirection": "Original comparison: “changes the hazard/process” versus “depends on behaviour.”", "accessibility": "Full text provides alternative; visual must not rank by colour alone.", "objectives": ["LO3", "LO6"], "sources": ["AB-OHS-2 s.9", "CCOHS-INVEST", "HC-CAPA"], "module": "T3", "moduleTitle": "Start with controls that act closest to the hazard", "visual": null, "optional": false}, {"id": "T3-04", "kind": "content", "type": "content", "subtype": "storage", "title": "Store for compatibility, not convenience", "contentHtml": "<p>Chemical storage should be based on <strong>compatibility<\/strong>, not alphabetical order or one broad hazard category alone. A substance can belong to more than one hazard class, and one property may dominate the storage decision. Use SDS handling/reactivity information, institutional compatibility guidance, and qualified review where needed. Secondary containment is useful only if it is itself compatible and does not create a tray where incompatible leaks can mix.<\/p>", "contentText": "Chemical storage should be based on compatibility, not alphabetical order or one broad hazard category alone. A substance can belong to more than one hazard class, and one property may dominate the storage decision. Use SDS handling/reactivity information, institutional compatibility guidance, and qualified review where needed. Secondary containment is useful only if it is itself compatible and does not create a tray where incompatible leaks can mix.", "treatment": "Conceptual storage guidance only; no detailed segregation matrix is taught.", "visualDirection": "Original “alphabetical is not enough” shelf schematic with separated generic classes.", "accessibility": "Text states all principles. Visual labels use words, not colour codes.", "objectives": ["LO2", "LO3"], "sources": ["CCOHS-CABINETS", "CCOHS-SDS", "AB-OHS-4 s.27", "source dossier §11"], "module": "T3", "moduleTitle": "Start with controls that act closest to the hazard", "visual": "V-11", "optional": false}, {"id": "T3-05", "kind": "content", "type": "comparison", "subtype": "hazard groups", "title": "Common hazard groups: what changes the control question?", "contentHtml": "<p>Different hazard groups create different failure modes. Examples include flammables, oxidizers, corrosives, acutely toxic chemicals, sensitizers, carcinogens or reproductive hazards, compressed gases, cryogens, peroxide-formers, pyrophoric or water-reactive materials, and hazardous waste. The course does <strong>not<\/strong> teach operating procedures for these materials. The transferable question is: <strong>What exposure, fire, pressure, incompatibility, instability, or contamination pathway must the controls interrupt?<\/strong> High-hazard materials require competent local procedures and supervision.<\/p>", "contentText": "Different hazard groups create different failure modes. Examples include flammables, oxidizers, corrosives, acutely toxic chemicals, sensitizers, carcinogens or reproductive hazards, compressed gases, cryogens, peroxide-formers, pyrophoric or water-reactive materials, and hazardous waste. The course does not teach operating procedures for these materials. The transferable question is: What exposure, fire, pressure, incompatibility, instability, or contamination pathway must the controls interrupt? High-hazard materials require competent local procedures and supervision.", "treatment": "Overview only. Optional hazard-family cards may expand conceptual controls, not procedures.", "visualDirection": "Original matrix: hazard group / main type of failure / control question. No chemical recipes.", "accessibility": "Provide text table alternative. Optional cards must be keyboard-expandable or always visible.", "objectives": ["LO3"], "sources": ["CCOHS-FLAME", "CCOHS-OX", "CCOHS-CABINETS", "AB-OHS-29 s.396", "source dossier §10"], "module": "T3", "moduleTitle": "Start with controls that act closest to the hazard", "visual": null, "optional": false}, {"id": "T3-06", "kind": "content", "type": "content", "subtype": "emergency equipment", "title": "Decontamination and emergency washing are part of control planning", "contentHtml": "<p>Alberta Part 4 requires suitable decontamination facilities where workers may be contaminated, and immediate access to emergency baths, showers, eyewash, or other equipment appropriate to the potential exposure when chemicals harmful to the eyes or skin are used. The course does not prescribe equipment selection or placement for a particular process. The planning lesson is that emergency washing is part of the risk-control system and must match the potential exposure.<\/p>", "contentText": "Alberta Part 4 requires suitable decontamination facilities where workers may be contaminated, and immediate access to emergency baths, showers, eyewash, or other equipment appropriate to the potential exposure when chemicals harmful to the eyes or skin are used. The course does not prescribe equipment selection or placement for a particular process. The planning lesson is that emergency washing is part of the risk-control system and must match the potential exposure.", "treatment": "Legal awareness with explicit design boundary.", "visualDirection": "No photo needed. Optional original icon-and-text callout.", "accessibility": "All content in text.", "objectives": ["LO3", "LO4"], "sources": ["AB-OHS-4 ss.23–24"], "module": "T3", "moduleTitle": "Start with controls that act closest to the hazard", "visual": null, "optional": false}, {"id": "T3-07", "kind": "content", "type": "content", "subtype": "engineering control", "title": "Local exhaust and fume hoods", "contentHtml": "<p>Local exhaust ventilation controls airborne contaminants at or near the source. A fume hood is an engineered control whose performance depends on design, airflow, sash position, cross-drafts, obstructions, maintenance, and the task. It is not automatically suitable for every process simply because air is moving. High-hazard or unusual work may need competent ventilation or occupational-hygiene review.<\/p>", "contentText": "Local exhaust ventilation controls airborne contaminants at or near the source. A fume hood is an engineered control whose performance depends on design, airflow, sash position, cross-drafts, obstructions, maintenance, and the task. It is not automatically suitable for every process simply because air is moving. High-hazard or unusual work may need competent ventilation or occupational-hygiene review.", "treatment": "Awareness-level engineering-control example.", "visualDirection": "Original cross-section diagram showing source, capture direction, worker position, and cross-draft arrow. Do not reproduce a proprietary hood diagram.", "accessibility": "Descriptive alternative states that the contaminant source should be captured away from the worker and that cross-drafts/obstructions can reduce containment.", "objectives": ["LO3"], "sources": ["CCOHS-VENT", "CCOHS-HOODS"], "module": "T3", "moduleTitle": "Start with controls that act closest to the hazard", "visual": "V-12", "optional": false}, {"id": "T3-08", "kind": "content", "type": "process", "subtype": "change management", "title": "When the risk assessment must be revisited", "contentHtml": "<p>Alberta requires hazard assessment to be repeated at reasonably practicable intervals and when a new process is introduced, a process or operation changes, or significant additions or alterations are made to the work site. Good practice extends the same logic to changes such as a new material or concentration, scale-up, equipment or ventilation change, relocation, incident or near miss, new hazard information, recurring deviation, or significant competency/staffing change. The additional examples are <strong>good-practice synthesis<\/strong>, not extra words added to the statute.<\/p>", "contentText": "Alberta requires hazard assessment to be repeated at reasonably practicable intervals and when a new process is introduced, a process or operation changes, or significant additions or alterations are made to the work site. Good practice extends the same logic to changes such as a new material or concentration, scale-up, equipment or ventilation change, relocation, incident or near miss, new hazard information, recurring deviation, or significant competency/staffing change. The additional examples are good-practice synthesis, not extra words added to the statute.", "treatment": "Clearly separates legal triggers from synthesized additional triggers.", "visualDirection": "Original two-column list: “Explicit Alberta triggers” and “Good-practice triggers.”", "accessibility": "Text clearly labels both categories.", "objectives": ["LO3", "LO4"], "sources": ["AB-OHS-2 s.7(4)", "source dossier §13.2"], "module": "T3", "moduleTitle": "Start with controls that act closest to the hazard", "visual": "V-13", "optional": false}, {"id": "T3-09", "kind": "content", "type": "scenario", "subtype": "worked change example", "title": "Scale-up changes the risk picture", "contentHtml": "<p>A process previously used a small amount at room temperature. The proposed version uses a larger amount and heating. Even if the chemical and SDS are unchanged, the task has changed. Quantity, process energy, vapour generation, heat removal, equipment suitability, containment, and abnormal-condition consequences may all need review. The learner’s job at this level is to <strong>recognize the change and escalate for assessment<\/strong>, not to perform reactive-chemistry engineering.<\/p>", "contentText": "A process previously used a small amount at room temperature. The proposed version uses a larger amount and heating. Even if the chemical and SDS are unchanged, the task has changed. Quantity, process energy, vapour generation, heat removal, equipment suitability, containment, and abnormal-condition consequences may all need review. The learner’s job at this level is to recognize the change and escalate for assessment, not to perform reactive-chemistry engineering.", "treatment": "Safety-bounded scale-up example without reagents, temperatures, or operational detail.", "visualDirection": "Original before/after process schematic using generic vessels.", "accessibility": "Provide the before/after conditions in text.", "objectives": ["LO2", "LO3", "LO4"], "sources": ["AB-OHS-2 s.7(4)", "source dossier §§8.4, 13, 24"], "module": "T3", "moduleTitle": "Start with controls that act closest to the hazard", "visual": null, "optional": false}, {"id": "T3-10", "kind": "content", "type": "scenario", "subtype": "continuing case", "title": "Shared waste station: move the control upstream", "contentHtml": "<p>Suppose the waste review confirms that two incompatible streams can be confused because both use project shorthand and sit beside each other. A reminder to “double-check the bottle” is an administrative control. Higher-order options include redesigning the identification system, separating incompatible streams, or changing the workflow so a wrong connection is harder to make. Local technical review still determines the final design, but the hierarchy shows where to start.<\/p>", "contentText": "Suppose the waste review confirms that two incompatible streams can be confused because both use project shorthand and sit beside each other. A reminder to “double-check the bottle” is an administrative control. Higher-order options include redesigning the identification system, separating incompatible streams, or changing the workflow so a wrong connection is harder to make. Local technical review still determines the final design, but the hierarchy shows where to start.", "treatment": "Applies hierarchy without prescribing chemical-specific handling.", "visualDirection": "Original comparison of weak administrative reminder versus redesigned identification/separation.", "accessibility": "All options and the local-review qualification are in text.", "objectives": ["LO3", "LO6"], "sources": ["AB-OHS-2 s.9", "AB-OHS-29 s.396", "CCOHS-INVEST", "HC-CAPA"], "module": "T3", "moduleTitle": "Start with controls that act closest to the hazard", "visual": null, "optional": false}, {"id": "T3-11", "kind": "content", "type": "content", "subtype": "synthesis", "title": "Topic 3 synthesis", "contentHtml": "<p>Work down the hierarchy in order. First ask whether the hazard or task can be removed or substituted. If it remains, consider engineering controls before relying on procedures or PPE. Then check that storage is compatible, engineering controls are performing as intended, emergency provisions fit the hazard, and recent changes have not made the old assessment obsolete. When the decision needs specialist judgment, escalate it.<\/p>", "contentText": "Work down the hierarchy in order. First ask whether the hazard or task can be removed or substituted. If it remains, consider engineering controls before relying on procedures or PPE. Then check that storage is compatible, engineering controls are performing as intended, emergency provisions fit the hazard, and recent changes have not made the old assessment obsolete. When the decision needs specialist judgment, escalate it.", "treatment": "Condensed hierarchy and change review.", "visualDirection": "No visual required.", "accessibility": "Plain text.", "objectives": ["LO3", "LO4"], "sources": ["AB-OHS-2", "AB-OHS-4", "CCOHS-VENT", "CCOHS-HOODS"], "module": "T3", "moduleTitle": "Start with controls that act closest to the hazard", "visual": null, "optional": false}, {"id": "F3-01", "kind": "formative", "type": "formative self-assessment", "subtype": "sequencing", "title": "Knowledge check", "question": {"id": "F3-01", "itemType": "sequencing", "objectives": ["LO3"], "questionHtml": "<p>Place the control categories in the order they should be considered in the hierarchy used in this course.<\/p>", "questionText": "Place the control categories in the order they should be considered in the hierarchy used in this course.", "optionsRaw": "Elimination; Substitution; Engineering controls; Administrative controls; Personal protective equipment.", "correctRaw": "Elimination → Substitution → Engineering → Administrative → PPE.", "feedbackCorrectHtml": "<p>Alberta’s statutory wording specifically requires elimination/control and gives priority to engineering where reasonably practicable before administrative controls and PPE; the course uses the familiar five-level hierarchy to support that decision logic.<\/p>", "feedbackIncorrectHtml": "<p>If PPE or training is placed first, the sequence over-relies on behaviour-dependent controls before considering removal, substitution, or engineering.<\/p>", "sources": ["AB-OHS-2 s.9"], "graded": false, "difficulty": null, "accessibility": "Provide keyboard-operable numbered position selectors rather than drag-only sequencing.", "mode": "sequence", "items": ["Elimination", "Substitution", "Engineering controls", "Administrative controls", "Personal protective equipment"], "correctSequence": ["Elimination", "Substitution", "Engineering controls", "Administrative controls", "Personal protective equipment"]}, "objectives": ["LO3"], "sources": ["AB-OHS-2 s.9"], "module": "T3", "moduleTitle": "Start with controls that act closest to the hazard", "visual": null, "optional": false}, {"id": "F3-02", "kind": "formative", "type": "formative self-assessment", "subtype": "scenario multiple choice", "title": "Knowledge check", "question": {"id": "F3-02", "itemType": "scenario multiple choice", "objectives": ["LO3"], "questionHtml": "<p>A recurring splash occurs during an unnecessary open manual transfer. Which response best follows the hierarchy?<\/p>", "questionText": "A recurring splash occurs during an unnecessary open manual transfer. Which response best follows the hierarchy?", "optionsRaw": "A. Add a poster reminding workers to be careful.<br>B. First examine whether the transfer can be eliminated, substituted, enclosed, or redesigned; then add administrative controls and PPE as needed.<br>C. Retrain every worker before investigating the task.<br>D. Add thicker gloves and leave the process unchanged.", "correctRaw": "B", "feedbackCorrectHtml": "<p>The hierarchy directs attention to removing or engineering the hazard before relying mainly on reminders, retraining, or PPE.<\/p>", "feedbackIncorrectHtml": "<p>A: Administrative reminder only.<br>C: Training may be needed, but it should not replace investigation and higher-order controls.<br>D: PPE may be needed but does not address the open-transfer source.<\/p>", "sources": ["AB-OHS-2 s.9", "CCOHS-INVEST", "HC-CAPA"], "graded": false, "difficulty": null, "accessibility": "Single-select list.", "mode": "single", "options": [{"key": "A", "text": "Add a poster reminding workers to be careful."}, {"key": "B", "text": "First examine whether the transfer can be eliminated, substituted, enclosed, or redesigned; then add administrative controls and PPE as needed."}, {"key": "C", "text": "Retrain every worker before investigating the task."}, {"key": "D", "text": "Add thicker gloves and leave the process unchanged."}], "correctKey": "B"}, "objectives": ["LO3"], "sources": ["AB-OHS-2 s.9", "CCOHS-INVEST", "HC-CAPA"], "module": "T3", "moduleTitle": "Start with controls that act closest to the hazard", "visual": null, "optional": false}, {"id": "F3-03", "kind": "formative", "type": "formative self-assessment", "subtype": "multiple response", "title": "Knowledge check", "question": {"id": "F3-03", "itemType": "multiple response", "objectives": ["LO3", "LO4"], "questionHtml": "<p>Which changes should prompt review of the existing risk assessment? Select all that are explicitly listed in Alberta s.7(4) or identified as good-practice review triggers in the research dossier.<\/p>", "questionText": "Which changes should prompt review of the existing risk assessment? Select all that are explicitly listed in Alberta s.7(4) or identified as good-practice review triggers in the research dossier.", "optionsRaw": "A. A new process is introduced.<br>B. The operation changes.<br>C. Significant work-site alteration occurs.<br>D. The process is scaled up.<br>E. An incident reveals the control may not work as assumed.", "correctRaw": "A, B, C, D, and E. A–C are explicit Alberta triggers; D–E are good-practice synthesis consistent with the dossier.", "feedbackCorrectHtml": "<p>The distinction matters: A–C are explicit legal triggers in the cited section; D–E are additional good-practice triggers and must not be misquoted as statutory wording.<\/p>", "feedbackIncorrectHtml": "<p>Any omitted answer misses a valid review trigger from either the statute or the clearly labelled synthesis. If a learner treats D/E as statutory wording, feedback should correct the source status.<\/p>", "sources": ["AB-OHS-2 s.7(4)", "source dossier §13.2"], "graded": false, "difficulty": null, "accessibility": "Checkboxes with source-status feedback for each selected option.", "mode": "multi", "options": [{"key": "A", "text": "A new process is introduced."}, {"key": "B", "text": "The operation changes."}, {"key": "C", "text": "Significant work-site alteration occurs."}, {"key": "D", "text": "The process is scaled up."}, {"key": "E", "text": "An incident reveals the control may not work as assumed."}], "correctKeys": ["A", "B", "C", "D", "E"]}, "objectives": ["LO3", "LO4"], "sources": ["AB-OHS-2 s.7(4)", "source dossier §13.2"], "module": "T3", "moduleTitle": "Start with controls that act closest to the hazard", "visual": null, "optional": false}, {"id": "F3-04", "kind": "formative", "type": "formative self-assessment", "subtype": "scenario judgment", "title": "Knowledge check", "question": {"id": "F3-04", "itemType": "scenario judgment", "objectives": ["LO3"], "questionHtml": "<p>A worker says, “This hood has an exhaust fan, so it will control any chemical task.” What is the best response?<\/p>", "questionText": "A worker says, “This hood has an exhaust fan, so it will control any chemical task.” What is the best response?", "optionsRaw": "A. Correct; any exhaust automatically provides adequate containment.<br>B. Not necessarily. Hood effectiveness depends on design, airflow, cross-drafts, obstructions, maintenance, and the actual task; unusual or high-hazard work may need competent review.<br>C. Correct if the sash is fully open.<br>D. Incorrect because local exhaust is never an engineering control.", "correctRaw": "B", "feedbackCorrectHtml": "<p>Local exhaust is an engineering control, but performance is task- and design-dependent and should not be assumed from the presence of a fan.<\/p>", "feedbackIncorrectHtml": "<p>A: Assumes performance without evidence.<br>C: The scenario provides no basis for a universal sash rule.<br>D: Local exhaust is a recognized engineering-control concept.<\/p>", "sources": ["CCOHS-VENT", "CCOHS-HOODS"], "graded": false, "difficulty": null, "accessibility": "Single-select list with text-only feedback.", "mode": "single", "options": [{"key": "A", "text": "Correct; any exhaust automatically provides adequate containment."}, {"key": "B", "text": "Not necessarily. Hood effectiveness depends on design, airflow, cross-drafts, obstructions, maintenance, and the actual task; unusual or high-hazard work may need competent review."}, {"key": "C", "text": "Correct if the sash is fully open."}, {"key": "D", "text": "Incorrect because local exhaust is never an engineering control."}], "correctKey": "B"}, "objectives": ["LO3"], "sources": ["CCOHS-VENT", "CCOHS-HOODS"], "module": "T3", "moduleTitle": "Start with controls that act closest to the hazard", "visual": null, "optional": false}, {"id": "T4-01", "kind": "content", "type": "topic title", "subtype": "relevance", "title": "Deal with the emergency first", "contentHtml": "<p>When a spill, exposure, equipment failure, injury, or uncontrolled reaction occurs, start with the immediate hazard. Protect people, warn others, activate the local emergency process, obtain appropriate first aid or emergency assistance, and prevent further escalation. Root-cause work comes later, after the immediate danger is controlled and within the learner’s training and authority.<\/p>", "contentText": "When a spill, exposure, equipment failure, injury, or uncontrolled reaction occurs, start with the immediate hazard. Protect people, warn others, activate the local emergency process, obtain appropriate first aid or emergency assistance, and prevent further escalation. Root-cause work comes later, after the immediate danger is controlled and within the learner’s training and authority.", "treatment": "Creates the response/investigation boundary.", "visualDirection": "Original two-phase timeline: Emergency control → Investigation and learning.", "accessibility": "The two phases and priorities are fully written in text.", "objectives": ["LO4"], "sources": ["AB-OHS-7", "AB-OHS-ACT-33", "source dossier §14"], "module": "T4", "moduleTitle": "Deal with the emergency first", "visual": "V-14", "optional": false}, {"id": "T4-02", "kind": "content", "type": "content", "subtype": "emergency planning", "title": "Alberta emergency-response planning", "contentHtml": "<p>Alberta OHS Code Part 7 requires an emergency response plan where an emergency may require rescue or evacuation. The plan must address potential emergencies, response procedures, emergency equipment and PPE, training, emergency facilities, fire protection, alarms/communication, first aid, and rescue or evacuation arrangements. Designated rescue or evacuation workers require appropriate training and exercises. The learner’s responsibility is to know and use the organization’s plan, not invent an emergency procedure during the event.<\/p>", "contentText": "Alberta OHS Code Part 7 requires an emergency response plan where an emergency may require rescue or evacuation. The plan must address potential emergencies, response procedures, emergency equipment and PPE, training, emergency facilities, fire protection, alarms/communication, first aid, and rescue or evacuation arrangements. Designated rescue or evacuation workers require appropriate training and exercises. The learner’s responsibility is to know and use the organization’s plan, not invent an emergency procedure during the event.", "treatment": "Legal awareness without operationalizing emergency techniques.", "visualDirection": "Original emergency-plan component diagram with text labels.", "accessibility": "Provide the listed components as text. No animation-only sequence.", "objectives": ["LO4"], "sources": ["AB-OHS-7 ss.115–118"], "module": "T4", "moduleTitle": "Deal with the emergency first", "visual": null, "optional": false}, {"id": "T4-03", "kind": "content", "type": "content", "subtype": "safety boundary", "title": "Why this course gives no universal spill threshold", "contentHtml": "<p>A fixed volume alone cannot tell you whether a spill is safe for a worker to clean. The correct response depends on toxicity, volatility, flammability, reactivity, concentration, physical state, location, ventilation, drainage, quantity, responder competency, PPE, and available emergency resources. Follow the SDS, the institution’s spill/emergency procedure, and trained local responders. If the situation exceeds your training or authority, withdraw and escalate.<\/p>", "contentText": "A fixed volume alone cannot tell you whether a spill is safe for a worker to clean. The correct response depends on toxicity, volatility, flammability, reactivity, concentration, physical state, location, ventilation, drainage, quantity, responder competency, PPE, and available emergency resources. Follow the SDS, the institution’s spill/emergency procedure, and trained local responders. If the situation exceeds your training or authority, withdraw and escalate.", "treatment": "Explicitly preserves the dossier’s safety exclusion.", "visualDirection": "No visual required.", "accessibility": "Plain text.", "objectives": ["LO4"], "sources": ["CCOHS-SDS", "AB-OHS-7", "source dossier §14.2"], "module": "T4", "moduleTitle": "Deal with the emergency first", "visual": null, "optional": false}, {"id": "T4-04", "kind": "content", "type": "content", "subtype": "legal awareness", "title": "Serious events in Alberta: recognize and escalate", "contentHtml": "<p>Alberta OHS Act s.33 requires specified serious injuries, illnesses, and incidents to be reported to a Director as soon as possible. The listed categories include death, certain hospital admissions beyond emergency-room or urgent-care treatment, and specified uncontrolled explosions, fires, floods, structural events, and lifting incidents. Learners should recognize that these events require immediate organizational escalation. The employer or responsible authority determines and carries out the formal reporting process.<\/p>", "contentText": "Alberta OHS Act s.33 requires specified serious injuries, illnesses, and incidents to be reported to a Director as soon as possible. The listed categories include death, certain hospital admissions beyond emergency-room or urgent-care treatment, and specified uncontrolled explosions, fires, floods, structural events, and lifting incidents. Learners should recognize that these events require immediate organizational escalation. The employer or responsible authority determines and carries out the formal reporting process.", "treatment": "Keeps reporting awareness without turning learners into legal decision-makers.", "visualDirection": "Original “Recognize → Escalate → Responsible authority confirms/report” process.", "accessibility": "Text is complete alternative.", "objectives": ["LO4"], "sources": ["AB-OHS-ACT-33(1)–(4)"], "module": "T4", "moduleTitle": "Deal with the emergency first", "visual": null, "optional": false}, {"id": "T4-05", "kind": "content", "type": "content", "subtype": "near miss", "title": "No injury can still mean a required investigation", "contentHtml": "<p>Alberta s.33(5) also requires investigation when an incident had a likelihood of causing serious injury or illness and there is reasonable cause to believe corrective action may be needed to prevent recurrence. This is why a high-potential near miss matters. An internal label such as “minor,” “near miss,” or “no injury” does not decide the statutory duty. The facts do.<\/p>", "contentText": "Alberta s.33(5) also requires investigation when an incident had a likelihood of causing serious injury or illness and there is reasonable cause to believe corrective action may be needed to prevent recurrence. This is why a high-potential near miss matters. An internal label such as “minor,” “near miss,” or “no injury” does not decide the statutory duty. The facts do.", "treatment": "High-value misconception correction.", "visualDirection": "Original branch: Injury? If no → still ask high-potential / corrective-action test.", "accessibility": "Text states the full principle.", "objectives": ["LO4"], "sources": ["AB-OHS-ACT-33(5)"], "module": "T4", "moduleTitle": "Deal with the emergency first", "visual": null, "optional": false}, {"id": "T4-06", "kind": "content", "type": "content", "subtype": "scene preservation", "title": "Preserve the scene after safety", "contentHtml": "<p>For events that must be reported under Alberta s.33(1), the scene and related equipment, documents, and information must not be disturbed except as necessary to attend to injured, ill, or deceased persons; prevent further injury, illness, or incidents; protect endangered property; or as otherwise directed by an authorized official. Safety comes first. Once those immediate needs are addressed, avoid “cleaning up” evidence that may be needed for the investigation.<\/p>", "contentText": "For events that must be reported under Alberta s.33(1), the scene and related equipment, documents, and information must not be disturbed except as necessary to attend to injured, ill, or deceased persons; prevent further injury, illness, or incidents; protect endangered property; or as otherwise directed by an authorized official. Safety comes first. Once those immediate needs are addressed, avoid “cleaning up” evidence that may be needed for the investigation.", "treatment": "Plain-language scene-preservation rule with statutory exceptions.", "visualDirection": "Original priority diagram: Care/protect → Stabilize → Preserve.", "accessibility": "Ordered text mirrors the priority.", "objectives": ["LO4", "LO5"], "sources": ["AB-OHS-ACT-33(9)"], "module": "T4", "moduleTitle": "Deal with the emergency first", "visual": null, "optional": false}, {"id": "T4-07", "kind": "content", "type": "content", "subtype": "report record", "title": "Investigation reports are part of the legal record", "contentHtml": "<p>For events captured by Alberta s.33(6), the employer or prime contractor must investigate the circumstances and prepare a report that describes what happened and the corrective action, if any. The section also includes availability, distribution, and retention requirements, including retention for at least two years. Exact responsibilities belong to the organization’s responsible function, but people supporting an investigation should understand that the record may have legal significance.<\/p>", "contentText": "For events captured by Alberta s.33(6), the employer or prime contractor must investigate the circumstances and prepare a report that describes what happened and the corrective action, if any. The section also includes availability, distribution, and retention requirements, including retention for at least two years. Exact responsibilities belong to the organization’s responsible function, but people supporting an investigation should understand that the record may have legal significance.", "treatment": "Optional technical depth; exact distribution details can sit behind expansion.", "visualDirection": "No visual required.", "accessibility": "Plain text.", "objectives": ["Enrichment / LO4"], "sources": ["AB-OHS-ACT-33(6)–(7)"], "module": "T4", "moduleTitle": "Deal with the emergency first", "visual": null, "optional": false}, {"id": "T4-08", "kind": "content", "type": "scenario", "subtype": "continuing case", "title": "The waste near miss occurs", "contentHtml": "<p>At the shared waste station, a worker begins a disposal step and notices unexpected heat. The worker stops before making a larger addition. No one is injured.<br><br>At this moment, ask first: <strong>Is there still an active hazard, and what does the local emergency procedure require?<\/strong> Questions about how the event happened come after the situation is stable. Once the situation is stable, the organization must determine the appropriate investigation and reporting path. Because the event had credible potential for a serious reaction, it should not be dismissed simply because no one was hurt.<\/p>", "contentText": "At the shared waste station, a worker begins a disposal step and notices unexpected heat. The worker stops before making a larger addition. No one is injured. At this moment, ask first: Is there still an active hazard, and what does the local emergency procedure require? Questions about how the event happened come after the situation is stable. Once the situation is stable, the organization must determine the appropriate investigation and reporting path. Because the event had credible potential for a serious reaction, it should not be dismissed simply because no one was hurt.", "treatment": "Continues recurring case. No chemistry details or reaction instructions.", "visualDirection": "Original event timeline with “stop / stabilize / escalate / investigate” labels.", "accessibility": "Full scenario and sequence in text.", "objectives": ["LO4", "LO5"], "sources": ["AB-OHS-7", "AB-OHS-ACT-33(5)", "AB-OHS-29 s.396"], "module": "T4", "moduleTitle": "Deal with the emergency first", "visual": null, "optional": false}, {"id": "T4-09", "kind": "content", "type": "content", "subtype": "synthesis", "title": "Topic 4 synthesis", "contentHtml": "<p>When something goes wrong, use this order: <strong>protect people → activate the local response → prevent escalation → report or escalate → preserve the scene and information when safe → investigate.<\/strong> Evidence collection never comes before necessary care. An event can also deserve investigation even when no one was hurt.<\/p>", "contentText": "When something goes wrong, use this order: protect people → activate the local response → prevent escalation → report or escalate → preserve the scene and information when safe → investigate. Evidence collection never comes before necessary care. An event can also deserve investigation even when no one was hurt.", "treatment": "Short retrieval summary.", "visualDirection": "No visual needed.", "accessibility": "Plain text.", "objectives": ["LO4"], "sources": ["AB-OHS-7", "AB-OHS-ACT-33"], "module": "T4", "moduleTitle": "Deal with the emergency first", "visual": "V-14", "optional": false}, {"id": "F4-01", "kind": "formative", "type": "formative self-assessment", "subtype": "sequencing", "title": "Knowledge check", "question": {"id": "F4-01", "itemType": "sequencing", "objectives": ["LO4"], "questionHtml": "<p>A chemical event has just occurred. Put the high-level actions in the best order for this course.<\/p>", "questionText": "A chemical event has just occurred. Put the high-level actions in the best order for this course.", "optionsRaw": "Preserve evidence; Protect people; Activate local emergency response; Prevent escalation; Begin investigation when safe.", "correctRaw": "Protect people → Activate local emergency response → Prevent escalation → Preserve evidence when safe → Begin investigation.", "feedbackCorrectHtml": "<p>Emergency control and care take priority. Evidence preservation matters after immediate safety needs are addressed.<\/p>", "feedbackIncorrectHtml": "<p>If preservation or investigation is placed before care, the sequence incorrectly prioritizes learning over life safety.<\/p>", "sources": ["AB-OHS-7", "AB-OHS-ACT-33(9)", "source dossier §14"], "graded": false, "difficulty": null, "accessibility": "Use keyboard-operable numbered position selectors.", "mode": "sequence", "items": ["Preserve evidence", "Protect people", "Activate local emergency response", "Prevent escalation", "Begin investigation when safe"], "correctSequence": ["Protect people", "Activate local emergency response", "Prevent escalation", "Preserve evidence", "Begin investigation when safe"]}, "objectives": ["LO4"], "sources": ["AB-OHS-7", "AB-OHS-ACT-33(9)", "source dossier §14"], "module": "T4", "moduleTitle": "Deal with the emergency first", "visual": null, "optional": false}, {"id": "F4-02", "kind": "formative", "type": "formative self-assessment", "subtype": "scenario multiple choice", "title": "Knowledge check", "question": {"id": "F4-02", "itemType": "scenario multiple choice", "objectives": ["LO4"], "questionHtml": "<p>A laboratory event causes no injury, but an uncontrolled condition could credibly have caused serious illness. Which statement is most accurate?<\/p>", "questionText": "A laboratory event causes no injury, but an uncontrolled condition could credibly have caused serious illness. Which statement is most accurate?", "optionsRaw": "A. No injury means no investigation duty can exist.<br>B. Alberta s.33(5) can require investigation of an incident that had a likelihood of causing serious injury or illness when corrective action may be needed.<br>C. Only incidents with property damage matter.<br>D. The worker should decide alone whether the regulator must be contacted.", "correctRaw": "B", "feedbackCorrectHtml": "<p>Alberta’s high-potential incident provision is not limited to events that actually caused serious harm.<\/p>", "feedbackIncorrectHtml": "<p>A: Directly conflicts with s.33(5).<br>C: Property damage is not the deciding test stated here.<br>D: Learners should escalate through the responsible organizational process instead of making unsupported legal determinations alone.<\/p>", "sources": ["AB-OHS-ACT-33(5)"], "graded": false, "difficulty": null, "accessibility": "Single-select list.", "mode": "single", "options": [{"key": "A", "text": "No injury means no investigation duty can exist."}, {"key": "B", "text": "Alberta s.33(5) can require investigation of an incident that had a likelihood of causing serious injury or illness when corrective action may be needed."}, {"key": "C", "text": "Only incidents with property damage matter."}, {"key": "D", "text": "The worker should decide alone whether the regulator must be contacted."}], "correctKey": "B"}, "objectives": ["LO4"], "sources": ["AB-OHS-ACT-33(5)"], "module": "T4", "moduleTitle": "Deal with the emergency first", "visual": null, "optional": false}, {"id": "F4-03", "kind": "formative", "type": "formative self-assessment", "subtype": "scenario judgment", "title": "Knowledge check", "question": {"id": "F4-03", "itemType": "scenario judgment", "objectives": ["LO4", "LO5"], "questionHtml": "<p>After a reportable event, the equipment position may help the investigation, but an injured worker still needs immediate assistance. What takes priority?<\/p>", "questionText": "After a reportable event, the equipment position may help the investigation, but an injured worker still needs immediate assistance. What takes priority?", "optionsRaw": "A. Photograph the equipment before anyone moves.<br>B. Attend to the injured worker; Alberta’s scene-preservation rule expressly allows necessary disturbance for care and prevention of further harm.<br>C. Leave the worker in place until an investigator arrives.<br>D. Restart the equipment to reproduce the event.", "correctRaw": "B", "feedbackCorrectHtml": "<p>Scene preservation does not override immediate care or prevention of further harm; those are explicit exceptions in s.33(9).<\/p>", "feedbackIncorrectHtml": "<p>A: Evidence collection must not delay required care.<br>C: Unsafe and contrary to the statutory exception.<br>D: Reproducing the event can create additional risk and is not supported here.<\/p>", "sources": ["AB-OHS-ACT-33(9)"], "graded": false, "difficulty": null, "accessibility": "Single-select list; no timed response.", "mode": "single", "options": [{"key": "A", "text": "Photograph the equipment before anyone moves."}, {"key": "B", "text": "Attend to the injured worker; Alberta’s scene-preservation rule expressly allows necessary disturbance for care and prevention of further harm."}, {"key": "C", "text": "Leave the worker in place until an investigator arrives."}, {"key": "D", "text": "Restart the equipment to reproduce the event."}], "correctKey": "B"}, "objectives": ["LO4", "LO5"], "sources": ["AB-OHS-ACT-33(9)"], "module": "T4", "moduleTitle": "Deal with the emergency first", "visual": null, "optional": false}, {"id": "T5-01", "kind": "content", "type": "topic title", "subtype": "relevance", "title": "What happened, and what conditions made it possible?", "contentHtml": "<p>An investigation should first establish what happened, then work out which conditions made the event possible and what could prevent it from happening again. CCOHS recommends examining task, material, environment, personnel, and management factors. A conclusion such as “carelessness” can hide system problems that are still correctable.<\/p>", "contentText": "An investigation should first establish what happened, then work out which conditions made the event possible and what could prevent it from happening again. CCOHS recommends examining task, material, environment, personnel, and management factors. A conclusion such as “carelessness” can hide system problems that are still correctable.", "treatment": "Introduces systems thinking before the investigation methods.", "visualDirection": "Original “event → conditions → causes → controls” diagram.", "accessibility": "Text contains full purpose statement.", "objectives": ["LO5"], "sources": ["CCOHS-INVEST"], "module": "T5", "moduleTitle": "What happened, and what conditions made it possible?", "visual": null, "optional": false}, {"id": "T5-02", "kind": "content", "type": "comparison", "subtype": "evidence categories", "title": "Four kinds of evidence", "contentHtml": "<p><strong>Physical evidence:<\/strong> damaged equipment, containers, components, residue, PPE, or other relevant items.<br><br><strong>Documentary evidence:<\/strong> procedures, risk assessments, SDSs, inventory, training, maintenance, calibration, inspections, purchasing, and prior incident records.<br><br><strong>Electronic/system evidence:<\/strong> alarms, instrument logs, audit trails, access records, building-system data, and version history where relevant and authorized.<br><br><strong>Witness evidence:<\/strong> what people directly observed, did, heard, or understood.<br><br>Record the facts first. Test explanations against them later.<\/p>", "contentText": "Physical evidence: damaged equipment, containers, components, residue, PPE, or other relevant items. Documentary evidence: procedures, risk assessments, SDSs, inventory, training, maintenance, calibration, inspections, purchasing, and prior incident records. Electronic/system evidence: alarms, instrument logs, audit trails, access records, building-system data, and version history where relevant and authorized. Witness evidence: what people directly observed, did, heard, or understood. Record the facts first. Test explanations against them later.", "treatment": "Four-category evidence map.", "visualDirection": "Original four-quadrant evidence diagram.", "accessibility": "Each quadrant’s text appears in the content.", "objectives": ["LO5"], "sources": ["CCOHS-INVEST", "source dossier §16"], "module": "T5", "moduleTitle": "What happened, and what conditions made it possible?", "visual": "V-15", "optional": false}, {"id": "T5-03", "kind": "content", "type": "content", "subtype": "evidence quality", "title": "Observation is not the same as interpretation", "contentHtml": "<p>A witness might say, “The valve failed.” That could mean: “I saw the pressure change and then saw liquid at the valve,” or it could be the witness’s explanation for an event they did not directly observe. Good investigation records separate <strong>what was observed<\/strong> from <strong>what is inferred<\/strong>. The same rule applies to documents and system data: establish what the record shows before claiming what caused it.<\/p>", "contentText": "A witness might say, “The valve failed.” That could mean: “I saw the pressure change and then saw liquid at the valve,” or it could be the witness’s explanation for an event they did not directly observe. Good investigation records separate what was observed from what is inferred. The same rule applies to documents and system data: establish what the record shows before claiming what caused it.", "treatment": "Introduces evidence-versus-inference discipline.", "visualDirection": "No visual required. Optional two-column Observation / Interpretation example.", "accessibility": "Text provides both examples.", "objectives": ["LO5"], "sources": ["CCOHS-INVEST", "source dossier §16.4"], "module": "T5", "moduleTitle": "What happened, and what conditions made it possible?", "visual": null, "optional": false}, {"id": "T5-04", "kind": "content", "type": "content", "subtype": "interview practice", "title": "Use interviews to reconstruct the event", "contentHtml": "<p>Start with open questions and ask the witness to describe the sequence in their own words. Then compare what normally happens with what happened that day. Ask about the equipment and information available, interruptions, workload, and whether the written procedure matched the real work. Keep the wording neutral. Immediate medical and psychological needs come first, and uncertainty in memory is not, by itself, evidence of dishonesty.<\/p>", "contentText": "Start with open questions and ask the witness to describe the sequence in their own words. Then compare what normally happens with what happened that day. Ask about the equipment and information available, interruptions, workload, and whether the written procedure matched the real work. Keep the wording neutral. Immediate medical and psychological needs come first, and uncertainty in memory is not, by itself, evidence of dishonesty.", "treatment": "Awareness-level interviewing principles; does not certify investigators.", "visualDirection": "Original question-flow card: Open account → Clarify sequence → Compare normal/event → Check conditions → Confirm summary.", "accessibility": "All question categories listed in text.", "objectives": ["LO5"], "sources": ["CCOHS-INVEST", "source dossier §§16.4–16.5"], "module": "T5", "moduleTitle": "What happened, and what conditions made it possible?", "visual": null, "optional": false}, {"id": "T5-05", "kind": "content", "type": "process", "subtype": "method", "title": "Timeline analysis", "contentHtml": "<p>A timeline puts the event in order: the normal starting state, what changed, actions taken, alarms or warnings, control response, escalation, emergency response, and recovery. This can reveal timing and dependencies that are easy to miss in separate interviews or records. A timeline shows sequence, though; it does not prove what caused the event.<\/p>", "contentText": "A timeline puts the event in order: the normal starting state, what changed, actions taken, alarms or warnings, control response, escalation, emergency response, and recovery. This can reveal timing and dependencies that are easy to miss in separate interviews or records. A timeline shows sequence, though; it does not prove what caused the event.", "treatment": "Method block with strength and limitation.", "visualDirection": "Original horizontal event timeline using generic labels.", "accessibility": "Provide the event sequence as an ordered list.", "objectives": ["LO5"], "sources": ["CCOHS-INVEST", "source dossier §17.1"], "module": "T5", "moduleTitle": "What happened, and what conditions made it possible?", "visual": null, "optional": false}, {"id": "T5-06", "kind": "content", "type": "comparison", "subtype": "method", "title": "5 Whys: useful, but easy to overuse", "contentHtml": "<p>The <strong>5 Whys<\/strong> can push an investigation beyond the immediate event by repeatedly asking why a condition existed. It is quick and accessible, but it can create a false single chain, depend heavily on the investigator’s assumptions, and stop wherever the investigator chooses. Use it as a questioning aid, not as proof that one “root cause” has been discovered.<\/p>", "contentText": "The 5 Whys can push an investigation beyond the immediate event by repeatedly asking why a condition existed. It is quick and accessible, but it can create a false single chain, depend heavily on the investigator’s assumptions, and stop wherever the investigator chooses. Use it as a questioning aid, not as proof that one “root cause” has been discovered.", "treatment": "Explicit limitation prevents overclaiming.", "visualDirection": "Original short chain diagram with side note “other branches may exist.”", "accessibility": "Text carries full meaning.", "objectives": ["LO5"], "sources": ["CCOHS-INVEST", "source dossier §17.2"], "module": "T5", "moduleTitle": "What happened, and what conditions made it possible?", "visual": null, "optional": false}, {"id": "T5-07", "kind": "content", "type": "comparison", "subtype": "methods", "title": "Barrier analysis and change analysis", "contentHtml": "<p><strong>Barrier analysis<\/strong> asks what should have prevented, detected, mitigated, or helped recover from the event; whether those barriers existed; and why they failed or were missing.<br><br><strong>Change analysis<\/strong> compares the incident with the normal or previously safe condition: what changed in material, supplier, concentration, equipment, software, staff, procedure, workload, room, ventilation, maintenance, sequence, or waste route?<br><br>Both methods keep attention on the system, but the resulting hypotheses still require evidence.<\/p>", "contentText": "Barrier analysis asks what should have prevented, detected, mitigated, or helped recover from the event; whether those barriers existed; and why they failed or were missing. Change analysis compares the incident with the normal or previously safe condition: what changed in material, supplier, concentration, equipment, software, staff, procedure, workload, room, ventilation, maintenance, sequence, or waste route? Both methods keep attention on the system, but the resulting hypotheses still require evidence.", "treatment": "Repeated what/how/strength/limitation pattern.", "visualDirection": "Original side-by-side Barrier / Change method cards.", "accessibility": "All comparison content in text.", "objectives": ["LO5"], "sources": ["CCOHS-INVEST", "source dossier §§17.4–17.5"], "module": "T5", "moduleTitle": "What happened, and what conditions made it possible?", "visual": null, "optional": false}, {"id": "T5-08", "kind": "content", "type": "content", "subtype": "optional method depth", "title": "Fishbone and fault-tree analysis", "contentHtml": "<p>A <strong>fishbone (Ishikawa) diagram<\/strong> can broaden brainstorming across categories such as people, equipment, method, material, environment, and management. Its limitation is that a diagram full of possible causes is not evidence. <strong>Fault-tree analysis<\/strong> starts from a top event and maps logical combinations of failures. It can be valuable for complex engineering events but is more resource-intensive and can miss organizational conditions if scoped too narrowly. These are optional methods at this course level.<\/p>", "contentText": "A fishbone (Ishikawa) diagram can broaden brainstorming across categories such as people, equipment, method, material, environment, and management. Its limitation is that a diagram full of possible causes is not evidence. Fault-tree analysis starts from a top event and maps logical combinations of failures. It can be valuable for complex engineering events but is more resource-intensive and can miss organizational conditions if scoped too narrowly. These are optional methods at this course level.", "treatment": "Optional enrichment; no graded detailed method selection.", "visualDirection": "Original simplified method illustrations only; do not reproduce protected figures.", "accessibility": "Text definitions and limitations suffice.", "objectives": ["Enrichment / LO5"], "sources": ["CCOHS-INVEST", "source dossier §§17.3, 17.6"], "module": "T5", "moduleTitle": "What happened, and what conditions made it possible?", "visual": null, "optional": true}, {"id": "T5-09", "kind": "content", "type": "process", "subtype": "systems checklist", "title": "If you see “worker error,” ask these questions next", "contentHtml": "<p>Examine the system around the action:<br><br>- <strong>Task:<\/strong> Was the work realistically executable as written?<br>- <strong>Equipment:<\/strong> Was the correct equipment available, maintained, and designed to resist error?<br>- <strong>Materials:<\/strong> Correct identity, concentration, container, and compatibility?<br>- <strong>Environment:<\/strong> Lighting, congestion, ventilation, interruption, workspace?<br>- <strong>Workload:<\/strong> Fatigue, staffing, time pressure, competing priorities?<br>- <strong>Training/competence:<\/strong> Was competence demonstrated for this task?<br>- <strong>Supervision:<\/strong> Were deviations detected or tolerated?<br>- <strong>Procurement/maintenance:<\/strong> Did substitutions or degraded equipment matter?<br>- <strong>Management system:<\/strong> Were earlier warnings and actions closed effectively?<\/p>", "contentText": "Examine the system around the action: - Task: Was the work realistically executable as written? - Equipment: Was the correct equipment available, maintained, and designed to resist error? - Materials: Correct identity, concentration, container, and compatibility? - Environment: Lighting, congestion, ventilation, interruption, workspace? - Workload: Fatigue, staffing, time pressure, competing priorities? - Training/competence: Was competence demonstrated for this task? - Supervision: Were deviations detected or tolerated? - Procurement/maintenance: Did substitutions or degraded equipment matter? - Management system: Were earlier warnings and actions closed effectively?", "treatment": "Provides a checklist for looking beyond the individual action.", "visualDirection": "Original nine-factor wheel with labelled sectors.", "accessibility": "Full bullet list is the accessible alternative.", "objectives": ["LO5"], "sources": ["CCOHS-INVEST", "source dossier §18"], "module": "T5", "moduleTitle": "What happened, and what conditions made it possible?", "visual": "V-16", "optional": false}, {"id": "T5-10", "kind": "content", "type": "scenario", "subtype": "continuing case", "title": "Waste near miss: facts before causes", "contentHtml": "<p>The investigation establishes these facts: project shorthand was used on two waste containers; the containers were stored next to each other; the changed process produced a different waste stream; the worker stopped after noticing unexpected heat; and a previous inspection had noted unclear waste identification.<br><br>A statement such as “the worker selected the wrong bottle” may describe an action, but it does not explain why the system made the error credible. Investigators should examine identification design, physical segregation, change review, training, prior findings, and waste workflow before deciding which causal factors are supported.<\/p>", "contentText": "The investigation establishes these facts: project shorthand was used on two waste containers; the containers were stored next to each other; the changed process produced a different waste stream; the worker stopped after noticing unexpected heat; and a previous inspection had noted unclear waste identification. A statement such as “the worker selected the wrong bottle” may describe an action, but it does not explain why the system made the error credible. Investigators should examine identification design, physical segregation, change review, training, prior findings, and waste workflow before deciding which causal factors are supported.", "treatment": "Uses known evidence to model fact/cause separation.", "visualDirection": "Original evidence board with five facts and five investigation questions.", "accessibility": "All facts/questions written in text.", "objectives": ["LO5"], "sources": ["AB-OHS-29 s.396", "CCOHS-INVEST", "source dossier §23"], "module": "T5", "moduleTitle": "What happened, and what conditions made it possible?", "visual": null, "optional": false}, {"id": "T5-11", "kind": "content", "type": "example", "subtype": "worked analysis", "title": "From blame statement to investigation question", "contentHtml": "<p><strong>Blame statement:<\/strong> “The worker was careless.”<br><br><strong>Better questions:<\/strong> Was the waste stream clearly and uniquely identified? Were incompatible streams separated? Did the updated process trigger review of the waste system? Did the procedure match the real workflow? Had the previous inspection finding been corrected? Did the worker have the information needed at the point of disposal?<br><br>These questions do not assume the worker had no responsibility. They make the investigation capable of finding controls beyond individual vigilance.<\/p>", "contentText": "Blame statement: “The worker was careless.” Better questions: Was the waste stream clearly and uniquely identified? Were incompatible streams separated? Did the updated process trigger review of the waste system? Did the procedure match the real workflow? Had the previous inspection finding been corrected? Did the worker have the information needed at the point of disposal? These questions do not assume the worker had no responsibility. They make the investigation capable of finding controls beyond individual vigilance.", "treatment": "Concrete conversion from blame to system questions.", "visualDirection": "No visual required.", "accessibility": "Plain text.", "objectives": ["LO5"], "sources": ["CCOHS-INVEST", "AB-OHS-2 s.7", "AB-OHS-29 s.396"], "module": "T5", "moduleTitle": "What happened, and what conditions made it possible?", "visual": null, "optional": false}, {"id": "T5-12", "kind": "content", "type": "content", "subtype": "synthesis", "title": "Topic 5 synthesis", "contentHtml": "<p>A credible investigation separates <strong>facts, interpretations, hypotheses, contributing factors, and supported causes<\/strong>. Methods such as timelines, 5 Whys, barrier analysis, and change analysis organize the inquiry; they do not create evidence. If the conclusion is only “worker error,” keep looking at task design, equipment, materials, environment, workload, supervision, maintenance, procurement, and management systems.<\/p>", "contentText": "A credible investigation separates facts, interpretations, hypotheses, contributing factors, and supported causes. Methods such as timelines, 5 Whys, barrier analysis, and change analysis organize the inquiry; they do not create evidence. If the conclusion is only “worker error,” keep looking at task design, equipment, materials, environment, workload, supervision, maintenance, procurement, and management systems.", "treatment": "Short retrieval summary.", "visualDirection": "No visual required.", "accessibility": "Plain text.", "objectives": ["LO5"], "sources": ["CCOHS-INVEST"], "module": "T5", "moduleTitle": "What happened, and what conditions made it possible?", "visual": null, "optional": false}, {"id": "F5-01", "kind": "formative", "type": "formative self-assessment", "subtype": "categorization", "title": "Knowledge check", "question": {"id": "F5-01", "itemType": "categorization", "objectives": ["LO5"], "questionHtml": "<p>Classify each statement as direct evidence/observation or interpretation/hypothesis.<\/p>", "questionText": "Classify each statement as direct evidence/observation or interpretation/hypothesis.", "optionsRaw": "1. “The instrument log recorded an alarm at 14:06.”<br>2. “The operator ignored safety.”<br>3. “The container label used project shorthand.”<br>4. “The maintenance delay caused the event.”", "correctRaw": "Evidence/observation: 1 and 3. Interpretation/hypothesis requiring support: 2 and 4.", "feedbackCorrectHtml": "<p>Logs and label wording are direct records/observations. Statements about intent or causation require additional evidence.<\/p>", "feedbackIncorrectHtml": "<p>If 2 or 4 is treated as established fact, the learner is skipping the evidence step. If 1 or 3 is treated as only interpretation, the learner is overlooking directly verifiable records/conditions.<\/p>", "sources": ["CCOHS-INVEST", "source dossier §16"], "graded": false, "difficulty": null, "accessibility": "Use four keyboard-operable drop-downs labelled Evidence/observation or Interpretation/hypothesis.", "mode": "category", "prompts": [{"key": "1", "text": "“The instrument log recorded an alarm at 14:06.”"}, {"key": "2", "text": "“The operator ignored safety.”"}, {"key": "3", "text": "“The container label used project shorthand.”"}, {"key": "4", "text": "“The maintenance delay caused the event.”"}], "answerMap": {"1": "Evidence/observation", "3": "Evidence/observation", "2": "Interpretation/hypothesis requiring support", "4": "Interpretation/hypothesis requiring support"}, "categories": ["Evidence/observation", "Interpretation/hypothesis requiring support"]}, "objectives": ["LO5"], "sources": ["CCOHS-INVEST", "source dossier §16"], "module": "T5", "moduleTitle": "What happened, and what conditions made it possible?", "visual": null, "optional": false}, {"id": "F5-02", "kind": "formative", "type": "formative self-assessment", "subtype": "multiple choice", "title": "Knowledge check", "question": {"id": "F5-02", "itemType": "multiple choice", "objectives": ["LO5"], "questionHtml": "<p>Which question best moves an investigation beyond “the worker chose the wrong container”?<\/p>", "questionText": "Which question best moves an investigation beyond “the worker chose the wrong container”?", "optionsRaw": "A. “Why was the worker careless?”<br>B. “Which worker should be disciplined?”<br>C. “How were the waste streams identified and separated, what had changed in the process, and had earlier warning signs been addressed?”<br>D. “Can we close the investigation after retraining?”", "correctRaw": "C", "feedbackCorrectHtml": "<p>The question examines task design, identification, segregation, change, and prior system signals rather than assuming a personal cause.<\/p>", "feedbackIncorrectHtml": "<p>A and B assume blame before causal analysis. D jumps to an action before establishing causes.<\/p>", "sources": ["CCOHS-INVEST", "AB-OHS-2 s.7", "AB-OHS-29 s.396"], "graded": false, "difficulty": null, "accessibility": "Single-select list.", "mode": "single", "options": [{"key": "A", "text": "“Why was the worker careless?”"}, {"key": "B", "text": "“Which worker should be disciplined?”"}, {"key": "C", "text": "“How were the waste streams identified and separated, what had changed in the process, and had earlier warning signs been addressed?”"}, {"key": "D", "text": "“Can we close the investigation after retraining?”"}], "correctKey": "C"}, "objectives": ["LO5"], "sources": ["CCOHS-INVEST", "AB-OHS-2 s.7", "AB-OHS-29 s.396"], "module": "T5", "moduleTitle": "What happened, and what conditions made it possible?", "visual": null, "optional": false}, {"id": "F5-03", "kind": "formative", "type": "formative self-assessment", "subtype": "matching", "title": "Knowledge check", "question": {"id": "F5-03", "itemType": "matching", "objectives": ["LO5"], "questionHtml": "<p>Match the investigation method to the question it is best suited to organize.<\/p>", "questionText": "Match the investigation method to the question it is best suited to organize.", "optionsRaw": "1. “What happened first, next, and after the alarm?”<br>2. “Which preventive or mitigative controls should have stopped this?”<br>3. “What was different from the normal process?”<br>4. “Can repeated why-questions push us past the immediate event?”", "correctRaw": "1 → Timeline; 2 → Barrier analysis; 3 → Change analysis; 4 → 5 Whys.", "feedbackCorrectHtml": "<p>Each method structures a different type of inquiry; none replaces evidence.<\/p>", "feedbackIncorrectHtml": "<p>Incorrect matches should explain the method’s purpose and remind the learner that method choice does not prove causation.<\/p>", "sources": ["CCOHS-INVEST", "source dossier §17"], "graded": false, "difficulty": null, "accessibility": "Four drop-downs or numbered matching fields.", "mode": "matching", "prompts": [{"key": "1", "text": "“What happened first, next, and after the alarm?”"}, {"key": "2", "text": "“Which preventive or mitigative controls should have stopped this?”"}, {"key": "3", "text": "“What was different from the normal process?”"}, {"key": "4", "text": "“Can repeated why-questions push us past the immediate event?”"}], "answerMap": {"1": "Timeline", "2": "Barrier analysis", "3": "Change analysis", "4": "5 Whys"}, "targets": ["Timeline", "Barrier analysis", "Change analysis", "5 Whys"]}, "objectives": ["LO5"], "sources": ["CCOHS-INVEST", "source dossier §17"], "module": "T5", "moduleTitle": "What happened, and what conditions made it possible?", "visual": null, "optional": false}, {"id": "F5-04", "kind": "formative", "type": "formative self-assessment", "subtype": "scenario judgment", "title": "Knowledge check", "question": {"id": "F5-04", "itemType": "scenario judgment", "objectives": ["LO5"], "questionHtml": "<p>A 5 Whys exercise ends with “insufficient training” as the fifth answer. What is the best next step?<\/p>", "questionText": "A 5 Whys exercise ends with “insufficient training” as the fifth answer. What is the best next step?", "optionsRaw": "A. Treat it as proven because it was the fifth why.<br>B. Check whether evidence supports a training/competence gap and whether other causal branches such as equipment, task design, workload, or supervision also matter.<br>C. Stop because 5 Whys always produces one root cause.<br>D. Automatically schedule retraining and close the investigation.", "correctRaw": "B", "feedbackCorrectHtml": "<p>5 Whys is a questioning tool. The proposed cause still requires evidence, and complex events can have multiple interacting causes.<\/p>", "feedbackIncorrectHtml": "<p>A/C overstate the method. D chooses an action before verifying the cause and ignores other possible factors.<\/p>", "sources": ["CCOHS-INVEST"], "graded": false, "difficulty": null, "accessibility": "Single-select list.", "mode": "single", "options": [{"key": "A", "text": "Treat it as proven because it was the fifth why."}, {"key": "B", "text": "Check whether evidence supports a training/competence gap and whether other causal branches such as equipment, task design, workload, or supervision also matter."}, {"key": "C", "text": "Stop because 5 Whys always produces one root cause."}, {"key": "D", "text": "Automatically schedule retraining and close the investigation."}], "correctKey": "B"}, "objectives": ["LO5"], "sources": ["CCOHS-INVEST"], "module": "T5", "moduleTitle": "What happened, and what conditions made it possible?", "visual": null, "optional": false}, {"id": "T6-01", "kind": "content", "type": "topic title", "subtype": "relevance", "title": "Fixing the visible problem is not the same as preventing recurrence", "contentHtml": "<p>A laboratory can close an immediate problem without fixing the system that produced it. CAPA thinking separates what must happen <strong>now<\/strong> from what must change <strong>because of the causes<\/strong> and how the organization will confirm that the change worked. Health Canada’s current Natural Health Products GMP guide provides a regulated example of this process, but the term CAPA is not a universal legal requirement for every laboratory.<\/p>", "contentText": "A laboratory can close an immediate problem without fixing the system that produced it. CAPA thinking separates what must happen now from what must change because of the causes and how the organization will confirm that the change worked. Health Canada’s current Natural Health Products GMP guide provides a regulated example of this process, but the term CAPA is not a universal legal requirement for every laboratory.", "treatment": "Begins with applicability boundary before terminology.", "visualDirection": "Original “Immediate → Cause → Action → Effectiveness” pathway.", "accessibility": "Text is full alternative.", "objectives": ["LO6"], "sources": ["HC-GMP-V4", "HC-CAPA"], "module": "T6", "moduleTitle": "Fixing the visible problem is not the same as preventing recurrence", "visual": null, "optional": false}, {"id": "T6-02", "kind": "content", "type": "comparison", "subtype": "terminology", "title": "Correction, containment, corrective action, preventive action", "contentHtml": "<p><strong>Correction:<\/strong> fix the detected condition now.<br><br><strong>Containment:<\/strong> limit spread or impact while the problem is investigated.<br><br><strong>Corrective action:<\/strong> address supported causes of the detected problem so recurrence is less likely.<br><br><strong>Preventive action:<\/strong> address the same or a credible related failure before it occurs elsewhere.<br><br>Organizations may use different terminology, especially for preventive action. Use the organization’s defined system while preserving the underlying distinctions.<\/p>", "contentText": "Correction: fix the detected condition now. Containment: limit spread or impact while the problem is investigated. Corrective action: address supported causes of the detected problem so recurrence is less likely. Preventive action: address the same or a credible related failure before it occurs elsewhere. Organizations may use different terminology, especially for preventive action. Use the organization’s defined system while preserving the underlying distinctions.", "treatment": "Teaches the four CAPA terms that learners will use in the scenario.", "visualDirection": "Original four-column comparison with one simple generic example per column.", "accessibility": "Text provides definitions; examples must not add unsupported regulatory meaning.", "objectives": ["LO6"], "sources": ["HC-CAPA"], "module": "T6", "moduleTitle": "Fixing the visible problem is not the same as preventing recurrence", "visual": null, "optional": false}, {"id": "T6-03", "kind": "content", "type": "process", "subtype": "CAPA record", "title": "What a useful CAPA record needs to connect", "contentHtml": "<p>A useful record connects:<br><br><strong>problem statement → scope and impact/risk → immediate correction/containment → evidence → causes/contributing factors → actions → owners/resources/due dates → interim controls → required document/change updates → verification → effectiveness review → closure or escalation.<\/strong><br><br>The chain matters. If an action cannot be linked to a supported cause or risk, ask why it is being done.<\/p>", "contentText": "A useful record connects: problem statement → scope and impact/risk → immediate correction/containment → evidence → causes/contributing factors → actions → owners/resources/due dates → interim controls → required document/change updates → verification → effectiveness review → closure or escalation. The chain matters. If an action cannot be linked to a supported cause or risk, ask why it is being done.", "treatment": "CAPA architecture as logic chain.", "visualDirection": "Original linear-to-loop CAPA diagram; after effectiveness, arrow returns to risk assessment if needed.", "accessibility": "Provide the full chain in text.", "objectives": ["LO6"], "sources": ["HC-CAPA"], "module": "T6", "moduleTitle": "Fixing the visible problem is not the same as preventing recurrence", "visual": "V-17", "optional": false}, {"id": "T6-04", "kind": "content", "type": "content", "subtype": "action design", "title": "Write actions that can be evaluated", "contentHtml": "<p>For each corrective action, identify the causal factor it addresses, the owner, required resources, due date, dependencies, interim controls if the permanent change takes time, and any document or change-control updates. Avoid vague commitments such as “be more careful” or “from now on.” An action should be specific enough that someone can verify it was implemented and later test whether it changed the intended outcome.<\/p>", "contentText": "For each corrective action, identify the causal factor it addresses, the owner, required resources, due date, dependencies, interim controls if the permanent change takes time, and any document or change-control updates. Avoid vague commitments such as “be more careful” or “from now on.” An action should be specific enough that someone can verify it was implemented and later test whether it changed the intended outcome.", "treatment": "Operationalizes CAPA record quality without prescribing a form.", "visualDirection": "No visual required.", "accessibility": "Plain text.", "objectives": ["LO6"], "sources": ["HC-CAPA"], "module": "T6", "moduleTitle": "Fixing the visible problem is not the same as preventing recurrence", "visual": null, "optional": false}, {"id": "T6-05", "kind": "content", "type": "comparison", "subtype": "weak vs stronger action", "title": "When retraining is not enough", "contentHtml": "<p>Retraining makes sense when the evidence shows a knowledge or competence gap. It will not fix a confusing interface, missing engineering control, incompatible storage arrangement, unrealistic workload, degraded equipment, or a procedure that does not match the work. In those cases, training can support the change, but the action also needs to address the condition that ca
