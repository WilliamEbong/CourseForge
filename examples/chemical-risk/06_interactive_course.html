, "sources": ["AB-OHS-2"]}, {"term": "Root cause", "definitionHtml": "<p>An underlying causal factor whose effective control should materially reduce recurrence. Complex incidents can have multiple interacting causes.<\/p>", "sources": ["CCOHS-INVEST"]}, {"term": "Safety Data Sheet (SDS)", "definitionHtml": "<p>A standardized hazardous-product information document. It supports hazard communication but is not a complete task-specific risk assessment.<\/p>", "sources": ["CCOHS-SDS"]}, {"term": "Substitution", "definitionHtml": "<p>Replacing a hazard or process with a less hazardous alternative, followed by reassessment of the resulting risk.<\/p>", "sources": ["AB-OHS-2 s.9", "source dossier §9.2"]}, {"term": "WHMIS", "definitionHtml": "<p>Workplace Hazardous Materials Information System, Canada’s workplace hazardous-product communication system.<\/p>", "sources": ["HC-WHMIS-RR"]}, {"term": "Work-site label", "definitionHtml": "<p>The Alberta workplace label used in specified circumstances for hazardous products, including many decanted products.<\/p>", "sources": ["AB-OHS-29 ss.398, 400"]}], "acronyms": [{"acronym": "CAPA", "term": "Corrective and Preventive Action", "firstUse": "S1-03"}, {"acronym": "GHS", "term": "Globally Harmonized System of Classification and Labelling of Chemicals", "firstUse": "S2-06"}, {"acronym": "HPA", "term": "Hazardous Products Act", "firstUse": "S2-07"}, {"acronym": "HPR", "term": "Hazardous Products Regulations", "firstUse": "S2-07"}, {"acronym": "OEL", "term": "Occupational Exposure Limit", "firstUse": "T1-06"}, {"acronym": "OHS", "term": "Occupational Health and Safety", "firstUse": "T1-05"}, {"acronym": "PPE", "term": "Personal Protective Equipment", "firstUse": "S1-04"}, {"acronym": "SDS", "term": "Safety Data Sheet", "firstUse": "S1-03"}, {"acronym": "WHMIS", "term": "Workplace Hazardous Materials Information System", "firstUse": "S1-03"}], "references": {"HPA-13": {"id": "HPA-13", "issuer": "Government of Canada, Justice Laws", "t   function requiredScreens(){return COURSE.screens.filter(isRequired)}

    nav.innerHTML='';
    moduleOrder().forEach(key=>{
      const group=document.createElement('div');group.className='module';
      const btn=document.createElement('button');btn.type='button';btn.dataset.module=key;
      const screens=moduleScreens(key), visited=screens.filter(s=>state.visited[s.id]).length;
      btn.innerHTML=`${esc(COURSE.modules[key]||key)} <span class="module-count">${visited}/${screens.length}</span>`;
      btn.addEventListener('click',()=>{list.hidden=!list.hidden;btn.setAttribute('aria-expanded',String(!list.hidden))});
      const list=document.createElement('div');list.className='screen-list';list.hidden=key!==COURSE.screens[current].module;
      btn.setAttribute('aria-expanded',String(!list.hidden));
      screens.forEach(s=>{
        const i=COURSE.screens.indexOf(s), b=document.createElement('button');b.type='button';b.className='screen-link'+(state.visited[s.id]?' visited':'')+(i===current?' current':'');
        b.innerHTML=`<span class="dot ${s.optional?'optional-dot':''}"></span><span>${esc(screenLabel(s))}${s.optional?' · Optional':''}</span>`;
        b.addEventListener('click',()=>go(i));list.appendChild(b);
      });
      group.append(btn,list);nav.appendChild(group);
    });
  }

  function sourceBase(token){
    const keys=Object.keys(COURSE.references).sort((a,b)=>b.length-a.length);
    return keys.find(k=>token===k||token.startsWith(k+' ')||token.startsWith(k+','))||null;
  }
  function citations(sources){
    if(!sources?.length)return '';
    return `<div class="source-row"><span class="sr-only">Sources:</span>${sources.map(t=>`<button type="button" class="cite" data-source="${esc(t)}">${esc(t)}</button>`).join('')}</div>`;
  }
  function objectives(objs){return objs?.length?`<div class="objective-row">${objs.map(o=>`<span class="objective">${esc(o)}</span>`).join('')}</div>`:''}
  function bindCites(root=host){root.querySelectorAll('[data-source]').forEach(b=>b.addEventListener('click',()=>showSource(b.dataset.source)))}
  function showSource(token){
    const base=sourceBase(token), r=base?COURSE.references[base]:null;
    document.getElementById('sourceBody').innerHTML=r?`<div class="source-detail"><div class="badge">${esc(base)}</div><h3>${esc(r.title)}</h3><p><strong>${esc(r.issuer)}</strong><br>${esc(r.date)}</p><p>${token!==base?`Cited as: <strong>${esc(token)}</strong>`:''}</p><p><a href="${esc(r.url)}" target="_blank" rel="noopener">Open authoritative source ↗</a></p></div>`:`<div class="source-detail"><div class="badge">Internal citation</div><h3>${esc(token)}</h3><p>This citation points to the course's internal research dossier or synthesis layer rather than an external reference entry.</p></div>`;
    document.getElementById('sourceDlg').showModal();
  }

  function visual(vid){
    if(!vid)return '';
    const v=COURSE.visuals[vid]; if(!v)return '';
    const wrap=(inner)=>`<figure class="visual" aria-label="${esc(v.alt)}"><figcaption class="visual-title">Interactive diagram · ${esc(v.purpose)}</figcaption>${inner}<details style="margin-top:14px"><summary>Text alternative</summary><p>${esc(v.alt)}</p></details></figure>`;
    const flow=arr=>`<div class="flow">${arr.map((x,i)=>`${i?'<span class="arrow" aria-hidden="true">→</span>':''}<div class="step">${esc(x)}</div>`).join('')}</div>`;
    switch(vid){
      case 'V-01': return wrap(`<div class="flow loop">${['Identify','Assess','Control','Verify','Respond / escalate','Investigate','Correct','Check effectiveness','Learn / reassess'].map((x,i)=>`${i?'<span class="arrow" aria-hidden="true">→</span>':''}<div class="step">${x}</div>`).join('')}</div>`);
      case 'V-02': return wrap(`<div class="ladder">${['Legislation / regulation','Government guidance','Standards / frameworks','Peer-reviewed evidence','Good-practice synthesis'].map(x=>`<div class="rung">${x}</div>`).join('')}</div>`);
      case 'V-03': return wrap(flow(['Hazard','Exposure opportunity','Task-specific risk']));
      case 'V-04': return wrap(`<div class="split"><div><h4>Federal supplier side</h4><ul><li>Classification</li><li>Supplier label</li><li>Supplier SDS</li></ul></div><div><h4>Alberta workplace side</h4><ul><li>Hazard assessment & controls</li><li>Training & work-site labels</li><li>SDS acquisition & access</li></ul></div></div>`);
      case 'V-05': return wrap(`<div class="wheel">${['Amount / concentration','Physical form','Duration / frequency','Worker proximity','Process energy','Incompatibility','Equipment / ventilation','Abnormal conditions'].map(x=>`<div class="node">${x}</div>`).join('')}</div>`);
      case 'V-06': return wrap(`<div class="decision">${['What exactly is the task?','What hazards matter?','How could exposure or an uncontrolled event occur?','What amount, concentration, form, duration and energy are involved?','What controls exist, and how reliable are they?','What abnormal condition could defeat the controls?','What risk remains, and does this require specialist or local authority?'].map(x=>`<div class="dstep"><div>${x}</div></div>`).join('')}</div>`);
      case 'V-07': return wrap(`<div class="sdsgrid">${['1 Identification','2 Hazards','3 Composition','4 First aid','5 Fire fighting','6 Accidental release','7 Handling / storage','8 Exposure controls / PPE','9 Physical properties','10 Stability / reactivity','11 Toxicology','12 Ecology','13 Disposal','14 Transport','15 Regulatory','16 Other information'].map(x=>`<div class="sdssec"><b>Section ${x.split(' ')[0]}</b>${x.substring(x.indexOf(' ')+1)}</div>`).join('')}</div>`);
      case 'V-08': return wrap(`${flow(['SDS','Task details','Equipment / ventilation','Exposure conditions','Abnormal conditions'])}<div style="text-align:center;margin-top:12px;font-weight:800">↓ Task-specific assessment</div>`);
      case 'V-09': return wrap(flow(['Receive','Assign owner & location','Use / review','Waste','Disposal','Close record']));
      case 'V-10': return wrap(`<div class="hierarchy">${['Elimination','Substitution','Engineering controls','Administrative controls','Personal protective equipment (PPE)'].map(x=>`<div class="level">${x}</div>`).join('')}</div>`);
      case 'V-11': return wrap(`<div class="shelf"><div class="chem">Compatible group A</div><div class="chem sep">Separated</div><div class="chem">Compatible group B</div><div class="chem">Reactive property drives placement</div><div class="chem sep">Not alphabetical alone</div><div class="chem">Use SDS / local guidance</div></div>`);
      case 'V-12': return wrap(`<div class="hood"><div><div>Worker</div><div class="air">→</div><small>Keep breathing zone outside capture area</small></div><div class="chamber"><strong>Local exhaust / hood</strong><p>Capture contaminants near the source</p><div class="air">⇢ ⇢ ⇢</div></div><div><div>Airflow influences</div><small>Cross-drafts · obstructions · placement · maintenance</small></div></div>`);
      case 'V-13': return wrap(`<div class="split"><div><h4>Explicit Alberta triggers</h4><ul><li>New process</li><li>Changed process or operation</li><li>Significant work-site addition / alteration</li><li>Periodic reassessment</li></ul></div><div><h4>Additional good-practice triggers</h4><ul><li>Scale-up</li><li>New material / concentration</li><li>Incident or near miss</li><li>Equipment / ventilation change</li><li>New evidence or competency change</li></ul></div></div>`);
      case 'V-14': return wrap(`<div class="timeline">${['Emergency control and care','Stabilize the situation','Report / escalate through local process','Preserve the scene and evidence when safe','Investigate and learn'].map(x=>`<div class="tstep"><div>${x}</div></div>`).join('')}</div>`);
      case 'V-15': return wrap(`<div class="quad"><div><h4>Physical</h4><p>Equipment, containers, residue, damaged parts</p></div><div><h4>Documentary</h4><p>Procedures, training, maintenance, inventory</p></div><div><h4>Electronic / system</h4><p>Logs, alarms, access records, audit trails</p></div><div><h4>Witness</h4><p>Direct observations and context</p></div></div>`);
      case 'V-16': return wrap(`<div class="wheel">${['Task design','Equipment','Materials','Environment','Workload','Training / competence','Supervision','Procurement / maintenance','Management system'].map(x=>`<div class="node">${x}</div>`).join('')}</div>`);
      case 'V-17': return wrap(flow(['Problem','Immediate action','Evidence','Cause','Action','Verification','Effectiveness','Closure / escalation']));
      case 'V-18': return wrap(`<div class="split"><div><h4>Verification</h4><p>Was the planned action actually implemented?</p><p><strong>Example:</strong> Was the procedure revised and issued?</p></div><div><h4>Effectiveness</h4><p>Did the intended outcome or control performance improve?</p><p><strong>Example:</strong> Did the recurring failure stop over enough opportunities to judge?</p></div></div>`);
      case 'V-19': return wrap(`<div class="split"><div><h4>Leading</h4><ul><li>Risk assessments reviewed</li><li>Corrective actions overdue</li><li>Engineering controls verified</li></ul></div><div><h4>Lagging</h4><ul><li>Injuries / exposures</li><li>Spills / fires</li><li>Repeat adverse events</li></ul></div></div><p style="text-align:center;margin:12px 0 0"><strong>Use both.</strong> Neither type tells the whole story alone.</p>`);
      case 'V-20': return wrap(`<div class="case4"><div><strong>1 · Before</strong><p>Information, labels, compatibility, controls, change</p></div><div><strong>2 · Event</strong><p>Protect people, stop escalation, report</p></div><div><strong>3 · Investigate</strong><p>Evidence, system factors, supported causes</p></div><div><strong>4 · CAPA</strong><p>Action-to-cause alignment and effectiveness</p></div></div>`);
      default:return wrap(`<p>${esc(v.content)}</p>`);
    }
  }

  function renderContent(s){
    const badge=s.type==='course review'?'<span class="badge review">Course review</span>':s.optional?'<span class="badge optional">Optional depth</span>':`<span class="badge">${esc(s.type)}</span>`;
    return `<div class="crumb"><span>${esc(s.moduleTitle)}</span><span aria-hidden="true">·</span><span>${esc(s.id)}</span></div>${badge}<h1 class="screen-title">${esc(s.title)}</h1>${s.optional?'<div class="optional-note"><strong>Optional technical depth.</strong> This block is available for deeper study and is outside the core seat-time estimate.</div>':''}<article class="card learner">${s.contentHtml}${visual(s.visual)}${objectives(s.objectives)}${citations(s.sources)}</article>`;
  }

  function renderQuestion(s){
    const q=s.question, formative=s.kind==='formative';
    const prior=(formative?state.formative:state.graded)[q.id];
    let control='';
    if(q.mode==='single'){
      control=q.options.map(o=>`<label class="choice"><input type="radio" name="${q.id}" value="${esc(o.key)}" ${prior?.answer===o.key?'checked':''}><span><strong>${esc(o.key)}.</strong> ${esc(o.text)}</span></label>`).join('');
    } else if(q.mode==='multi'){
      const prev=prior?.answer||[];
      control=q.options.map(o=>`<label class="choice"><input type="checkbox" name="${q.id}" value="${esc(o.key)}" ${prev.includes?.(o.key)?'checked':''}><span><strong>${esc(o.key)}.</strong> ${esc(o.text)}</span></label>`).join('');
    } else if(q.mode==='matching'){
      control=q.prompts.map(p=>`<div class="match-row"><div><strong>${esc(p.key)}.</strong> ${esc(p.text)}</div><select data-match="${esc(p.key)}" aria-label="Match for ${esc(p.text)}"><option value="">Choose…</option>${q.targets.map(t=>`<option ${prior?.answer?.[p.key]===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`).join('');
    } else if(q.mode==='category'){
      control=q.prompts.map(p=>`<div class="cat-row"><div><strong>${esc(p.key)}.</strong> ${esc(p.text)}</div><select data-cat="${esc(p.key)}" aria-label="Category for ${esc(p.text)}"><option value="">Choose…</option>${q.categories.map(t=>`<option ${prior?.answer?.[p.key]===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`).join('');
    } else if(q.mode==='sequence'){
      const arr=prior?.answer?.length?prior.answer:[...q.items];
      control=`<div class="seq-list" id="seqList">${arr.map((it,i)=>`<div class="seq-item" data-item="${esc(it)}"><span class="seq-num">${i+1}</span><span>${esc(it)}</span><span class="seq-actions"><button type="button" data-up aria-label="Move ${esc(it)} up">↑</button><button type="button" data-down aria-label="Move ${esc(it)} down">↓</button></span></div>`).join('')}</div>`;
    } else {
      control=`<div class="case-note"><p>${esc(q.optionsRaw)}</p></div>`;
    }
    const label= formative?'Formative practice':`Graded assessment · ${q.difficulty||'item'}`;
    return `<div class="crumb"><span>${esc(s.moduleTitle)}</span><span aria-hidden="true">·</span><span>${esc(s.id)}</span></div><span class="badge assess">${esc(label)}</span><h1 class="screen-title">${formative?'Check your reasoning':'Assessment'}</h1><section class="qcard"><div class="qhead"><div class="objective-row">${q.objectives.map(o=>`<span class="objective">${esc(o)}</span>`).join('')}</div><div class="qprompt">${q.questionHtml}</div></div><div class="qbody"><form id="qform">${control}<button class="checkbtn" type="submit">${prior?.submitted?'Check again':'Submit response'}</button><div id="feedbackArea">${prior?.submitted?feedbackHtml(q,prior.correct):''}</div></form>${citations(q.sources)}</div></section>`;
  }

  function feedbackHtml(q,correct){return `<div class="feedback ${correct?'good':'bad'}" role="status"><h4>${correct?'That reasoning is supported.':'Review the reasoning.'}</h4>${correct?q.feedbackCorrectHtml:q.feedbackIncorrectHtml}${q.graded?`<details><summary>Answer rationale</summary><p><strong>Expected answer:</strong> ${esc(q.correctRaw)}</p></details>`:''}</div>`}

  function gradeQuestion(q,form){
    let answer, correct=false;
    if(q.mode==='single'){
      answer=form.querySelector(`input[name="${CSS.escape(q.id)}"]:checked`)?.value||''; correct=answer===q.correctKey;
    } else if(q.mode==='multi'){
      answer=[...form.querySelectorAll(`input[name="${CSS.escape(q.id)}"]:checked`)].map(x=>x.value).sort();
      const exp=[...q.correctKeys].sort();correct=answer.length===exp.length&&answer.every((x,i)=>x===exp[i]);
    } else if(q.mode==='matching'){
      answer={};form.querySelectorAll('[data-match]').forEach(x=>answer[x.dataset.match]=x.value);
      correct=Object.entries(q.answerMap).every(([k,v])=>norm(answer[k])===norm(v));
    } else if(q.mode==='category'){
      answer={};form.querySelectorAll('[data-cat]').forEach(x=>answer[x.dataset.cat]=x.value);
      correct=Object.entries(q.answerMap).every(([k,v])=>norm(answer[k])===norm(v));
    } else if(q.mode==='sequence'){
      answer=[...form.querySelectorAll('.seq-item')].map(x=>x.dataset.item);
      correct=answer.length===q.correctSequence.length&&answer.every((x,i)=>norm(x)===norm(q.correctSequence[i]));
    } else {answer='revealed';correct=true}
    return {answer,correct,submitted:true};
  }

  function bindQuestion(s){
    const q=s.question, form=document.getElementById('qform'); if(!form)return;
    if(q.mode==='sequence'){
      const list=form.querySelector('#seqList');
      const refresh=()=>[...list.children].forEach((r,i)=>{r.querySelector('.seq-num').textContent=i+1;r.querySelector('[data-up]').disabled=i===0;r.querySelector('[data-down]').disabled=i===list.children.length-1});
      list.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const row=b.closest('.seq-item');if(b.hasAttribute('data-up')&&row.previousElementSibling)list.insertBefore(row,row.previousElementSibling);if(b.hasAttribute('data-down')&&row.nextElementSibling)list.insertBefore(row.nextElementSibling,row);refresh()});refresh();
    }
    form.addEventListener('submit',e=>{
      e.preventDefault(); const result=gradeQuestion(q,form); const bucket=s.kind==='formative'?state.formative:state.graded;bucket[q.id]=result;saveState();
      document.getElementById('feedbackArea').innerHTML=feedbackHtml(q,result.correct);updateChrome();
      document.getElementById('feedbackArea').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'});
    });
  }

  function gradedSummary(){
    const graded=COURSE.screens.filter(s=>s.kind==='graded'), answered=graded.filter(s=>state.graded[s.id]?.submitted), correct=graded.filter(s=>state.graded[s.id]?.correct).length;
    const pct=answered.length?Math.round(correct/graded.length*100):0;
    return {total:graded.length,answered:answered.length,correct,pct};
  }

  function render(){
    const s=COURSE.screens[current];state.visited[s.id]=true;saveState();
    document.getElementById('moduleLabel').textContent=s.moduleTitle;
    let inner=s.kind==='content'?renderContent(s):renderQuestion(s);
    if(s.kind==='graded'&&s.id==='GA-15'){
      const r=gradedSummary();
      inner+=`<section class="card" style="margin-top:18px"><h2>Assessment progress</h2><div class="result-grid"><div><div class="result-big">${r.answered}</div><div>of ${r.total} answered</div></div><div><div class="result-big">${r.correct}</div><div>correct</div></div><div><div class="result-big">${r.pct}%</div><div>current score</div></div></div><p><strong>Storyboard suggestion:</strong> a passing-score range of 75–80% may be used by an implementing organization. This independent portfolio course does not set a certification threshold.</p><button type="button" class="checkbtn" id="resetAssessment">Reset graded assessment</button></section>`;
    }
    inner+=navRow();host.innerHTML=inner;bindCites(); if(s.kind!=='content')bindQuestion(s);
    const reset=document.getElementById('resetAssessment');if(reset)reset.addEventListener('click',()=>{if(confirm('Reset all graded assessment responses?')){state.graded={};saveState();render();}});
    buildNav();updateChrome();host.focus({preventScroll:true});window.scrollTo({top:0,behavior:'auto'});
  }
  function navRow(){return `<div class="navrow"><button class="prev" id="prevBtn" type="button" ${current===0?'disabled':''}>← Previous</button><div class="screen-count">${current+1} of ${COURSE.screens.length}</div><button class="next" id="nextBtn" type="button" ${current===COURSE.screens.length-1?'disabled':''}>Next →</button></div>`}
  function bindNavRow(){const p=document.getElementById('prevBtn'),n=document.getElementById('nextBtn');if(p)p.addEventListener('click',()=>go(current-1));if(n)n.addEventListener('click',()=>go(current+1))}
  const _render=render;render=function(){_render();bindNavRow();};
  function go(i){if(i<0||i>=COURSE.screens.length)return;current=i;closeMenu();render()}
  function updateChrome(){const p=progress();document.getElementById('progressFill').style.width=p+'%';document.getElementById('progressLabel').textContent=p+'%';}

  function openMenu(){sidebar.classList.add('open');overlay.classList.add('show');menuBtn.setAttribute('aria-expanded','true')}
  function closeMenu(){sidebar.classList.remove('open');overlay.classList.remove('show');menuBtn.setAttribute('aria-expanded','false')}
  menuBtn.addEventListener('click',()=>sidebar.classList.contains('open')?closeMenu():openMenu());overlay.addEventListener('click',closeMenu);

  function setupDialogs(){
    document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>document.getElementById(b.dataset.close).close()));
    const openGloss=()=>{renderGloss('');document.getElementById('glossDlg').showModal()};
    const openRefs=()=>{renderRefs('');document.getElementById('refsDlg').showModal()};
    document.getElementById('glossBtn').addEventListener('click',openGloss);
    document.getElementById('refsBtn').addEventListener('click',openRefs);
    document.getElementById('sideGlossBtn').addEventListener('click',()=>{closeMenu();openGloss()});
    document.getElementById('sideRefsBtn').addEventListener('click',()=>{closeMenu();openRefs()});
    document.getElementById('aboutBtn').addEventListener('click',()=>{document.getElementById('aboutDlg').showModal()});
    document.getElementById('glossSearch').addEventListener('input',e=>renderGloss(e.target.value));
    document.getElementById('refSearch').addEventListener('input',e=>renderRefs(e.target.value));
  }
  function renderGloss(q){q=q.toLowerCase();const entries=COURSE.glossary.filter(x=>(x.term+' '+stripHtml(x.definitionHtml)).toLowerCase().includes(q));const acr=COURSE.acronyms.filter(x=>(x.acronym+' '+x.term).toLowerCase().includes(q));document.getElementById('glossList').innerHTML=entries.map(x=>`<div class="gloss-item"><h3>${esc(x.term)}</h3><div>${x.definitionHtml}</div>${citations(x.sources)}</div>`).join('')+(acr.length?`<h3 style="margin-top:24px">Acronyms</h3>${acr.map(x=>`<div class="gloss-item"><h3>${esc(x.acronym)}</h3><p>${esc(x.term)} <span class="ref-meta">· first used ${esc(x.firstUse)}</span></p></div>`).join('')}`:'');bindCites(document.getElementById('glossList'))}
  function renderRefs(q){q=q.toLowerCase();const arr=Object.values(COURSE.references).filter(x=>(x.id+' '+x.issuer+' '+x.title+' '+x.date).toLowerCase().includes(q));document.getElementById('refList').innerHTML=arr.map(r=>`<div class="ref-item"><h3><span class="badge">${esc(r.id)}</span> ${esc(r.title)}</h3><div class="ref-meta">${esc(r.issuer)} · ${esc(r.date)}</div><p><a href="${esc(r.url)}" target="_blank" rel="noopener">Open source ↗</a></p></div>`).join('')}
  function renderAbout(){const m=COURSE.metadata;document.getElementById('aboutBody').innerHTML=`<p>${esc(m['Course description']||'')}</p><dl class="about-table"><dt>Audience</dt><dd>${esc(m['Intended audience']||'')}</dd><dt>Prior knowledge</dt><dd>${esc(m['Assumed prior knowledge']||'')}</dd><dt>Estimated seat time</dt><dd>${esc(m['Estimated seat time']||'')}</dd><dt>Scope boundary</dt><dd>${esc(m['Scope and qualification boundaries']||'')}</dd><dt>Build source</dt><dd>${esc(COURSE.build.sourceFile)}</dd></dl><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><button type="button" class="prev" id="restartCourse" style="min-height:44px;padding:9px 13px;border-radius:9px;border:1px solid var(--line)">Reset course progress</button>`;document.getElementById('restartCourse').addEventListener('click',()=>{if(confirm('Reset visited screens and all responses?')){state={...defaultState};current=0;saveState();document.getElementById('aboutDlg').close();render();}})}

  document.addEventListener('keydown',e=>{
    if(e.target.matches('input,select,textarea,button')||document.querySelector('dialog[open]'))return;
    if(e.key==='ArrowRight')go(current+1);if(e.key==='ArrowLeft')go(current-1);
  });
  window.__courseApp={go:(i)=>go(i),getState:()=>JSON.parse(JSON.stringify(state)),screenCount:()=>COURSE.screens.length,screen:(i)=>COURSE.screens[i]};
  renderAbout();setupDialogs();render();
})();
</script>
</body>
</html>
